KEYS.coinlog = 'habipet_coinlog';   // { 'YYYY-MM-DD': {both:20, caf:5, quest:10} }
KEYS.items   = 'habipet_items';     // { owned:[id...], wear:{hat, glasses, bg} }
S.coinlog = load(KEYS.coinlog, {}) || {};
S.items = load(KEYS.items, null) || { owned:[], wear:{hat:null, glasses:null, bg:null} };
const COIN = { both:20, caf:5, quest:10 };

/* ── 코인: 하루 수면·물 목표 모두 달성 20, 카페인 목표 지킨 날 5 (예시 기록 제외) ── */
function runCoins(){
  if(!S.profile || !S.goals || !S.baseline) return;
  const start = S.baseline.savedAt || S.profile.createdAt, g = S.goals, got = [];
  for(let d = start; d <= today(); d = addDays(d,1)){
    const r = S.records[d]; if(!r || r.sample) continue;
    const c = S.coinlog[d] || {};
    const sm = sleepMinutes(r);
    if(!c.both && sm!=null && sm >= g.sleepMin && r.water >= g.water){ c.both = COIN.both; got.push(['both', COIN.both]); }
    if(!c.caf && d < today() && cafOf(r) <= g.caffeine){ c.caf = COIN.caf; got.push(['caf', COIN.caf]); }
    if(Object.keys(c).length) S.coinlog[d] = c;
  }
  if(!got.length) return;
  const sum = got.reduce((s,x)=>s+x[1],0);
  S.profile.coins = (S.profile.coins||0) + sum;
  save(KEYS.coinlog, S.coinlog); save(KEYS.profile, S.profile);
  renderStats();
  setTimeout(()=>toast(`+${sum} 코인 · ${got.map(x=>x[0]==='both'?'수면·물 목표 모두 달성':'카페인 목표 지킴').join(', ')}`), 2300);   // 경험치 알림 뒤에
}
const _runGrowth3 = runGrowth;
runGrowth = function(o){ _runGrowth3(o); runCoins(); };

/* ── 꾸미기 아이템 (같은 그림체: 2px #5A4A42 선, 흐린 파스텔) ── */
const L2 = 'stroke="#5A4A42" stroke-width="2" stroke-linejoin="round"';
const DECO = [
  { id:'hat_beanie', kind:'hat', name:'털모자', price:40,
    art:`<path d="M-17,4 Q-17,-16 0,-16 Q17,-16 17,4 Z" fill="#F2A48A" ${L2}/><path d="M-9,-12 v14 M0,-15 v17 M9,-12 v14" stroke="#E68C70" stroke-width="2"/><rect x="-18.5" y="-1" width="37" height="8" rx="3.5" fill="#F7CDBE" ${L2}/><circle cx="0" cy="-18" r="4.6" fill="#FFFFFF" ${L2}/>` },
  { id:'hat_straw', kind:'hat', name:'밀짚모자', price:60,
    art:`<ellipse cx="0" cy="3" rx="27" ry="6.5" fill="#F3D58A" ${L2}/><path d="M-13,3 Q-13,-14 0,-14 Q13,-14 13,3 Z" fill="#F6DE9E" ${L2}/><rect x="-13" y="-4" width="26" height="4.5" fill="#E89A86" stroke="#5A4A42" stroke-width="1.4"/>` },
  { id:'hat_party', kind:'hat', name:'생일 고깔', price:50,
    art:`<path d="M-11,4 L11,4 L0,-27 Z" fill="#C9B8FF" ${L2}/><path d="M-7,-6 L6,-3 M-4,-15 L4,-12" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/><circle cx="0" cy="-28" r="3.8" fill="#FFE07A" ${L2}/>` },
  { id:'gl_round', kind:'glasses', name:'동그란 안경', price:30,
    art:`<circle cx="-7" cy="0" r="6" fill="#FFFFFF" fill-opacity=".25" stroke="#5A4A42" stroke-width="1.8"/><circle cx="7" cy="0" r="6" fill="#FFFFFF" fill-opacity=".25" stroke="#5A4A42" stroke-width="1.8"/><path d="M-1,-1 Q0,-2.5 1,-1 M-13,-1 L-18,-3 M13,-1 L18,-3" fill="none" stroke="#5A4A42" stroke-width="1.6" stroke-linecap="round"/>` },
  { id:'gl_star', kind:'glasses', name:'별 선글라스', price:70,
    art:`${[-8,8].map(x=>`<path d="${starPath(x,0,7.5).replace(/(-?\d+\.?\d*) (-?\d+\.?\d*)/g,'$1,$2')}" fill="#3A2E2A" stroke="#5A4A42" stroke-width="1.4" stroke-linejoin="round"/>`).join('')}<path d="M-1.5,-1 L1.5,-1" stroke="#5A4A42" stroke-width="1.8"/><circle cx="-10" cy="-2.5" r="1.4" fill="#FFFFFF"/><circle cx="6" cy="-2.5" r="1.4" fill="#FFFFFF"/>` },
  { id:'bg_flower', kind:'bg', name:'꽃밭', price:60,
    art:`<rect width="400" height="400" fill="#EAF6EA"/><ellipse cx="200" cy="420" rx="330" ry="130" fill="#CDEBC0"/>${[[50,330,'#FFC3A8'],[110,360,'#C9B8FF'],[300,340,'#FFE07A'],[350,370,'#FFC3A8'],[250,375,'#A8D8FF'],[160,320,'#FFE07A']].map(([x,y,c])=>`<g><path d="M${x} ${y+6}v24" stroke="#5A4A42" stroke-width="2"/>${[0,72,144,216,288].map(a=>`<circle cx="${(x+7*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(y+7*Math.sin(a*Math.PI/180)).toFixed(1)}" r="5.5" fill="${c}" stroke="#5A4A42" stroke-width="1.5"/>`).join('')}<circle cx="${x}" cy="${y}" r="3.5" fill="#FFF3B8"/></g>`).join('')}` },
  { id:'bg_library', kind:'bg', name:'도서관', price:80,
    art:`<rect width="400" height="400" fill="#F3E9DC"/>${[60,150].map(y=>`<rect x="0" y="${y+58}" width="400" height="8" fill="#D2A575" stroke="#5A4A42" stroke-width="2"/>${Array.from({length:16},(_,i)=>{const w=14+(i*7)%9, h=36+(i*11)%20, c=['#C9B8FF','#A8D8FF','#FFC3A8','#9EE6CF','#FFE07A'][i%5];return `<rect x="${10+i*25}" y="${y+58-h}" width="${w}" height="${h}" rx="2" fill="${c}" stroke="#5A4A42" stroke-width="1.5"/>`;}).join('')}`).join('')}<rect x="0" y="330" width="400" height="70" fill="#E3D2BC"/>` },
  { id:'bg_sea', kind:'bg', name:'바다', price:100,
    art:`<rect width="400" height="400" fill="#DDF1FF"/><circle cx="320" cy="70" r="26" fill="#FFE29A" stroke="#5A4A42" stroke-width="2"/><rect y="250" width="400" height="90" fill="#A8D8FF"/><path d="M0 262 q25 -12 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#FFFFFF" stroke-width="4"/><path d="M0 300 q25 -10 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".7"/><ellipse cx="200" cy="420" rx="320" ry="100" fill="#F6E3BF"/>` }
];
const decoById = id => DECO.find(x=>x.id===id);
const STAGE_SCALE = { baby:[.75,.75], child:[.72,.72], teen:[.88,.96], adult:[1,1] };
// 펫 머리·얼굴 위치에 맞춘 겹침 그림 (콩알이와 같은 viewBox)
function wearSVG(){
  if(!S.profile || isEmpty()) return '';
  const w = S.items.wear, info = getPetInfo(), [sx, sy] = STAGE_SCALE[info.stage] || [1,1];
  const br = info.stage==='baby' ? 'basic' : info.branch;
  const eyeY = (br==='basic' || br==='cat') ? 4 : 2;
  let g = '';
  if(w.glasses && decoById(w.glasses)) g += `<g transform="translate(0 ${eyeY*sy}) scale(${sx} ${sy})">${decoById(w.glasses).art}</g>`;
  if(w.hat && decoById(w.hat)) g += `<g transform="translate(0 ${-19*sy}) scale(${sx})">${decoById(w.hat).art}</g>`;
  return g ? `<svg class="wear" viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${g}</svg>` : '';

(function(){ const bg = document.createElement('div'); bg.id = 'decoBg'; $('petStage').insertBefore(bg, $('petStage').firstChild); })();
function renderDecoBg(){ const id = S.items.wear.bg, it = id && decoById(id); $('decoBg').innerHTML = it ? `<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${it.art}</svg>` : ''; }

renderPet = function(){ _renderPet3(); renderDecoBg(); const l = $('petLayer'); l.querySelectorAll('svg.wear').forEach(x=>x.remove()); if(!isEmpty() && l.querySelector('svg[aria-label="콩알이"]')) l.insertAdjacentHTML('beforeend', wearSVG()); };

/* ── 상점: 꾸미기 칸 ── */
function decoIcon(it){
  if(it.kind==='bg') return `<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" style="border-radius:10px;border:2px solid #5A4A42">${it.art}</svg>`;
  const y = it.kind==='hat' ? 10 : 0;
  return `<svg viewBox="-30 -30 60 60">${it.kind==='glasses' ? '<ellipse cx="0" cy="4" rx="24" ry="21" fill="#FFF3D6" stroke="#5A4A42" stroke-width="2"/>' : ''}<g transform="translate(0 ${y})">${it.art}</g></svg>`;
}
function renderDecoShop(){
  const box = $('shopExtra'); if(!box) return;
  const coins = S.profile.coins||0;
  const cats = [['hat','모자'],['glasses','안경'],['bg','배경']];
  box.innerHTML = `<h3 style="font-size:17px;margin:4px 0 8px">꾸미기</h3>` + cats.map(([k,label])=>`
    <div class="deco-cat">${label}</div>
    <div class="deco-grid">${DECO.filter(it=>it.kind===k && (!it.special || S.items.owned.includes(it.id))).map(it=>{
      const owned = S.items.owned.includes(it.id), on = S.items.wear[k]===it.id;
      const btn = owned ? `<button type="button" class="ghost" data-wear="${it.id}">${on?'벗기':'입기'}</button>`
                        : `<button type="button" class="primary" data-buyd="${it.id}" ${coins<it.price?'disabled':''}>${it.price} 코인</button>`;   // 특별 배경은 늘 가진 상태라 여기 안 옴
      return `<div class="deco ${on?'on':''}">${decoIcon(it)}<b>${it.name}</b>${btn}</div>`;
    }).join('')}</div>`).join('') + `<p class="hint" style="margin:10px 0 0">코인 모으기: 수면·물 목표 모두 달성 +20 · 카페인 목표 지킨 날 +5 · 퀘스트 인증 +10</p>`;

      const cl = document.querySelector('.coin-line .num'); if(cl) cl.textContent = p.coins;
      renderDecoShop(); }
    if(w){ const it = decoById(w.dataset.wear); S.items.wear[it.kind] = S.items.wear[it.kind]===it.id ? null : it.id;
      save(KEYS.items, S.items); renderPet(); renderDecoShop(); }

<script>

   9단계 일부: 목표 취침 시각 · 취침/물 알림 · 자랑하기 카드

/* ── 알림: 브라우저 알림이 되면 그걸로, 안 되면 화면 안 알림 ── */
const canNotify = () => { try{ return 'Notification' in window && Notification.permission === 'granted'; }catch(e){ return false; } };
async function askNotify(){
  try{ if(!('Notification' in window)) return false; if(Notification.permission==='granted') return true; if(Notification.permission==='denied') return false;
    return (await Notification.requestPermission()) === 'granted'; }catch(e){ return false; }
}
const BELL = `<svg viewBox="0 0 30 30" fill="none" stroke="#5A4A42" stroke-width="2" stroke-linejoin="round"><path d="M8 20V13a7 7 0 0 1 14 0v7l2 2H6z" fill="#FFE29A"/><path d="M12 25a3 3 0 0 0 6 0" stroke-linecap="round"/></svg>`;
function inAppNotice(title, sub){

function roundRect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

async function makeCard(){
  const p = S.profile, info = getPetInfo(), st = cardStats();
  const W = 720, H = 1000, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  // 카드 글자는 휴대폰·컴퓨터 기본 글꼴로 (웹 글꼴이 늦게 와서 글자가 깨지는 일이 없게)
  const SYS = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
  const INK = '#5A4A42', DISP = SYS, BODY = SYS;   // 제목 글자는 굵게(bold)만 더한다
  c.fillStyle = '#F3F5EF'; c.fillRect(0,0,W,H);
  roundRect(c, 24, 24, W-48, H-48, 40); c.fillStyle = '#FFFFFF'; c.fill(); c.lineWidth = 4; c.strokeStyle = INK; c.stroke();
  c.fillStyle = '#8E7E75'; c.font = `26px ${BODY}`; c.textAlign = 'center'; c.fillText('내 습관으로 키운 콩알이', W/2, 86);
  // 펫 무대 (꾸민 배경 + 콩알이 + 모자·안경)

  if(bgIt){ c.drawImage(await svgImg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="${ss}" height="${ss}" preserveAspectRatio="xMidYMid slice">${bgIt.art}</svg>`), sx, sy, ss, ss); }
  else { c.fillStyle = '#FBF3E4'; c.fillRect(sx, sy, ss, ss); }
  c.drawImage(await svgImg(drawKongari(info.branch, info.stage, p.kongState||'normal', ss)), sx, sy, ss, ss);
  const wear = wearSVG(); if(wear) c.drawImage(await svgImg(wear.replace('<svg ', `<svg width="${ss}" height="${ss}" `)), sx, sy, ss, ss);
  c.restore();
  roundRect(c, sx, sy, ss, ss, 32); c.lineWidth = 4; c.strokeStyle = INK; c.stroke();
  // 이름 · 레벨
  c.fillStyle = INK; c.font = `bold 64px ${DISP}`; c.fillText(p.petName, W/2, 700);
  c.fillStyle = '#8E7E75'; c.font = `28px ${BODY}`;
  c.fillText(`Lv${p.level} · ${info.stage==='baby' ? '아기' : KONG_NAME[info.branch] + ' ' + KONG_STAGE_NAME[info.stage]} 콩알이`, W/2, 748);
  // 숫자 세 칸
  const boxes = [['도감', st.dex], ['최근 7일 달성', `수면 ${st.sleepMet} · 물 ${st.waterMet}일`], ['리듬', st.rhythm]];
  const bw = 200, gap = 16, bx0 = (W - (bw*3 + gap*2))/2;
  boxes.forEach(([label, val], i)=>{
    const x = bx0 + i*(bw+gap), y = 790;
    roundRect(c, x, y, bw, 130, 22); c.fillStyle = ['#E1F6EE','#E6F1FC','#EEE7FF'][i]; c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
    c.fillStyle = '#8E7E75'; c.font = `22px ${BODY}`; c.fillText(label, x+bw/2, y+40);
    c.fillStyle = INK; let fs = 34; c.font = `bold ${fs}px ${DISP}`; while(c.measureText(val).width > bw-20 && fs > 18){ fs -= 2; c.font = `bold ${fs}px ${DISP}`; }
    c.fillText(val, x+bw/2, y+92);
  });
  c.fillStyle = '#B4A8A1'; c.font = `20px ${BODY}`; c.fillText(dateLabel(today()), W/2, H-46);
  return cv;
}

<script>

const G_CLASSES = ['g-look','g-dance','g-nod','g-nodq','g-tilt','g-butt','g-wag','g-spin','g-spin2','g-hop','g-waddle','g-slide','g-flapbody','g-puff','g-bob','g-bigtilt','g-hug','g-doze','g-yawn','g-roll','g-wriggle','g-fall','g-stretch','g-droop','g-scratch','g-startle','g-shakehead'];

const GI = '#5A4A42';

  const [sx, sy] = STAGE_SCALE[st] || [1,1], ey = (br==='basic' || br==='cat') ? 4 : 2;
  return { stage:st, br, sx, sy, ey, my:ey+6, color: KONG_COLOR[br] || KONG_COLOR.basic,

// 동작 정의: G(지금 모습) → { cls 펫 동작, ms 길이, svg 펫 위 소품, back 펫 뒤 소품, hideHands, hideTail, line 말풍선 }
const GEST = {

  dance: G=>({ name:'콩콩 댄스', cls:'g-dance', ms:2400, line:'콩콩! ♪', svg: gText(18,-32,'♪',11,1.3,0.2) + gText(30,-38,'♪',9,1.3,0.8) }),
  nod:   G=>({ name:'꾸벅', cls:'g-nod', ms:2400, line:'꾸벅… 앗!', svg: gText(24,-28,'!',13,0.8,1.4) }),
  // 냥 귀
  groom: G=>({ name:'그루밍', cls:'g-tilt', ms:2600, hideHands:true, line:'쓱쓱… 세수 중',
    svg: handEl(G,-22,11) + handEl(G,22,11, AT('translate',`0 0;-13 ${G.ey-10};-16 ${G.ey-12};-12 ${G.ey-9};-16 ${G.ey-12};-12 ${G.ey-9};0 0`,2.4)) }),
  tail:  G=>({ name:'꼬리 살랑살랑', cls:'g-wag', ms:2400, hideTail:'kx-cat', line:'살랑살랑~',
    back: tailEl('cat', AT('rotate','0 18 14;-24 18 14;14 18 14;-24 18 14;14 18 14;0 18 14',2.4)) }),
  butt:  G=>({ name:'기지개 켜며 엉덩이 쭉', cls:'g-butt', ms:2400, line:'쭈우욱~' }),
  // 멍 귀
  tailspin:  G=>({ name:'꼬리 빙글빙글', cls:'g-wag', ms:2400, hideTail:'kx-dog', line:'신난다!',
    back: tailEl('dog', AT('rotate','0 18 12;360 18 12',0.6,4)) }),
  spinround: G=>({ name:'제자리 뱅글', cls:'g-spin', ms:1400, line:'뱅글!' }),
  earperk:   G=>({ name:'귀 쫑긋 "멍?"', cls:'g-hop', ms:1600, line:'멍?',
    svg: `<path d="M-31,-20 l-4,-5 M-27,-24 l-2,-6 M31,-20 l4,-5 M27,-24 l2,-6" stroke="${GI}" stroke-width="1.6" stroke-linecap="round" opacity="0">${AN('opacity','0;1;1;0',1.4)}</path>` + gText(30,-34,'멍?',9,1.5) }),
  // 펭 배
  waddle: G=>({ name:'뒤뚱뒤뚱 걷기', cls:'g-waddle', ms:2600, line:'뒤뚱뒤뚱' }),
  slide:  G=>({ name:'배로 슝 미끄럼', cls:'g-slide', ms:2600, line:'슝~!' }),
  flap:   G=>({ name:'날개 파닥파닥', cls:'g-flapbody', ms:2200, hideHands:true, line:'파닥파닥!',
    svg: handEl(G,-22,11, AT('rotate','0 -17 8;-50 -17 8;0 -17 8',0.28,7)) + handEl(G,22,11, AT('rotate','0 17 8;50 17 8;0 17 8',0.28,7)) }),
  // 햄 볼
  munch: G=>({ name:'해바라기씨 오물오물', cls:'g-puff', ms:2600, hideHands:G.hands, line:'오물오물…',
    svg: (G.hands ? handEl(G,-22,11, AT('translate',`0 0;17 ${G.my-9};17 ${G.my-9};17 ${G.my-9};0 0`,2.4)) + handEl(G,22,11, AT('translate',`0 0;-17 ${G.my-9};-17 ${G.my-9};-17 ${G.my-9};0 0`,2.4))
          + `<g opacity="0">${AN('opacity','0;1;1;0',2.4)}<ellipse cx="0" cy="${G.my+3}" rx="2.6" ry="3.6" fill="#6B5A4A" stroke="${GI}" stroke-width=".8"/><path d="M0,${G.my+0.6} v5" stroke="#fff" stroke-width=".8"/></g>` : '')
       + [-14,14].map(x=>`<circle cx="${x}" cy="${G.my-2}" r="0" fill="${G.color}" stroke="${GI}" stroke-width="1.2">${AN('r','0;4.5;6;4.5;6;0',2.4)}</circle>`).join('') }),
  seedcheck: G=>({ name:'볼 주머니에서 씨 꺼내 보기', cls:'g-tilt', ms:2600, hideHands:true, line:'씨앗 남았나…?',
    svg: handEl(G,-22,11) + handEl(G,22,11, AT('translate',`0 0;-8 ${G.my-11};-8 ${G.my-11};4 -15;4 -15;0 0`,2.4))
       + `<g opacity="0">${AN('opacity','0;0;0;1;1;0',2.4)}<ellipse cx="26" cy="-9" rx="2.6" ry="3.6" fill="#6B5A4A" stroke="${GI}" stroke-width=".8"/><path d="M26,-11.4 v5" stroke="#fff" stroke-width=".8"/></g>` }),
  wheel: G=>({ name:'쳇바퀴 달리기', cls:'g-bob', ms:2300, line:'달려라 달려!',
    back: `<g><path d="M-22,42 L0,8 L22,42" fill="none" stroke="#B98A5E" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="6" r="32" fill="none" stroke="#C9A06E" stroke-width="3"/><g>${AT('rotate','0 0 6;360 0 6',0.7,3)}<path d="M0,-26 V38 M-32,6 H32 M-22.6,-16.6 L22.6,28.6 M22.6,-16.6 L-22.6,28.6" stroke="#C9A06E" stroke-width="1.6"/></g></g>` }),
  // 부엉 눈
  bigtilt: G=>({ name:'고개 크게 갸웃', cls:'g-bigtilt', ms:2600, line:'부엉?' }),
  wink:    G=>({ name:'한쪽씩 깜빡', cls:null, ms:2000, line:'찡긋',
    svg: [[-7,0.3],[7,1.1]].map(([x,b])=>`<g opacity="0">${AN('opacity','0;1;1;0',0.55,1,b)}<ellipse cx="${x}" cy="${G.ey}" rx="5.2" ry="6.2" fill="#F4F0FF"/><path d="M${x-4},${G.ey} Q${x},${G.ey+3} ${x+4},${G.ey}" fill="none" stroke="#2E2622" stroke-width="1.8" stroke-linecap="round"/></g>`).join('') }),
  wrap:    G=>({ name:'날개로 몸 감싸기', cls:'g-hug', ms:2600, hideHands:true, line:'포근포근…',
    svg: handEl(G,-22,11, AT('translate','0 0;13 -1;13 -1;13 -1;0 0',2.4)) + handEl(G,22,11, AT('translate','0 0;-13 -1;-13 -1;-13 -1;0 0',2.4)) }),
  // 잠꾸러기
  dozeZ:  G=>({ name:'서서 졸다가 Zz', cls:'g-doze', ms:2800, line:'쿨… 앗, 안 잤어!', svg: gText(24,-30,'Z',10,1.6,0.3,'#8E9BE3') + gText(32,-38,'z',8,1.6,0.8,'#8E9BE3') }),
  pompom: G=>({ name:'모자 방울 톡톡', cls:null, ms:2400, hideHands:true, line:'톡톡',
    svg: handEl(G,-22,11) + handEl(G,22,11, AT('translate','0 0;5 -14;4 -11;5 -14;4 -11;5 -14;0 0',2.3)) }),
  yawn:   G=>({ name:'하품', cls:'g-yawn', ms:1700, line:'하아암~',
    svg: `<circle cx="0" cy="${mouthY(G)}" r="0" fill="#2E2622">${AN('r','0;2.8;3;2.8;0',1.4)}</circle><circle cx="0" cy="${mouthY(G)+1.2}" r="0" fill="#FF8FA8">${AN('r','0;1.3;1.5;1.3;0',1.4)}</circle>` }),
  // 반짝
  spinSparkle: G=>({ name:'반짝이 뿌리며 빙글', cls:'g-spin', ms:1500, line:'반짝반짝~', svg: sparkleSVG(1.4) }),
  starTwinkle: G=>({ name:'머리 위 별 반짝', cls:'g-hop', ms:1800, line:'빛난다!',
    svg: `<circle cx="0" cy="-25" r="0" fill="#FFE07A" opacity=".55">${AN('r','0;11;0',1.4)}</circle><path d="${star4(0,-25,6)}" fill="#FFF6C9" opacity="0">${AN('opacity','0;1;0',1.4)}</path>` }),
  waveHearts: G=>({ name:'손 흔들며 하트', cls:null, ms:2600, hideHands:true, line:'안녕~!',
    svg: handEl(G,-22,11) + handEl(G,22,11, AT('translate','0 0;4 -20;8 -20;2 -20;8 -20;2 -20;0 0',2.4))
       + [[22,-28,0.4],[30,-34,0.9],[18,-38,1.4]].map(([x,y,b])=>`<path d="${heart(x,y)}" fill="#FF8FA8" stroke="${GI}" stroke-width=".7" opacity="0">${AN('opacity','0;1;0',1,1,b)}${AT('translate','0 0;0 -8',1,1,b)}</path>`).join('') }),
  // 기본
  hair: G=>({ name:'머리카락 살랑', cls:null, ms:2200, line:'살랑~',
    svg: `<g>${AT('rotate','0 -2 -21;-22 -2 -21;16 -2 -21;-14 -2 -21;0 -2 -21',2.1)}<path d="M-2,-21 Q2,-29 7,-23" fill="none" stroke="${GI}" stroke-width="2" stroke-linecap="round"/></g>` }),
  roll: G=>({ name:'데굴 굴렀다 일어나기', cls:'g-roll', ms:2400, line:'데굴데굴~' }),
  // 아기 전용
  wriggle: G=>({ name:'꼼지락꼼지락', cls:'g-wriggle', ms:2000, line:'꼼지락꼼지락' }),
  fall:    G=>({ name:'넘어졌다 일어나기', cls:'g-fall', ms:2600, line:'앗! …영차' }),
  // 꼬질이
  scratch: G=>({ name:'몸 긁적', cls:'g-scratch', ms:2200, hideHands:G.hands, line:'긁적긁적…',
    svg: G.hands ? handEl(G,-22,11) + handEl(G,22,11, AT('translate','0 0;-8 -20;-6 -17;-8 -20;-6 -17;-8 -20;0 0',2.1)) : '' }),
  fly:     G=>({ name:'파리 휘휘 쫓기', cls:'g-look', ms:2400, hideHands:G.hands, line:'저리 가…!',
    svg: `<g><animateMotion path="M0,-34 C22,-44 34,-20 16,-14 C0,-8 -26,-22 -10,-36 Z" dur="1.1s" repeatCount="2" fill="freeze"/><ellipse cx="-1.6" cy="-2" rx="1.8" ry="1.1" fill="#FFFFFF" stroke="${GI}" stroke-width=".5"/><ellipse cx="1.6" cy="-2" rx="1.8" ry="1.1" fill="#FFFFFF" stroke="${GI}" stroke-width=".5"/><circle r="1.9" fill="#2E2622"/></g>`
       + (G.hands ? handEl(G,-22,11) + handEl(G,22,11, AT('translate','0 0;-4 -30;6 -26;-4 -30;6 -26;0 0',2.2)) : '') }),
  sigh:    G=>({ name:'한숨', cls:'g-droop', ms:2600, line:'하아…',
    svg: `<path d="M-24,${G.my} q-5,-3 -2,-7 q-4,-4 2,-6 q2,-5 7,-2" fill="#FFFFFF" stroke="#B4A8A1" stroke-width="1.2" opacity="0">${AN('opacity','0;.9;0',1.6,1,0.6)}${AT('translate','0 0;-4 -4',1.6,1,0.6)}</path>` }),
  // 덜덜이 (몸은 늘 떨고 있다)
  startle: G=>({ name:'깜짝 놀라 펄쩍', cls:'g-startle', ms:1300, line:'깜짝!', svg: gText(26,-30,'!',14,0.9) }),
  tremble: G=>({ name:'덜덜덜', cls:'g-wag', ms:1800, line:'덜, 덜덜…' })
};
const BRANCH_G = { cat:['groom','tail','butt'], dog:['tailspin','spinround','earperk'], peng:['waddle','slide','flap'], ham:['munch','seedcheck','wheel'],
  owl:['bigtilt','wink','wrap'], sleepy:['dozeZ','pompom','yawn'], sparkle:['spinSparkle','starTwinkle','waveHearts'], basic:['hair','roll'] };
const NEED = { groom:'hands', flap:'hands', seedcheck:'hands', wrap:'hands', pompom:'hands', waveHearts:'hands', tail:'tail', tailspin:'tail' };
function idlePool(G){
  if(G.state==='dirty') return { own:['scratch','fly','sigh'], common:[] };
  if(G.state==='jitter') return { own:['startle','tremble'], common:[] };
  const base = G.stage==='baby' ? ['hair','roll','wriggle','fall'] : (BRANCH_G[G.br] || []);
  const own = base.filter(k=>{ const n = NEED[k]; return !n || (n==='hands' && G.hands) || (n==='tail' && G.tail); });
  return { own, common:['look','dance','nod'] };
}
const pickOne = a => a[Math.floor(Math.random()*a.length)];

/* ── 동작 실행 · 멈춤 ── */
let gestNow = null;
const petSvg = () => $('petLayer').querySelector('svg[aria-label="콩알이"]');
function hideUses(href, on){ const s = petSvg(); if(s) s.querySelectorAll(`use[href="#${href}"]`).forEach(u=>u.style.visibility = on ? 'hidden' : ''); }
function stopGesture(){
  if(!gestNow) return;
  gestNow.timers.forEach(clearTimeout); gestNow = null;
  const l = $('petLayer'); G_CLASSES.forEach(c=>l.classList.remove(c)); l.classList.remove('amp-baby');
  l.querySelectorAll('svg.gest').forEach(x=>x.remove()); $('fxBack').querySelectorAll('svg.gest-back').forEach(x=>x.remove());
  const s = petSvg(); if(s) s.querySelectorAll('use').forEach(u=>u.style.visibility='');
  if(!l.classList.contains('sleep-hidden') && !REACTION_CLASSES.some(c=>l.classList.contains(c))) l.classList.add('breathe');
}
function runGesture(key, opts){
  opts = opts || {};
  stopGesture();
  const G = geom(), def = GEST[key](G);
  gestNow = { key, timers:[] };
  if(reduced()){ if(def.line) setBubble(def.line); gestNow.timers.push(setTimeout(stopGesture, def.ms)); return def.ms; }   // 움직임 줄이기: 말풍선만
  const l = $('petLayer');
  l.classList.remove('breathe','wobble'); if(G.stage==='baby') l.classList.add('amp-baby');
  if(def.hideHands) hideUses('kh', true);
  if(def.hideTail) hideUses(def.hideTail, true);
  if(def.cls){ void l.offsetWidth; l.classList.add(def.cls); }
  if(def.svg) l.insertAdjacentHTML('beforeend', wrapG(G, def.svg));
  if(def.back) $('fxBack').insertAdjacentHTML('beforeend', wrapG(G, def.back, 'gest-back'));
  if(def.line && opts.say !== false) setBubble(def.line);
  gestNow.timers.push(setTimeout(stopGesture, def.ms));
  return def.ms;
}

/* ── 가만히 있을 때: 8~15초 동안 아무것도 안 누르면 무작위로 하나 ── */
const idleWait = () => 8000 + Math.random()*7000;
let lastAct = Date.now(), idleDelay = idleWait();
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev, ()=>{
  lastAct = Date.now(); idleDelay = idleWait();
  if(gestNow && gestNow.key !== 'wake') stopGesture();   // 단추를 누르면 바로 멈춘다
}, true));
function idleAllowed(){
  const l = $('petLayer');
  return !$('app').hidden && !$('scr-pet').hidden && S.profile && !isEmpty() && !scene && !evolvingNow && !sleepState()
    && !$('sheetRoot').innerHTML && !$('fxLayer').innerHTML.trim() && !REACTION_CLASSES.some(c=>l.classList.contains(c)) && !document.hidden;
}
function playIdle(key){
  const G = geom(), pool = idlePool(G);
  const k = key || ((pool.own.length && (Math.random() < 0.6 || !pool.common.length)) ? pickOne(pool.own) : pickOne(pool.common));
  return runGesture(k, { say: reduced() || !!key || Math.random() < 0.5 });
}
setInterval(()=>{
  if(gestNow || Date.now() - lastAct < idleDelay) return;
  lastAct = Date.now(); idleDelay = idleWait();
  if(idleAllowed()) playIdle();
}, 1000);

/* ── 일어났을 때: 눈 비비기 → 기지개 → 하품 → 폴짝 ── */
function playWakeGesture(){
  stopGesture();
  const G = geom(), l = $('petLayer'), dirty = G.state === 'dirty';
  const r = S.records[today()], sm = r ? sleepMinutes(r) : null, enough = sm != null && sm >= S.goals.sleepMin;
  if(reduced()){ setBubble(dirty ? '음… 더 자고 싶어…' : '좋은 아침!'); return 600; }
  gestNow = { key:'wake', timers:[] };
  const T = (ms, fn) => gestNow && gestNow.timers.push(setTimeout(fn, ms));
  const setCls = c => { G_CLASSES.forEach(x=>l.classList.remove(x)); l.classList.remove('breathe','wobble'); if(c){ void l.offsetWidth; l.classList.add(c); } };
  const overlay = inner => { l.querySelectorAll('svg.gest').forEach(x=>x.remove()); if(inner) l.insertAdjacentHTML('beforeend', wrapG(G, inner)); };
  if(G.stage==='baby') l.classList.add('amp-baby');
  // ① 눈 비비기 (아기·어린이는 손이 없으니 꼼지락)
  setBubble('으음…');
  if(G.hands){ hideUses('kh', true); overlay(handEl(G,-22,11) + handEl(G,22,11, AT('translate',`0 0;-13 ${G.ey-10};-16 ${G.ey-11};-12 ${G.ey-9};-16 ${G.ey-11};0 0`,0.5))); }
  else setCls('g-wriggle');
  // ② 기지개 (꼬질이면 축 처짐)
  T(500, ()=>{
    if(dirty){ overlay(''); hideUses('kh', false); setCls('g-droop'); setBubble('음… 더 자고 싶어…'); return; }
    setCls('g-stretch'); setBubble('으~ 기지개!');
    if(G.hands){ hideUses('kh', true); overlay(handEl(G,-22,11, AT('translate','0 0;4 -36;4 -36;0 0',0.6)) + handEl(G,22,11, AT('translate','0 0;-4 -36;-4 -36;0 0',0.6))); }
    else overlay('');
  });
  // ③ 하품: 입 자리에 작은 동그란 입이 1초 열렸다 닫힘
  T(1100, ()=>{
    hideUses('kh', false); if(!dirty) setCls(null);
    overlay(`<circle cx="0" cy="${mouthY(G)}" r="0" fill="#2E2622">${AN('r','0;2.8;2.8;0',1)}</circle><circle cx="0" cy="${mouthY(G)+1.2}" r="0" fill="#FF8FA8">${AN('r','0;1.3;1.3;0',1)}</circle>`);
    if(!dirty) setBubble('하아암~');
  });
  // ④ 마무리
  if(dirty){ T(2200, stopGesture); return 2300; }
  T(2100, ()=>{
    setCls('g-hop'); setBubble('좋은 아침!');
    overlay(enough ? sparkleSVG(1.2) : '');
  });
  if(enough){ T(3000, stopGesture); return 3000; }
  T(2700, ()=>{ setCls('g-nodq'); overlay(''); setBubble('꾸벅…'); });       // 모자라면 다시 꾸벅 졸다가
  T(3600, ()=>{ setCls('g-shakehead'); setBubble('앗, 일어나야지!'); });     // 고개를 흔들며 깬다
  T(4500, stopGesture);
  return 4500;
}

/* ── 확인용: [가만히 동작 바로 보기] — 지금 갈래의 동작을 하나씩 순서대로 ── */
let devIdleIdx = 0;
$('btnSettings').addEventListener('click', ()=>{
  const prev = $('dmPreview'); if(!prev) return;
  prev.insertAdjacentHTML('afterend', `<button type="button" class="ghost sm" id="dmIdle">가만히 동작 바로 보기</button>`);
  $('dmIdle').addEventListener('click', ()=>{
    closeSheet(); switchTab('pet');
    const G = geom(), pool = idlePool(G), list = pool.own.concat(pool.common);
    const k = list[devIdleIdx % list.length], i = devIdleIdx % list.length; devIdleIdx++;
    setTimeout(()=>{ const ms = runGesture(k, { say:true }); toast(`${i+1}/${list.length} · ${GEST[k](G).name}`); lastAct = Date.now() + ms; }, 60);
  });
});
</script>

<script>
/* =========================================================
   이상한 기록 걸러 내기 · 기상 미션 · 고친 기록 표시
   ========================================================= */
KEYS.spam    = 'habipet_spam';      // { 'YYYY-MM-DD': {water:n, coffee:n, energy:n} } 연타로 넘긴 잔 수
KEYS.mission = 'habipet_mission';   // { 'YYYY-MM-DD': 'done' | 'skip' }
S.spam = load(KEYS.spam, {}) || {};
S.mission = load(KEYS.mission, {}) || {};

/* ── 1) 이상한 숫자: 저장 전에 화면 안에서 한 번 더 묻기 ── */
let oddBypass = false;
function oddReasons(){
  const out = [], night = F.allNighter ? 0 : nightMinutes($('fBed').value, $('fWake').value), total = night + F.nap;
  if(F.water > 15) out.push(`물 ${F.water}잔`);
  if(F.coffee > 8) out.push(`커피 ${F.coffee}잔`);
  if(F.energy > 5) out.push(`에너지 드링크 ${F.energy}캔`);
  if($('fBed').value && $('fWake').value || F.allNighter){
    if(total > 840) out.push(`수면 ${fmtHM(total)}`);
    if(!F.allNighter && total < 60) out.push(`수면 ${fmtHM(total)}`);
  }
  return out;
}
// 고친 기록 표시를 위해, 저장 직전의 자동 기록 시각을 기억해 둔다
let editStash = null;
document.addEventListener('submit', e=>{
  if(e.target.id !== 'recForm') return;
  if(!oddBypass){
    const odd = oddReasons();
    if(odd.length){
      e.preventDefault(); e.stopImmediatePropagation();
      const p = S.profile, info = getPetInfo();
      openSheet('잠깐만!', `<div style="display:flex;justify-content:center"><div style="width:120px">${p && !isEmpty() ? drawKongariMood(info.branch, info.stage, 'dizzy', 120) : ''}</div></div>
        <div class="bubble" style="align-self:center">정말이야? 숫자를 한 번 더 봐 줘!</div>
        <p style="margin:0;text-align:center" class="hint">${odd.map(esc).join(' · ')}</p>
        <div class="brag-actions"><button class="ghost" type="button" id="oddFix">고칠게</button><button class="primary" type="button" id="oddOk">맞아</button></div>`, ()=>{
        $('oddFix').addEventListener('click', closeSheet);
        $('oddOk').addEventListener('click', ()=>{ closeSheet(); oddBypass = true; try{ $('recForm').requestSubmit(); } finally { oddBypass = false; } });
      });
      return;
    }
  }
  const newDate = $('fDate').value, oldDate = editingDate || newDate, old = S.records[oldDate];
  editStash = old && (old.autoBed || old.autoWake || old.edited) ? { date:newDate, autoBed:old.autoBed, autoWake:old.autoWake, edited:old.edited } : null;
  setTimeout(applyEditMark, 0);
}, true);
function applyEditMark(){
  const st = editStash; editStash = null; if(!st) return;
  const r = S.records[st.date]; if(!r) return;
  if(st.autoBed) r.autoBed = st.autoBed; if(st.autoWake) r.autoWake = st.autoWake;
  const changed = (st.autoBed && r.bed !== st.autoBed) || (st.autoWake && r.wake !== st.autoWake);
  if(st.edited || changed) r.edited = true;
  save(KEYS.records, S.records); renderList();
}

/* ── 2) 연타로 넘긴 잔 수는 경험치·코인 계산에서 뺀다 (기록은 그대로 남는다) ── */
const _spamTaps = { water:[], coffee:[], energy:[] };
const _quickDrink3 = quickDrink;
quickDrink = function(type){
  const now = Date.now(); _spamTaps[type] = _spamTaps[type].filter(t=>now-t<10000); _spamTaps[type].push(now);
  if(_spamTaps[type].length > 3){ const d = today(); const o = S.spam[d] || (S.spam[d] = {}); o[type] = (o[type]||0) + 1; save(KEYS.spam, S.spam); }
  _quickDrink3(type);
};
function withoutSpam(fn){
  const changed = [];
  Object.entries(S.spam).forEach(([d,o])=>{ const r = S.records[d]; if(!r) return; changed.push([r, r.water, r.coffee, r.energy]);
    r.water = Math.max(0, r.water - (o.water||0)); });   // 연타한 커피·에너지 드링크는 그대로 센다(빼면 오히려 카페인 지킴 보상이 생김)
  try{ return fn(); } finally { changed.forEach(([r,w,c,e])=>{ r.water = w; r.coffee = c; r.energy = e; }); }
}
const _evaluateDay1 = evaluateDay;
evaluateDay = function(date){ return withoutSpam(()=>_evaluateDay1(date)); };
const _runCoins1 = runCoins;
runCoins = function(){ return withoutSpam(()=>_runCoins1()); };

/* ── 3) [지금 잔다]/[지금 일어났다]가 적은 시각을 기억 (나중에 고치면 "✎ 고침") ── */
const _wakeNow2 = wakeNow;
let pendingMission = null;
wakeNow = function(){
  const st = sleepState(), tooShort = st && (Date.now()-new Date(st.since))/60000 < 5;
  _wakeNow2();
  const r = S.records[today()];
  if(r && !tooShort){
    if(r.wake) r.autoWake = r.wake;
    if(st && r.bed) r.autoBed = r.bed;
    save(KEYS.records, S.records);
  }
  if(!tooShort && S.mission[today()] !== 'done' && S.mission[today()] !== 'skip') pendingMission = { wokeAt: Date.now() };
};
const _renderList1 = renderList;
renderList = function(){
  _renderList1();
  $('recList').querySelectorAll('.rec').forEach(row=>{
    const b = row.querySelector('[data-edit]'); if(!b) return;
    const r = S.records[b.dataset.edit];
    if(r && r.edited && !row.querySelector('.tag.edited')) row.querySelector('.rec-date').insertAdjacentHTML('afterend', '<span class="tag edited" title="자동 기록을 직접 고쳤어요">✎ 고침</span>');
  });
};

/* ── 4) 기상 미션: 일어나기 연출이 끝나면 하나를 무작위로 ── */
const MISSIONS = ['창문 열고 하늘 보여 줘!', '세수하고 거울 속 나 보여 줘!', '물 한 잔 따라서 보여 줘!'];
setInterval(()=>{
  if(!pendingMission || scene || $('sheetRoot').innerHTML || $('missionPanel') || $('app').hidden) return;
  const pm = pendingMission; pendingMission = null; showMission(pm.wokeAt);
}, 500);
function showMission(wokeAt){
  if(isEmpty()) return;
  const text = pickOne(MISSIONS);
  const panel = document.createElement('div'); panel.className = 'wake-panel'; panel.id = 'missionPanel';
  panel.innerHTML = `<p><b style="font-family:var(--f-display);font-weight:400;font-size:16px">기상 미션</b> · 10분 안에 하면 경험치 +10, 코인 +5</p>
    <p style="font-size:15px">“${esc(text)}”</p>
    <input type="file" accept="image/*" capture="environment" id="msFile" hidden>
    <div class="brag-actions"><button class="ghost" type="button" id="msSkip">건너뛰기</button><button class="primary" type="button" id="msDo">📷 인증하기</button></div>
    <p class="hint" id="msNote" style="font-size:12.5px">사진은 저장하지 않고, 찍으면 바로 완료돼요.</p>`;
  $('petStage').appendChild(panel);
  setBubble(text);
  const finish = (status)=>{ S.mission[today()] = status; save(KEYS.mission, S.mission); panel.remove(); };
  $('msSkip').addEventListener('click', ()=>{ finish('skip'); setBubble('괜찮아, 내일 또 하자!'); });
  $('msDo').addEventListener('click', ()=>$('msFile').click());
  $('msFile').addEventListener('change', e=>{
    const got = e.target.files && e.target.files.length; e.target.value = '';   // 사진은 읽지도 저장하지도 않는다
    if(!got) return;
    const inTime = Date.now() - wokeAt <= 10*60*1000;
    finish('done');
    if(inTime){
      const p = S.profile, from = stageOf(p.level);
      addExp(10); p.coins = (p.coins||0) + 5; save(KEYS.profile, p);
      const to = stageOf(p.level);
      if(from !== to) playEvolution(from, to); else renderPet();
      setBubble('미션 완료! 상쾌한 아침이다!'); toast('+10 EXP · +5 코인 · 기상 미션 완료');
    } else { renderPet(); setBubble('미션 완료! 10분이 지나서 보상은 없지만 멋져!'); }
  });
}
const _idleAllowed1 = idleAllowed;
idleAllowed = function(){ return !$('missionPanel') && _idleAllowed1(); };

// 처음부터 다시: 이번에 더한 기록도 비운다
const _resetAll2 = resetAll;
resetAll = function(){ S.spam = {}; S.mission = {}; pendingMission = null; const mp = $('missionPanel'); if(mp) mp.remove(); _resetAll2(); };
if(!$('app').hidden) renderList();
</script>

<script>
/* =========================================================
   일어나기 연출 playWakeGesture(branch, stage) — 약 4초
   ① 쿨쿨 → ② 눈 비비기 → ③ 기지개+하품 → ④ 갈래별 인사
   움직임은 펫을 감싼 #petLayer의 CSS 동작, 손·소품은 펫 위(뒤)에 겹치는 작은 SVG
   ========================================================= */
const W_CLASSES = ['w-wriggle','w-stretch','w-droop','w-hop','w-spin','w-waddle','w-tilt','w-doze','w-groom','w-sway','w-puff','w-shakehead'];
function geomFor(branch, stage){
  const br = stage==='baby' ? 'basic' : (KONG_COLOR[branch] ? branch : 'basic');
  const [sx, sy] = STAGE_SCALE[stage] || [1,1], ey = (br==='basic' || br==='cat') ? 4 : 2;
  return { stage, br, sx, sy, ey, my:ey+6, color:KONG_COLOR[br], hands: stage==='teen' || stage==='adult',
    tail: stage==='adult' && (br==='cat' || br==='dog'), state:(S.profile && S.profile.kongState) || 'normal' };
}
const eyeBgOf = (G, x) => G.br==='peng' ? '#FFFFFF' : G.br==='owl' ? '#F4F0FF' : (G.br==='dog' && x>0) ? '#E8B07E' : G.color;
const canMouthOf = G => !['peng','owl','ham'].includes(G.br);
const eyeCover = (G, x) => `<ellipse cx="${x}" cy="${G.ey}" rx="5.2" ry="6.2" fill="${eyeBgOf(G,x)}"/>`;
const eyeClosed = (G, x) => eyeCover(G,x) + `<path d="M${x-4},${G.ey+.5} Q${x},${G.ey+3} ${x+4},${G.ey+.5}" fill="none" stroke="#2E2622" stroke-width="1.9" stroke-linecap="round"/>`;
const eyeSqueeze = (G, x) => eyeCover(G,x) + `<path d="${x<0 ? `M${x-3.5},${G.ey-2.6} L${x+2.5},${G.ey} L${x-3.5},${G.ey+2.6}` : `M${x+3.5},${G.ey-2.6} L${x-2.5},${G.ey} L${x+3.5},${G.ey+2.6}`}" fill="none" stroke="#2E2622" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>`;
const yawnMouth = G => { const y = canMouthOf(G) ? G.my : G.my + 4;
  return (canMouthOf(G) ? `<ellipse cx="0" cy="${G.my}" rx="4" ry="3" fill="${G.color}"/>` : '') + `<ellipse cx="0" cy="${y+.6}" rx="2.7" ry="3.3" fill="#2E2622"/><ellipse cx="0" cy="${y+2.2}" rx="1.7" ry="1.1" fill="#FF8FA8"/>`; };
const stretchLines = `<path d="M-30,-6 l-5,-2 M-31,1 l-6,0 M-30,8 l-5,2 M30,-6 l5,-2 M31,1 l6,0 M30,8 l5,2" stroke="${GI}" stroke-width="1.4" stroke-linecap="round"/>`;
const handAt = (G, x, y, dx, dy) => `<g transform="translate(${dx} ${dy})"><ellipse cx="${x}" cy="${y}" rx="5.5" ry="4.5" fill="${G.color}" stroke="${GI}" stroke-width="1.8"/></g>`;
function owlLine(){
  const t = S.records[today()], y = S.records[addDays(today(),-1)];
  if(t && y && t.wake && y.wake && !y.allNighter && circDiff(toMin(t.wake), toMin(y.wake)) > 60) return '부엉… 어제보다 늦었어';
  return '부엉, 어제랑 같은 시간이야';
}
// ④ 갈래별 인사 (아기는 갈래 상관없이 폴짝, 어린이는 손 안 쓰는 부분만)
function wakeGreet(G){
  const H = G.hands, D = 1.4;
  if(G.stage==='baby') return { cls:'w-hop', line:'콩콩!' };
  switch(G.br){
    case 'cat': return { cls:'w-groom', line:'냐아~ 잘 잤다', hideHands:H,
      svg: H ? handEl(G,-22,11) + handEl(G,22,11, AT('translate',`0 0;-13 ${G.ey-10};-16 ${G.ey-12};-12 ${G.ey-9};-16 ${G.ey-12};0 0`,D)) : '' };
    case 'dog': return { cls:'w-spin', line:'멍! 일어났어? 놀자!', hideTail: G.tail ? 'kx-dog' : null,
      back: G.tail ? tailEl('dog', AT('rotate','0 18 12;360 18 12',0.45,3)) : '' };
    case 'peng': return { cls:'w-waddle', line:'꽥! 물 한 잔부터!', hideHands:H,
      svg: H ? handEl(G,-22,11, AT('rotate','0 -17 8;-50 -17 8;0 -17 8',0.28,5)) + handEl(G,22,11, AT('rotate','0 17 8;50 17 8;0 17 8',0.28,5)) : '' };
    case 'ham': return { cls:'w-puff', line:'아침 간식!', hideHands:H,
      svg: (H ? handEl(G,-22,11, AT('translate',`0 0;17 ${G.my-9}`,0.35)) + handEl(G,22,11, AT('translate',`0 0;-17 ${G.my-9}`,0.35))
              + `<g opacity="0">${AN('opacity','0;1;1',D)}<ellipse cx="0" cy="${G.my+3}" rx="2.6" ry="3.6" fill="#6B5A4A" stroke="${GI}" stroke-width=".8"/><path d="M0,${G.my+0.6} v5" stroke="#fff" stroke-width=".8"/></g>` : '')
         + [-14,14].map(x=>`<circle cx="${x}" cy="${G.my-2}" r="0" fill="${G.color}" stroke="${GI}" stroke-width="1.2">${AN('r','0;4.5;6;4.5;6',D)}</circle>`).join('') };
    case 'owl': return { cls:'w-tilt', line: owlLine() };
    case 'sleepy': return { cls:'w-doze', line:'음냐… 일어났어!', hideHands:H,
      svg: H ? handEl(G,-22,11) + handEl(G,22,11, AT('translate','0 0;0 0;0 0;5 -14;4 -12;5 -14',D)) : '' };
    case 'sparkle': return { cls:'w-spin', line:'오늘도 반짝반짝!',
      svg: sparkleSVG(1.3) + `<circle cx="0" cy="-25" r="0" fill="#FFE07A" opacity=".55">${AN('r','0;11;0',1.2,1,0.3)}</circle><path d="${star4(0,-25,6)}" fill="#FFF6C9" opacity="0">${AN('opacity','0;1;0',1.2,1,0.3)}</path>` };
    default: return { cls:'w-sway', line:'콩! 좋은 아침',
      svg: `<g>${AT('rotate','0 -2 -21;-22 -2 -21;16 -2 -21;-14 -2 -21;0 -2 -21',D)}<path d="M-2,-21 Q2,-29 7,-23" fill="none" stroke="${GI}" stroke-width="2" stroke-linecap="round"/></g>` };
  }
}

/* ── 진행 상태: 단추를 누르면 건너뛰고 바로 평소 화면으로 ── */
let wakeRun = null;
function startWakeRun(ask){ if(wakeRun){ wakeRun.timers.forEach(clearTimeout); } wakeRun = { ask, timers:[] }; }
const WT = (ms, fn) => { if(wakeRun) wakeRun.timers.push(setTimeout(()=>{ if(wakeRun) fn(); }, ms)); };
function endWakeRunAfter(ms){ WT(ms, ()=>finishWakeRun(false)); }
function finishWakeRun(skipped){
  if(!wakeRun) return;
  const run = wakeRun; wakeRun = null; run.timers.forEach(clearTimeout);
  const l = $('petLayer');
  W_CLASSES.forEach(c=>l.classList.remove(c)); l.style.animationDuration = '';
  l.classList.remove('sleep-hidden','w-inbed','amp-baby','lying','nesting');
  l.querySelectorAll('svg.gest').forEach(x=>x.remove());
  $('fxBack').innerHTML = ''; $('fxLayer').innerHTML = '';   // 침대는 끝나면 사라진다
  renderPet();
  if(skipped) setBubble('좋은 아침!');
  if(run.ask) run.ask();            // 이어서 개운함 고르기 → 기상 미션
  else { clearScene(); renderPet(); setBubble(idleLine()); if(sleepState()) startSleepScene({instant:true}); }
}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, e=>{
  if(wakeRun && !(e.target.closest && e.target.closest('#wakePanel'))) finishWakeRun(true);
}, true));

function ensureBed(){
  if(!$('fxLayer').querySelector('.pr-sleeper')){ const L = sleepLayers(); $('fxBack').innerHTML = L.back; $('fxLayer').innerHTML = L.front; }
  $('sceneBg').innerHTML = NIGHT; $('sceneBg').classList.add('on');
  const l = $('petLayer'); l.classList.remove('lying','nesting'); l.classList.add('sleep-hidden');
}

playWakeGesture = function(branch, stage){
  if(!stage){ const i = getPetInfo(); branch = i.branch; stage = i.stage; }
  const G = geomFor(branch, stage), l = $('petLayer'), st = G.state, calm = reduced();
  const r = S.records[today()], sm = r ? sleepMinutes(r) : null, enough = sm != null && sm >= S.goals.sleepMin;
  const T = calm ? [0, 500, 1000, 1500, 2000] : [0, 600, 1400, 2300, 4000];   // 움직임 줄이기: 장면을 0.5초씩
  const setCls = (c) => { W_CLASSES.forEach(x=>l.classList.remove(x)); l.classList.remove('breathe','wobble'); if(c && !calm){ void l.offsetWidth; l.classList.add(c); } };
  const overlay = inner => { l.querySelectorAll('svg.gest').forEach(x=>x.remove()); if(inner) l.insertAdjacentHTML('beforeend', wrapG(G, inner)); };
  const backOverlay = inner => { $('fxBack').querySelectorAll('svg.gest-back').forEach(x=>x.remove()); if(inner) $('fxBack').insertAdjacentHTML('beforeend', wrapG(G, inner, 'gest-back')); };
  const hands = on => hideUses('kh', on);

  // ① 쿨쿨: 지금 잠자기 화면 그대로, 해가 떠오르며 밤 남색 → 아침 하늘색 (1초)
  ensureBed(); setBubble('쿨쿨…');
  const fadeMorning = () => { $('sceneBg').insertAdjacentHTML('beforeend', `<div class="wk-morning">${MORNING}</div>`); const m = $('sceneBg').querySelector('.wk-morning'); void m.offsetWidth; m.classList.add('on'); };
  if(calm) WT(T[1], fadeMorning); else fadeMorning();

  // ② 눈 비비기: 이불을 걷고 일어나 앉아, 한쪽 눈만 감은 채 손으로 비빈다
  WT(T[1], ()=>{
    const z = $('fxLayer').querySelector('.pr-z'); if(z) z.remove();
    const sl = $('fxLayer').querySelector('.pr-sleeper'); if(sl) sl.style.visibility = 'hidden';
    $('fxLayer').querySelectorAll('.pr-blanket,.pr-hands').forEach(el=>{ if(calm) el.remove(); else el.classList.add('pr-off'); });
    l.innerHTML = drawKongari(branch, stage, st, 200) + wearSVG();

  WT(T[2], ()=>{
    if(st==='dirty'){ hands(false); setCls('w-droop'); overlay(eyeClosed(G,-7) + eyeClosed(G,7)); setBubble('음… 더 자고 싶어…'); return; }
    setCls('w-stretch');
    let o = eyeSqueeze(G,-7) + eyeSqueeze(G,7) + yawnMouth(G) + stretchLines;
    if(G.hands){ hands(true); o += calm ? handAt(G,-22,11,5,-38) + handAt(G,22,11,-5,-38)

  });
  return T[4];
};

<script>
/* =========================================================
   A. 기록 규칙 — 날짜 기준 · 일어났다를 깜빡했을 때 · 되돌리기
   ========================================================= */
// [A1] 물·커피·에너지 드링크는 누른 날짜 기준 (하루는 자정에 나뉜다)
const drinkDate = () => today();
const DRINK_LABEL = { water:'물 1잔', coffee:'커피 1잔', energy:'에너지 드링크 1캔' };
function blankRecord(d){ return { date:d, bed:'', wake:'', allNighter:false, napMin:0, water:0, coffee:0, energy:0, lastCaffeine:'', fresh:null }; }
function earlyDrink(type, d){
  // 다른 날짜 기록에 더할 때 쓰는 경로 (자정 기준이 되어 지금은 쓰이지 않는다)
  const now = Date.now(); _spamTaps[type] = _spamTaps[type].filter(t=>now-t<10000); _spamTaps[type].push(now);
  if(_spamTaps[type].length > 3){ const o = S.spam[d] || (S.spam[d] = {}); o[type] = (o[type]||0) + 1; save(KEYS.spam, S.spam); }
  const r = S.records[d] || (S.records[d] = blankRecord(d)); delete r.sample;
  const g = S.goals, w0 = r.water, c0 = cafOf(r);
  r[type] = (r[type]||0) + 1;

  setBubble(type==='water' ? `꿀꺽! 어젯밤 기록에 물 ${r.water}잔째` : `밤샘 중이구나… 어젯밤 카페인 ${cafOf(r)}잔째`);
  playDrinkReaction(type, { goalHit: type==='water' && w0 < g.water && r.water >= g.water, overNow: type!=='water' && cafOf(r) > g.caffeine && c0 <= g.caffeine });
}
// 빠른 기록 칸: 자정 기준이라 따로 고치지 않는다

// 기록 화면: 지난 날짜는 최근 7일 안에서 새로 넣을 수 있고, 미래 날짜는 고를 수 없다

const _quickDrink4 = quickDrink;
quickDrink = function(type){

const _sleepNow2 = sleepNow;
sleepNow = function(){

// [A2] [지금 잔다]를 누른 지 16시간이 지나도록 [지금 일어났다]를 안 눌렀으면

function checkForgotWake(){

  const gd = ymd(wakeAt(guess)), word = gd===today() ? '오늘' : gd===addDays(today(),-1) ? '어제' : dateLabel(gd).replace(/ \(.\)$/, '');

setTimeout(checkForgotWake, 600);
setInterval(checkForgotWake, 60000);

/* =========================================================
   B. 일주일 화면 — 요약 3칸 · 막대 모양 · 지난주 보기
   ========================================================= */
let weekOffset = 0;   // 0 = 최근 7일, 1~4 = n주 전
const weekDays = off => { const end = addDays(today(), -7*off), out = []; for(let i=6;i>=0;i--) out.push(addDays(end, -i)); return out; };
last7 = function(){ return weekDays(weekOffset); };   // 리듬·시작 전 비교도 고른 주로
const _cardStats1 = cardStats;
cardStats = function(){ const o = weekOffset; weekOffset = 0; try{ return _cardStats1(); } finally { weekOffset = o; } };   // 자랑 카드는 늘 최근 7일

function weekSummary(off){
  const days = weekDays(off), t = today(), g = S.goals;
  const recs = days.map(d=>S.records[d]).filter(Boolean);
  const sl = recs.map(sleepMinutes).filter(v=>v!=null);
  const doneRecs = days.filter(d=>d < t && S.records[d]).map(d=>S.records[d]);   // 오늘은 달성 판단에서 뺀다
  const sleepMet = doneRecs.filter(r=>{ const m = sleepMinutes(r); return m!=null && m >= g.sleepMin; }).length;

  const wakes = recs.filter(r=>!r.allNighter && r.wake).map(r=>toMin(r.wake));
  const ws = wakes.length >= 3 ? timeStats(wakes) : null;
  return { avg: sl.length ? avg(sl) : null, n: doneRecs.length, sleepMet, waterMet, ws };
}
function weekBars(o){
  const W=340, H=200, L=34, R=10, T=28, B=46, iw=W-L-R, ih=H-T-B, slot=iw/7, bw=Math.min(26, slot*0.56), t = today();

  o.days.forEach((d, i)=>{

    } else {

      if(val.total === 0) s += `<rect class="${val.segs[0].cls}${met?' met':''}${isToday?' today':''}" x="${(cx-bw/2).toFixed(1)}" y="${T+ih-2}" width="${bw.toFixed(1)}" height="2"/>`;

const leg = items => `<div class="legend">${items.map(([c,l])=>`<span><i style="background:var(${c})"></i>${l}</span>`).join('')}<span>✓ 목표 달성</span><span>점선 = 오늘(진행 중)</span></div>`;

  // [B2] 막대그래프 3개

// [C1] 나에게 맞는 수면 시간 (개운함 기록 5일 이상, 그 시간대 2일 이상)
function bestSleepBand(){
  const rs = Object.values(S.records).filter(r=>!r.sample && r.fresh && sleepMinutes(r)!=null);
  if(rs.length < 5) return null;
  const by = {};
  rs.forEach(r=>{ const h = Math.floor(sleepMinutes(r)/60); (by[h] = by[h] || []).push(r.fresh); });
  let best = null;
  Object.entries(by).forEach(([h, a])=>{ if(a.length < 2) return; const m = avg(a); if(!best || m > best.avg) best = { h:Number(h), avg:m, cnt:a.length }; });
  return best ? Object.assign(best, { n: rs.length }) : null;
}
const _findingLine2 = findingLine;
findingLine = function(){
  const b = bestSleepBand();
  if(b) return { text:`${b.h}시간대로 잤을 때 가장 개운했어(평균 ${b.avg.toFixed(1)}점)`, note:`개운함을 적은 ${b.n}일 중 ${b.h}시간대 ${b.cnt}일 기준` };
  return _findingLine2();
};
function decorateFinding(){
  const card = $('weekExtra').querySelector('.find'); if(!card) return;
  const b = bestSleepBand(); if(!b) return;
  const h = b.h, sg = S.prefs.sleepSuggest;
  if(S.goals.sleepMin === h*60 || h < 4 || h > 10) return;
  if(sg && sg.h === h && Date.now() < sg.until) return;   // 같은 제안은 7일에 한 번만
  const info = getPetInfo();
  card.insertAdjacentHTML('afterend', `<div class="card suggest" id="sleepSuggest">
    <div style="display:flex;align-items:center;gap:10px"><div style="width:64px;flex:none">${isEmpty() ? '' : drawKongariMood(info.branch, info.stage, 'happy', 64)}</div>
    <div class="bubble" style="text-align:left;flex:1">목표를 ${h}시간으로 바꿔 볼까?</div></div>
    <div class="brag-actions"><button type="button" class="ghost" id="sgKeep">그대로</button><button type="button" class="primary" id="sgChange">바꾸기</button></div></div>`);
  const done = ()=>{ S.prefs.sleepSuggest = { h, until: Date.now() + 7*24*3600*1000 }; save(KEYS.prefs, S.prefs); const el = $('sleepSuggest'); if(el) el.remove(); };
  $('sgKeep').addEventListener('click', ()=>{ done(); toast('수면 목표를 그대로 둘게요'); });
  $('sgChange').addEventListener('click', ()=>{ done(); S.goals.sleepMin = h*60; goalsChanged(); toast(`수면 목표를 ${h}시간으로 바꿨어요`); });
}

}

// 계산 기간: Lv1~3 동안(시작한 날부터 Lv4 직전까지)의 기록한 날
function branchScores(){
  const rs = babyDays(), g = S.goals, n = rs.length;
  const pct = c => n ? Math.round(c / n * 100) : 0;
  const wakeGoal = toMin((S.baseline && S.baseline.wake) || '07:00');
  const beds = rs.filter(r=>!r.allNighter && r.bed).map(r=>toMin(r.bed)), bs = beds.length ? timeStats(beds) : null;
  const c = {
    sleep:  rs.filter(r=>{ const m = sleepMinutes(r); return m!=null && m >= g.sleepMin; }).length,
    wake:   rs.filter(r=>!r.allNighter && r.wake && toMin(r.wake) <= wakeGoal).length,
    water:  rs.filter(r=>(r.water||0) >= g.water).length,
    caf:    rs.filter(r=>cafOf(r) <= g.caffeine).length,
    rhythm: bs ? rs.filter(r=>!r.allNighter && r.bed && Math.abs(circDiff(toMin(r.bed), bs.mean)) <= 40).length : 0,
    nap:    rs.filter(r=>Number(r.napMin) >= 20).length
  };
  const p = {}; Object.keys(c).forEach(k=>p[k] = pct(c[k]));
  return { n, count:c, pct:p };
}
const BRANCH_OF = { sleep:'cat', wake:'dog', water:'peng', caf:'ham', rhythm:'owl' };
function topHabit(p){ let best = 'sleep'; ['sleep','wake','water','caf','rhythm'].forEach(k=>{ if(p[k] > p[best]) best = k; }); return best; }   // 동점이면 앞의 것
decideBranch = function(){
  const { n, pct:p } = branchScores();
  if(n < 3) return 'basic';
  if(p.sleep >= 70 && p.water >= 70 && p.caf >= 70 && p.rhythm >= 70) return 'sparkle';
  if(p.sleep >= 60 && p.nap >= 50) return 'sleepy';
  const k = topHabit(p);
  return p[k] < 50 ? 'basic' : BRANCH_OF[k];
};
// 힌트: 아기 때 매일 처음 앱을 열 때 한 번
function branchHint(){
  const { pct:p } = branchScores();
  if(p.sleep >= 60 && p.water >= 60 && p.caf >= 60) return '반짝반짝한 기운이 느껴져…!';
  const k = topHabit(p);
  if(p[k] === 0) return KONG_HINT.basic;
  return (p.sleep >= 60 && p.nap >= 50) ? KONG_HINT.sleepy : KONG_HINT[BRANCH_OF[k]];
}

<script>
/* =========================================================
   [지금 잔다] · [지금 일어났다] 단추 규칙 · 사용법 보기
   ========================================================= */
// 하루(일어난 날짜 기준)에 밤잠 기록은 하나만
function hasNightSleep(d){ const r = S.records[d]; return !!(r && !r.sample && (r.allNighter || (r.bed && r.wake))); }
const minsSince = iso => (Date.now() - new Date(iso)) / 60000;
function lastWakeMins(){
  const at = S.prefs.lastWakeAt; if(at) return (Date.now() - at) / 60000;
  const r = S.records[today()]; if(r && r.wake && !r.sample){ const [h,m] = r.wake.split(':').map(Number); const w = new Date(); w.setHours(h, m, 0, 0); const d = (Date.now() - w) / 60000; return d >= 0 ? d : null; }
  return null;
}
// 화면 안 확인 창
function askSheet(title, text, yes, no, onYes, onNo){
  const info = getPetInfo();
  openSheet(title, `<div style="display:flex;align-items:center;gap:12px"><div style="width:84px;flex:none">${isEmpty() ? '' : drawKongariMood(info.branch, info.stage, 'sleepy', 84)}</div><div class="bubble" style="text-align:left;flex:1">${esc(text)}</div></div>
    <div class="brag-actions"><button type="button" class="ghost" id="askNo">${esc(no)}</button><button type="button" class="primary" id="askYes">${esc(yes)}</button></div>`, ()=>{
    $('askNo').addEventListener('click', ()=>{ closeSheet(); if(onNo) onNo(); });
    $('askYes').addEventListener('click', ()=>{ closeSheet(); onYes(); });
  });
}

/* ── [지금 잔다] ── */
let _sleepLock = false, _wakeLock = false;
const lock = (which, ms=1500) => { if(which==='sleep'){ _sleepLock = true; setTimeout(()=>_sleepLock = false, ms); } else { _wakeLock = true; setTimeout(()=>_wakeLock = false, ms); } };
const _sleepNow3 = sleepNow;
function beginSleep(nap){
  lock('sleep');
  _sleepNow3();
  const st = sleepState();
  if(st && nap){ st.nap = true; save(KEYS.sleep, st); setBubble('낮잠 시작… 쿨쿨'); renderQuick(); }
}
sleepNow = function(){
  if(_sleepLock) return;                                   // 연타 방지
  if(sleepState()){ setBubble('이미 자고 있어… 음냐'); return; }   // 새 기록은 만들지 않는다
  const h = new Date().getHours(), lw = lastWakeMins();
  if(lw != null && lw < 120){ askSheet('낮잠이야?', '방금 일어났잖아! 낮잠이야?', '낮잠 기록', '취소', ()=>beginSleep(true)); return; }
  if(h >= 10 && h < 18){ askSheet('낮잠이야?', '낮잠이야?', '낮잠 기록', '취소', ()=>beginSleep(true)); return; }
  beginSleep(false);
};

/* ── [지금 일어났다] ── */
const _wakeNow3 = wakeNow;
function afterWake(){ S.prefs.lastWakeAt = Date.now(); save(KEYS.prefs, S.prefs); }
wakeNow = function(){
  if(_wakeLock) return; lock('wake');                      // 연타해도 한 번만
  const st = sleepState();
  if(!st){
    const r = S.records[today()];
    if(r && !r.sample && (r.wake || r.allNighter)){ setBubble('오늘은 이미 일어났어! 기록을 고치려면 기록 탭으로 가 줘'); return; }
    openForgotBed(); return;
  }
  const mins = minsSince(st.since);
  if(mins < 10){
    setBubble('벌써? 잘못 누른 거면 [되돌리기]');
    showUndo('잠든 지 10분도 안 됐어요', ()=>{ save(KEYS.sleep, null); clearScene(); renderQuick(); renderPet(); setBubble('잠자기를 취소했어'); });
    return;   // 수면으로 기록하지 않는다
  }
  if(st.nap){
    // 낮잠: 일반 잠 대신 그날 낮잠(분)에 더한다
    const d = today(), r = S.records[d] || (S.records[d] = blankRecord(d)); delete r.sample;
    const m = Math.round(mins); r.napMin = Math.min(600, (Number(r.napMin)||0) + m);
    save(KEYS.records, S.records); save(KEYS.sleep, null);
    clearScene(); afterQuick(); renderQuick(); renderPet(); afterWake();
    setBubble('잘 잤다~');   // 낮잠: 개운함은 묻지 않는다
    return;
  }
  if(hasNightSleep(today())){
    save(KEYS.sleep, null); clearScene(); renderQuick(); renderPet();
    setBubble('오늘 잠 기록이 이미 있어. 기록 탭에서 고쳐 줘');
    return;   // 덮어쓰지 않는다
  }
  _wakeNow3(); afterWake();
};
// 자는 중이 아닐 때 [지금 일어났다]: "어젯밤 몇 시에 잤어?"
function openForgotBed(){
  const guess = (S.baseline && S.baseline.bed) || '01:00', info = getPetInfo();
  openSheet('어젯밤 잔 시각', `
    <div style="display:flex;align-items:center;gap:12px"><div style="width:84px;flex:none">${isEmpty() ? '' : drawKongariMood(info.branch, info.stage, 'sleepy', 84)}</div><div class="bubble" style="text-align:left;flex:1">어젯밤 몇 시에 잤어?</div></div>
    <label class="field"><span>잠든 시각</span><input type="time" id="fbBed" value="${guess}"></label>
    <div class="ferr" id="fbErr" role="alert" hidden></div>
    <div class="brag-actions"><button type="button" class="ghost" id="fbNo">취소</button><button type="button" class="primary" id="fbOk">기록하기</button></div>`, ()=>{
    $('fbNo').addEventListener('click', closeSheet);
    $('fbOk').addEventListener('click', ()=>{
      const t = $('fbBed').value, now = new Date(), wake = hhmm(now), err = $('fbErr');
      if(!t){ err.textContent = '잠든 시각을 골라 주세요'; err.hidden = false; return; }
      if(t === wake){ err.textContent = '두 시각이 같아요. 다시 확인해 주세요'; err.hidden = false; return; }
      if(nightMinutes(t, wake) > 14*60){ err.textContent = `${fmtHM(nightMinutes(t, wake))}이나 잔 걸로 돼요. 잠든 시각을 다시 확인해 주세요`; err.hidden = false; return; }
      const d = today();
      if(hasNightSleep(d)){ closeSheet(); setBubble('오늘 잠 기록이 이미 있어. 기록 탭에서 고쳐 줘'); return; }
      const r = S.records[d] || (S.records[d] = blankRecord(d)); delete r.sample;
      r.bed = t; r.wake = wake; r.allNighter = false; r.edited = true;   // "✎ 고침"
      save(KEYS.records, S.records);
      closeSheet(); afterQuick(); renderQuick(); renderPet(); renderList(); afterWake();
      setBubble(`좋은 아침! ${t}에 자서 ${fmtHM(nightMinutes(t, wake))} 잤구나`);
    });
  });
}

/* ── 단추 모양: 자는 중이면 [지금 잔다], 아니면 [지금 일어났다]를 흐리게 (눌리기는 한다) ── */
const _renderQuick2 = renderQuick;
renderQuick = function(){
  _renderQuick2();
  const st = sleepState(), sb = $('quickBar').querySelector('[data-q="sleep"]'), wb = $('quickBar').querySelector('[data-q="wake"]');
  if(sb){ sb.disabled = false; sb.classList.toggle('dim', !!st); sb.setAttribute('aria-disabled', !!st);
    if(st && st.nap){ const b = sb.querySelector('b'); if(b) b.textContent = '낮잠 중'; } }
  if(wb){ wb.classList.toggle('dim', !st); wb.setAttribute('aria-disabled', !st); }
};

/* ── 설정: [사용법 보기] (처음 시작 뒤에 자동으로 띄우지 않는다) ── */
$('btnSettings').addEventListener('click', ()=>{
  const box = $('settingsExtra'); if(!box) return;
  const card = document.createElement('div'); card.className = 'card'; card.style.cssText = 'padding:12px 14px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px';
  card.innerHTML = `<span>처음이라면</span><button type="button" class="ghost sm" id="btnHowTo">사용법 보기</button>`;
  const firstDev = box.querySelector('.dev-card'); if(firstDev) box.insertBefore(card, firstDev); else box.appendChild(card);
  $('btnHowTo').addEventListener('click', openHowTo);
});
function openHowTo(){
  const step = (n, t, d) => `<div class="howto"><b>${n}</b><div><h3>${t}</h3><p>${d}</p></div></div>`;
  openSheet('사용법', `
    ${step(1, '빠른 기록', '물·커피·에너지 드링크를 마실 때마다 펫 화면 아래 단추를 눌러요. 실수로 눌렀으면 3초 안에 [되돌리기].')}
    ${step(2, '잘 때와 일어날 때', '[지금 잔다]를 누르고 자요. 일어나면 [지금 일어났다]. 깜빡했으면 기록 탭에서 시각을 직접 넣어요.')}
    ${step(3, '콩알이 키우기', '수면·물·카페인 목표를 채우면 경험치와 코인이 쌓여요. Lv4가 될 때 습관에 따라 8가지 모습 중 하나로 자라요.')}
    ${step(4, '일주일 보기', '일주일 탭에서 7일 흐름과 목표 달성 일수를 봐요. 막대를 누르면 그날 기록이 보여요.')}
    ${step(5, '시험 D-day', '설정에서 시험을 넣으면 펫 화면 맨 위에 D-day가 떠요.')}`);
}

// 처음 한 번 단추 모양 맞추기
if(!$('app').hidden) renderQuick();
</script>

<script>
/* =========================================================
   팀원 사용 후기 반영
   [1] 시험용 단추는 개발자 칸에만 · [2] 갈래 정하기 · [3] 단추가 사라지지 않게
   [4] 코인·경험치가 보이게 · [5] 저장 안 되는 브라우저 안내 · 내 펫 옮기기
   ========================================================= */

/* ── [1] 개발자 칸으로 올린 경험치로 자란 콩알이는 도감에 "🧪 시험용" ── */
const _grantExp1 = grantExp;
grantExp = function(n){ if(S.profile && !isEmpty()){ S.profile.devExp = true; save(KEYS.profile, S.profile); } return _grantExp1(n); };
const _hatchNew1 = hatchNew;
hatchNew = function(name){
  const old = S.profile, last = S.dex && S.dex.entries[S.dex.entries.length-1];
  if(old && old.devExp && last && last.name === old.petName && last.graduatedOn === today()){ last.test = true; save(KEYS.dex, S.dex); }
  return _hatchNew1(name);
};
function markTestDex(){
  const root = $('sheetRoot');
  root.querySelectorAll('.dex-cell').forEach(c=>{ const list = S.dex.entries.filter(e=>e.branch===c.dataset.dex);
    if(list.length && list[list.length-1].test) c.insertAdjacentHTML('beforeend','<span class="test-mark">🧪 시험용</span>'); });
  const grid = root.querySelector('.dex-grid');
  if(grid) grid.addEventListener('click', e=>{ const c = e.target.closest('[data-dex]'); if(!c) return;
    const list = S.dex.entries.filter(x=>x.branch===c.dataset.dex), last = list[list.length-1];
    if(last && last.test){ const h = $('dexDetail').querySelector('h3'); if(h && !h.querySelector('.test-mark')) h.insertAdjacentHTML('beforeend',' <span class="test-mark">🧪 시험용</span>'); } });
}
$('btnDex').addEventListener('click', markTestDex);   // 도감 단추는 원래 함수에 직접 묶여 있어서, 뒤에 따로 붙인다

/* ── [2] Lv4 갈래 정하기 ── */
// 아기(Lv1~3) 동안 누른 단추 세기
function babyActs(){ const p = S.profile; if(!p.babyActs) p.babyActs = { water:0, coffee:0, energy:0, earlyWake:0, nap:0 }; return p.babyActs; }
const isBaby = () => S.profile && !isEmpty() && stageOf(S.profile.level) === 'baby';
const _quickDrink5 = quickDrink;
quickDrink = function(type){
  const before = S.records[drinkDate()] ? (S.records[drinkDate()][type]||0) : 0;
  _quickDrink5(type);
  const r = S.records[drinkDate()];
  if(isBaby() && r && (r[type]||0) > before){ babyActs()[type]++; save(KEYS.profile, S.profile); }
  renderGrowBars(true);
};
const _wakeNow4 = wakeNow;
wakeNow = function(){
  const wasBaby = isBaby(), lw0 = S.prefs.lastWakeAt, st = sleepState();
  _wakeNow4();
  if(wasBaby && S.prefs.lastWakeAt && S.prefs.lastWakeAt !== lw0){
    const a = babyActs();
    if(new Date().getHours() < 8) a.earlyWake++;
    if(st && st.nap) a.nap++;
    save(KEYS.profile, S.profile);
  }
  renderGrowBars(true);
};
// 이름을 바탕으로 한 '고정된 무작위' (같은 콩알이는 매번 같은 결과)
function seededPick(arr){ const key = (S.profile.petName||'') + (S.profile.createdAt||''); let h = 0; for(const ch of key) h = (h*31 + ch.charCodeAt(0)) >>> 0; return arr[h % arr.length]; }
function actionScores(){
  const a = babyActs(), rs = babyDays(), g = S.goals;
  const sleepMet = rs.filter(r=>{ const m = sleepMinutes(r); return m!=null && m >= g.sleepMin; }).length;
  const waterMet = rs.filter(r=>(r.water||0) >= g.water).length;
  const cafKept = rs.filter(r=>cafOf(r) <= g.caffeine).length;
  const napDays = rs.filter(r=>Number(r.napMin) > 0).length;
  return {
    peng: a.water,
    cat: sleepMet,
    dog: a.earlyWake,
    ham: (a.coffee + a.energy === 0 && a.water >= 3) ? a.water : 0,
    sleepy: Math.max(a.nap, napDays),
    owl: (waterMet && sleepMet && cafKept) ? Math.min(waterMet, sleepMet, cafKept) : 0
  };
}
const _decideBranch2 = decideBranch;
decideBranch = function(){
  const { n, pct:p } = branchScores();
  if(n >= 3){
    // 기록한 날 3일 이상: 가장 높은 습관 점수 (50% 기준 없음)
    const order = [['sleep','cat'],['wake','dog'],['water','peng'],['caf','ham'],['rhythm','owl'],['nap','sleepy']];
    let best = order[0]; order.forEach(o=>{ if(p[o[0]] > p[best[0]]) best = o; });
    return best[1];
  }
  // 기록한 날 3일 미만: 아기 동안 누른 단추와 기록으로
  const sc = actionScores(), a = babyActs();
  const top = Math.max(...Object.values(sc));
  if(top > 0) return seededPick(Object.keys(sc).filter(k=>sc[k] === top));
  const anything = babyDays().length || a.water || a.coffee || a.energy || a.earlyWake || a.nap;
  return anything ? seededPick(['cat','dog','peng','ham','owl','sleepy']) : 'basic';   // 아무것도 안 했을 때만 기본
};
// 어떤 경우든 5% 확률로 희귀한 반짝
const _playEvolution1 = playEvolution;
playEvolution = function(from, to){
  const p = S.profile; let rare = false;
  if(to !== 'baby' && !p.branch){
    rare = Math.random() < 0.05;
    p.branch = rare ? 'sparkle' : decideBranch(); p.form = p.branch; save(KEYS.profile, p);
  }
  _playEvolution1(from, to);
  renderGrowBars();
  if(rare) setTimeout(()=>{
    setBubble('✨ 희귀한 반짝 콩알이!'); toast('✨ 희귀한 반짝 콩알이가 나타났어요!');
    if(!reduced()){ $('fxLayer').innerHTML = fxSVG(sparkles()); petAnim('jump', 1400); setTimeout(()=>{ if(scene!=='sleep') $('fxLayer').innerHTML=''; }, 1600); }
  }, reduced() ? 50 : 2100);
};
// 아기 동안 '자라는 기운' 막대
const GROW = [['peng','물','펭 배'],['cat','잠','냥 귀'],['dog','기상','멍 귀'],['ham','카페인','햄 볼'],['sleepy','낮잠','잠꾸러기']];
let _growPrev = {};
function renderGrowBars(bump){
  let box = $('growBars');
  if(!box){ box = document.createElement('div'); box.id = 'growBars'; box.className = 'grow'; box.setAttribute('aria-label','자라는 기운'); $('statRow').insertAdjacentElement('afterend', box); }
  if(!isBaby() || $('app').hidden){ box.hidden = true; return; }
  const sc = actionScores(), max = Math.max(5, ...GROW.map(g=>sc[g[0]]));
  const top = Math.max(...GROW.map(g=>sc[g[0]])), lead = top > 0 ? GROW.find(g=>sc[g[0]] === top) : null;
  box.hidden = false;
  box.innerHTML = `<span class="grow-title">자라는 기운</span>` + GROW.map(([k, label])=>{
    const v = sc[k], up = bump && v > (_growPrev[k]||0);
    return `<div class="grow-col${up?' up':''}${lead && lead[0]===k ? ' lead' : ''}" title="${label} ${v}"><div class="grow-bar"><i style="height:${Math.round(v/max*100)}%"></i></div><small>${label}</small></div>`;
  }).join('') + `<span class="grow-lead">${lead ? `${lead[2]} 기운!` : '아직 몰라…'}</span>`;
  _growPrev = sc;
}
const _renderStats5 = renderStats;
renderStats = function(){ _renderStats5(); renderGrowBars(); markCoinChip(); };

/* ── [3] 빠른 기록 단추가 사라지지 않게 ── */
// 잠자기 화면이 떠 있을 때만 숨기고(일어날 수 있게 [지금 일어났다]는 남김), 그 밖에는 늘 보이게
const _renderQuick3 = renderQuick;
renderQuick = function(){
  try{ _renderQuick3(); } catch(e){ console.error(e); }
  const q = $('quickBar'); if(!q) return;
  q.hidden = false;
  q.classList.toggle('asleep', scene === 'sleep');
};
function ensureUI(){
  if($('app').hidden || !S.goals) return;
  const q = $('quickBar');
  if(q.hidden || !q.querySelector('.qbtn')) renderQuick();
  // 저장된 잠자기 상태와 화면이 안 맞으면 바로잡는다
  const st = sleepState();
  const waking = (typeof wakeRun !== 'undefined' && wakeRun) || scene === 'wake';
  if(st && scene !== 'sleep' && !waking) startSleepScene({ instant:true });
  else if(!st && scene === 'sleep') { clearScene(); renderPet(); }
  q.classList.toggle('asleep', scene === 'sleep');
  if(!$('statRow').innerHTML.trim()) renderStats();
}
const _startSleepScene1 = startSleepScene;
startSleepScene = function(o){ _startSleepScene1(o); renderQuick(); };
const _clearScene1 = clearScene;
clearScene = function(){ _clearScene1(); renderQuick(); };
const _closeSheet1 = closeSheet;
closeSheet = function(){ _closeSheet1(); setTimeout(ensureUI, 0); };
const _showApp3 = showApp;
showApp = function(){ try{ _showApp3(); } finally { renderQuick(); renderStats(); } };
setInterval(ensureUI, 1000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) ensureUI(); });
window.addEventListener('pageshow', ensureUI);

/* ── [4] 오늘 목표 달성 순간 · 코인 받는 법 ── */
const _runCoins2 = runCoins;
runCoins = function(){
  const d = today(), had = !!(S.coinlog[d] && S.coinlog[d].both), c0 = S.profile ? (S.profile.coins||0) : 0;
  const r = _runCoins2();
  if(!had && S.coinlog[d] && S.coinlog[d].both) celebrateGoals(c0);
  return r;
};
function celebrateGoals(fromCoins){
  const el = document.createElement('div'); el.className = 'goal-pop'; el.setAttribute('role','status');
  el.innerHTML = `<b>🎉 오늘 목표 달성!</b><span>코인 +20</span>`;
  $('petStage').appendChild(el); setTimeout(()=>el.remove(), 2800);
  setTimeout(()=>setBubble('수면도 물도 다 채웠어! 최고야!'), 80);
  // 코인 숫자가 올라가는 연출
  const to = S.profile.coins||0, chip = $('statRow').querySelector('.chip.coin');
  if(!chip || reduced()) return;
  const t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0)/900), v = Math.round(fromCoins + (to - fromCoins)*k);
    const c = $('statRow').querySelector('.chip.coin'); if(c){ c.textContent = `코인 ${v}`; c.classList.add('bump'); }
    if(k < 1) requestAnimationFrame(step); else { const c2 = $('statRow').querySelector('.chip.coin'); if(c2) c2.classList.remove('bump'); markCoinChip(); } };
  requestAnimationFrame(step);
}
function markCoinChip(){ const c = $('statRow').querySelector('.chip.coin'); if(c){ c.setAttribute('role','button'); c.tabIndex = 0; c.setAttribute('aria-label', `${c.textContent}. 코인 받는 법 보기`); } }
function openCoinHelp(){
  const row = (k, v) => `<div class="set-row"><span>${k}</span><b class="num" style="font-weight:400">${v}</b></div>`;
  openSheet('코인 받는 법', `<div class="coin-line">내 코인 <span class="num">${S.profile.coins||0}</span></div>
    <div class="card" style="padding:4px 14px">${row('수면·물 목표 둘 다 채운 날','+20')}${row('카페인 목표 지킨 날','+5')}${row('기상 미션 (일어나고 10분 안)','+5')}${row('완벽한 여행 (꼬질·덜덜 없이)','여행 코인 2배')}</div>

function storageWorks(){

save = function(k, v){

// 사파리는 다른 사이트 안에 들어간 화면(이 앱처럼)의 저장 공간을 따로 관리하고, 오래 안 쓰면 지울 수 있다
const _isSafari = /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(navigator.userAgent) || /iPhone|iPad|iPod/.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
const _inFrame = (()=>{ try{ return window.self !== window.top; }catch(e){ return true; } })();
setTimeout(()=>{

/* ── 설정: [내 펫 옮기기] (백업 코드 복사·불러오기) ── */
const BACKUP_PREFIX = 'KONG1:';
function makeBackup(){
  const data = {}; Object.entries(KEYS).forEach(([name, key])=>{ data[key] = load(key, null); });
  return BACKUP_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify({ v:1, at:new Date().toISOString(), data }))));
}
function readBackup(code){
  try{
    code = (code||'').trim(); if(!code.startsWith(BACKUP_PREFIX)) return null;
    const o = JSON.parse(decodeURIComponent(escape(atob(code.slice(BACKUP_PREFIX.length)))));
    if(!o || !o.data || !o.data[KEYS.profile] || !o.data[KEYS.goals] || !o.data[KEYS.baseline]) return null;
    return o;
  }catch(e){ return null; }
}
function openBackup(){
  const code = makeBackup();
  openSheet('내 펫 옮기기', `
    <p class="hint" style="margin:0">⚠ 이 코드에는 내 기록이 다 들어 있어요. 다른 사람에게 보내지 마세요.</p>
    <label class="field"><span>내 백업 코드</span><textarea id="bkCode" class="code-box" readonly rows="4">${esc(code)}</textarea></label>

    <label class="field"><span>백업 불러오기</span><textarea id="bkIn" class="code-box" rows="4" placeholder="다른 기기에서 복사한 코드를 붙여 넣어 주세요"></textarea></label>
    <div class="ferr" id="bkErr" role="alert" hidden></div>
    <div id="bkConfirm"></div>
    <button type="button" class="ghost" id="bkLoad">백업 불러오기</button>`, ()=>{
    $('bkCopy').addEventListener('click', ()=>{
      const ta = $('bkCode');

      try{ navigator.clipboard.writeText(ta.value).then(()=>toast('백업 코드를 복사했어요'), fallback); }catch(e){ fallback(); }
    });
    $('bkLoad').addEventListener('click', ()=>{
      const err = $('bkErr'), o = readBackup($('bkIn').value);
      if(!o){ err.textContent = '잘못된 코드예요. 복사한 코드를 끝까지 붙여 넣었는지 확인해 주세요. 지금 데이터는 그대로예요.'; err.hidden = false; return; }
      err.hidden = true;
      const p = o.data[KEYS.profile] || {};
      $('bkConfirm').innerHTML = `<div class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-color:var(--caf-over)">
        <p style="margin:0">지금 데이터를 지우고 '${esc(p.petName||'콩알이')}'(Lv${p.level||1}) 백업으로 덮어쓸까요?</p>
        <div class="brag-actions"><button type="button" class="ghost" id="bkNo">취소</button><button type="button" class="primary" id="bkYes">덮어쓰기</button></div></div>`;
      $('bkNo').addEventListener('click', ()=>{ $('bkConfirm').innerHTML = ''; });
      $('bkYes').addEventListener('click', ()=>{
        Object.values(KEYS).forEach(k=>{ const v = o.data[k]; if(v == null){ try{ localStorage.removeItem(k); }catch(e){} delete MEM[k]; } else save(k, v); });
        closeSheet(); toast('백업을 불러왔어요. 다시 여는 중…');
        setTimeout(()=>{ try{ location.reload(); }catch(e){ toast('불러왔어요. 앱을 다시 열어 주세요'); } }, 600);
      });
    });
  });
}

  const card = document.createElement('div'); card.className = 'card'; card.style.cssText = 'padding:12px 14px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px';

<script>
/* =========================================================
   커피·에너지 드링크(그리고 물) 목표는 '한도'가 아니라 '기준' — 넘어도 그대로 기록하고 알려만 준다
   ========================================================= */
// 기록 화면 + 단추의 고정 상한을 넉넉하게 (목표와 상관없이 막히지 않게)
STEP.water.max = 40; STEP.coffee.max = 30; STEP.energy.max = 30;
// '이하'·'한도' 대신 '목표'

STEP.obGCaf.fmt = v => `${v}잔`;

const _quickDrink6 = quickDrink;
quickDrink = function(type){

  _quickDrink6(type);
  // 카페인 목표를 넘으면 막지 않고 알려만 준다 (연타일 때는 "진짜 마신 거 맞아?"가 먼저)
  const r2 = S.records[d];
  if(type !== 'water' && r2 && cafOf(r2) > S.goals.caffeine && !(_taps[type] && _taps[type].length > 3)) setTimeout(()=>setBubble('오늘 카페인 목표를 넘었어… 그래도 기록은 해 둘게!'), 40);
};
// 기록 화면에서 저장한 날도 목표를 넘었으면 알려 준다
window.addEventListener('submit', e=>{ if(e.target.id !== 'recForm') return; const d = $('fDate').value, before = JSON.stringify(S.records[d] || null); setTimeout(()=>{
  if(JSON.stringify(S.records[d] || null) === before) return;   // 저장되지 않았으면(검사에 걸림·확인 창) 말하지 않는다
  const r = S.records[d];
  if(r && cafOf(r) > S.goals.caffeine) toast(`${isEmpty() ? '콩알이' : S.profile.petName}: 오늘 카페인 목표를 넘었어… 그래도 기록은 해 둘게!`);

<script>
/* =========================================================
   한 곳 원칙 — 날짜별 기록은 S.records[날짜] 하나뿐.
   간편 단추·기록 탭·펫 화면·일주일 그래프가 모두 이것만 읽고 쓴다.
   ========================================================= */
let _formBase = null, _formDirty = false, _formFilling = false;
const _recSnap = d => JSON.stringify(S.records[d] || null);
function _markFormClean(d){ _formBase = { d, snap: _recSnap(d) }; _formDirty = false; }
// 저장소에 있는 그날 기록을 입력칸으로 불러온다 (없으면 빈 새 기록)
function loadFormFromStore(date){
  const d = date || today(), r = S.records[d];
  _formFilling = true;
  try{
    if(!r || r.sample){ _resetForm9(d); }
    else {
      editingDate = d; fillForm(r, d);
      if(!r.allNighter && (!r.bed || !r.wake)){   // 잠 기록이 아직 없으면 시각 칸만 평소 시각으로 채워 둔다
        const prev = S.records[addDays(d,-1)];
        if(!r.bed) $('fBed').value = prev && !prev.allNighter && prev.bed ? prev.bed : S.baseline.bed;
        if(!r.wake) $('fWake').value = prev && !prev.allNighter && prev.wake ? prev.wake : S.baseline.wake;
        updSleepTotal();
      }
      $('formTitle').textContent = d === today() ? '오늘 기록' : `${dateLabel(d)} 수정`;
      $('btnCancelEdit').hidden = d === today(); $('recForm').classList.toggle('editing', d !== today());
      setDateLimits(d); clearFormErrs();
    }
  } finally { _formFilling = false; }
  _markFormClean(d);
}
// 처음 열 때·저장한 뒤·고치기 취소 때 → 빈 칸이 아니라 저장소의 최신 값
const _resetForm9 = resetForm;
resetForm = function(date){ loadFormFromStore(date || today()); };
const _startEdit9 = startEdit;
startEdit = function(date){ _startEdit9(date); loadFormFromStore(date); $('formTitle').textContent = `${dateLabel(date)} 수정`; };
// 기록 탭을 열 때마다 다시 채운다
const _switchTab9 = switchTab;
switchTab = function(tab){
  const wasRec = !$('scr-rec').hidden;
  _switchTab9(tab);
  if(tab === 'rec' && !wasRec && S.goals) loadFormFromStore(today());
};
// 날짜를 바꾸면 그날 기록을 불러온다 (다른 날 기록을 옮겨 지우지 않게)
$('fDate').addEventListener('change', ()=>{
  const d = $('fDate').value; if(!d) return;
  if(S.records[d] && !S.records[d].sample) loadFormFromStore(d);
  else { editingDate = null; $('formTitle').textContent = '기록하기'; $('btnCancelEdit').hidden = false; _markFormClean(d); _formDirty = true; }
});
// 입력칸을 손대면 '고치는 중'
$('recForm').addEventListener('input', ()=>{ if(!_formFilling) _formDirty = true; });
$('recForm').addEventListener('click', e=>{ if(e.target.closest('.stepper button, #fAllNighter, .fresh button, [data-fresh], #btnSameYesterday')) _formDirty = true; });

// 저장소가 바뀌면(간편 단추·잔다/일어났다·되돌리기·다른 창) 화면 전체를 그 값으로
let _syncT = null;
function onRecordsChanged(){
  clearTimeout(_syncT);
  _syncT = setTimeout(()=>{
    try{ renderTodayCard(); renderQuick(); renderList(); renderWeek(); renderStats(); renderPet(); }catch(e){}
    if(!$('scr-rec').hidden && _formBase && !_formDirty && _recSnap(_formBase.d) !== _formBase.snap) loadFormFromStore(_formBase.d);
  }, 0);
}
const _save9 = save;
save = function(k, v){ const r = _save9(k, v); if(k === KEYS.records) onRecordsChanged(); return r; };
window.addEventListener('storage', e=>{
  if(e.key !== KEYS.records) return;
  S.records = load(KEYS.records, {}) || {}; onRecordsChanged();
});

// 저장 전에: 고치는 동안 다른 곳에서 값이 바뀌었으면 물어본다 (모든 검사보다 먼저)
let _staleOk = false, _preSave = null;
window.addEventListener('submit', e=>{
  if(e.target.id !== 'recForm') return;
  if(!_staleOk && _formBase && _recSnap(_formBase.d) !== _formBase.snap){
    e.preventDefault(); e.stopImmediatePropagation();
    askSheet('다른 곳에서 바뀐 값', '다른 곳에서 바뀐 값이 있어요. 새 값으로 불러올까요?', '새 값 불러오기', '내 입력으로 저장',
      ()=>{ loadFormFromStore(_formBase.d); toast('최신 값으로 불러왔어요'); },
      ()=>{ _staleOk = true; try{ $('recForm').requestSubmit(); } finally { _staleOk = false; } });
    return;
  }
  const d = $('fDate').value;
  _preSave = { d, old: S.records[d] ? deep(S.records[d]) : null };
}, true);
// 저장한 뒤: 기록 칸에 없는 값(마지막 자동 시각 등)은 그대로 두고, 줄어든 만큼 반영하고, 코인을 맞춘다
$('recForm').addEventListener('submit', ()=>{
  const ps = _preSave; _preSave = null; if(!ps) return;
  const r = S.records[ps.d]; if(!r || !ps.old) { onRecordsChanged(); return; }
  if(JSON.stringify(r) === JSON.stringify(ps.old)) return;
  Object.keys(ps.old).forEach(k=>{ if(!(k in r) && k !== 'sample') r[k] = ps.old[k]; });
  // 연타 표시(경험치 없는 잔)는 그날 기록 값을 넘지 않게 — 줄인 잔은 연타 잔부터 뺀다
  const sp = S.spam[ps.d];
  if(sp){ ['water','coffee','energy'].forEach(t=>{ const cut = Math.max(0, (ps.old[t]||0) - (r[t]||0)); if(sp[t]) sp[t] = Math.max(0, Math.min(sp[t] - cut, r[t]||0)); }); save(KEYS.spam, S.spam); }
  _save9(KEYS.records, S.records);
  setTimeout(()=>{ revokeGoalCoins(ps.d); onRecordsChanged(); }, 0);
});
// 목표 달성이 취소되면 그날 받은 목표 코인을 되돌린다 (경험치는 그대로)
function revokeGoalCoins(d){
  const c = S.coinlog[d], r = S.records[d], g = S.goals; if(!c || !g || !S.profile) return;
  let back = 0, why = [];
  withoutSpam(()=>{
    const sm = r ? sleepMinutes(r) : null;
    if(c.both && !(r && sm != null && sm >= g.sleepMin && r.water >= g.water)){ back += c.both; delete c.both; why.push('수면·물 목표'); }
    if(c.caf && !(r && cafOf(r) <= g.caffeine)){ back += c.caf; delete c.caf; why.push('카페인 목표'); }
  });
  if(!back) return;
  if(!Object.keys(c).length) delete S.coinlog[d];
  S.profile.coins = Math.max(0, (S.profile.coins||0) - back);
  save(KEYS.coinlog, S.coinlog); save(KEYS.profile, S.profile); renderStats();
  setTimeout(()=>toast(`${why.join('·')} 달성이 취소돼서 코인 ${back}개를 되돌렸어요 (경험치는 그대로)`), 2600);
}
// 지난 기록에서 지워도 같은 원칙
$('recList').addEventListener('click', e=>{ const dl = e.target.closest('[data-del]'); if(dl){ const d = dl.dataset.del; setTimeout(()=>{ if(!S.records[d]) revokeGoalCoins(d); }, 0); } });
// 지금 열린 기록 탭도 최신 값으로
if(S.goals && $('app') && !$('app').hidden) loadFormFromStore(today());
</script>

function wearSVGFor(w, branch, stage){

      let list = closetTab==='special' ? owned.filter(x=>x.special)
               : closetTab==='room' ? owned.filter(x=>(x.kind==='room'||x.kind==='bg') && !x.special)
               : owned.filter(x=>x.kind===closetTab && !x.special);
      list.sort((a,b)=>a.price-b.price);
      const card = it => {
        const on = isOn(it), sp = S.items.special[it.id];
        const expired = it.id==='sp_examdone' && sp && sp.until && Date.now() > sp.until;
        const act = it.kind==='room'||it.kind==='bg' ? (on?'치우기':'놓기') : (on?'벗기':'입기');
        return `<div class="deco ${on?'on':''}">${on?'<span class="tag">착용 중</span>':''}${itemIcon(it)}<b>${esc(it.name)}</b>${it.special && sp ? `<span class="sub">${dateLabel(sp.on)} · ${esc(sp.why||it.why||'')}</span>` : ''}${it.kind==='room'?`<span class="sub">${SLOT_NAME[it.slot]}</span>`:''}${expired ? `<span class="sub">하루가 지나 끝났어요</span>` : `<button type="button" class="ghost" data-ctog="${it.id}">${act}</button>`}</div>`;
      };
      $('clGrid').innerHTML = list.length ? `<div class="deco-grid">${list.map(card).join('')}</div>`
        : `<div class="closet-empty">${closetTab==='special' ? '특별 아이템은 코인으로 못 사요. 7일 연속 달성, 도감 완성, 시험 끝, 완벽한 여행 3번, 반짝 콩알이 여행 때 들어와요.' : '아직 산 아이템이 없어요. 상점에서 골라 보세요.'}</div>`;
    };
    draw();
    root.querySelector('.sheet').addEventListener('click', e=>{
      const t = e.target.closest('[data-ctab]'); if(t){ closetTab = t.dataset.ctab; draw(); return; }
      const g = e.target.closest('[data-ctog]'); if(g){ const it = itemById(g.dataset.ctog); const was = isOn(it); toggleItem(it); if(!was) tryOnLine(it); draw(); return; }
      if(e.target.id === 'clOff'){ S.items.wear.hat = null; S.items.wear.glasses = null; S.items.wear.hand = null; save(KEYS.items, S.items); renderPet(); draw(); toast('모두 벗었어요 (방 꾸미기는 그대로)'); }
    });
  });
}
