const _renderStats9 = renderStats;
renderStats = function(){ const r = _renderStats9.apply(this, arguments); const row = $('statRow'); if(row && S.profile && !isEmpty() && !$('btnCloset')) row.insertAdjacentHTML('beforeend', `<button class="ghost brag-btn" id="btnCloset" type="button">👕 옷장</button>`); return r; };
$('statRow').addEventListener('click', e=>{ if(e.target.closest('#btnCloset')) openCloset(); });

/* ── 특별 아이템: 조건을 채우면 옷장에 ── */
function grantSpecial(id, why, extra){
  fixItems();
  if(S.items.special[id]) return false;
  S.items.special[id] = Object.assign({ on: today(), why }, extra||{});
  if(!S.items.owned.includes(id)) S.items.owned.push(id);
  save(KEYS.items, S.items);
  const it = itemById(id);
  setTimeout(()=>toast(`특별 아이템 '${it ? it.name : id}'이(가) 옷장에 들어왔어요! (${why})`), 2800);
  return true;
}
function checkSpecials(){
  if(!S.profile || !S.items) return;
  fixItems();
  try{
    if(!isEmpty() && (streakDays() >= 7 || (S.profile.bestStreak||0) >= 7)) grantSpecial('sp_goldcrown', '7일 연속 달성!');
    if(S.dex && (S.dex.doctor || S.items.owned.includes('bg_starry'))) grantSpecial('bg_starry', "도감 8칸 완성! '콩알이 박사'");
    if(S.dex && S.dex.entries.filter(e=>e.perfect).length >= 3) grantSpecial('sp_rainbowcape', '완벽한 여행 3번!');
    if(S.dex && S.dex.entries.some(e=>e.branch==='sparkle')) grantSpecial('sp_sparklights', '반짝 콩알이 여행!');
    // 시험이 끝난 날 처음 열면: 하루 동안 '시험 끝!' 배경
    const h = new Date().getHours(), t = today();
    const done = (S.exams||[]).filter(e=>!e.sample && !S.items.examDone.includes(e.id) && (e.date < t || (e.date === t && h >= 15)) && e.date >= addDays(t,-1));
    if(done.length){
      done.forEach(e=>S.items.examDone.push(e.id));
      delete S.items.special.sp_examdone;
      grantSpecial('sp_examdone', `시험 끝! (${done.map(e=>e.name).join(', ')})`, { until: Date.now() + 24*3600*1000 });
      S.items.wear.bg = 'sp_examdone'; save(KEYS.items, S.items);
      setTimeout(()=>{ if(!isEmpty()) setBubble('시험 끝! 정말 수고했어!'); renderPet(); }, 400);
    }
    const ex = S.items.special.sp_examdone;
    if(ex && ex.until && Date.now() > ex.until && S.items.wear.bg === 'sp_examdone'){ S.items.wear.bg = null; save(KEYS.items, S.items); renderPet(); }
  }catch(e){}
}

document.addEventListener('click', e=>{

  const prev = ()=>`<div class="cp-room">${(TRY && TRY.wear && TRY.wear.bg && decoById(TRY.wear.bg)) ? `<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">${decoById(TRY.wear.bg).art}</svg>` : roomSVG().replace('viewBox="0 0 360 460"','viewBox="0 80 360 300"')}</div><div class="cp-pet">${isEmpty() ? '' : drawKongari(getPetInfo().branch, getPetInfo().stage, 'normal', 170) + wearSVG()}</div>`;

    <p class="hint" style="margin:0">누르면 바로 입혀 봐요 (저장 안 함). 창을 닫으면 원래대로.</p>
    <div class="demo-btns" id="taList">${all.map(it=>`<button type="button" class="ghost sm" data-ta="${it.id}">${esc(it.name)}</button>`).join('')}</div>

<script>
/* =========================================================
   [3] 잠자기·일어나기를 콩알이 방 안에서 (밤하늘 배경 대신 방이 어두워지고 밝아진다)
   ========================================================= */
// 방 그림: 잠(mode 'sleep') · 아침(mode 'wake') 모습, 쿠션·담요는 옆으로 비킬 수 있게 감싼다
const _roomSVG30 = roomSVG;
roomSVG = function(opt){
  opt = opt || {};
  const m = opt.mode;
  let s = _roomSVG30(Object.assign({}, opt, m === 'sleep' ? { hour: 23 } : m === 'wake' ? { hour: 7 } : {}));
  // 쿠션(왼쪽)·담요(오른쪽)를 비킬 수 있게 이름표
  s = s.replace(/<g transform="translate\(58 352\)">/, '<g transform="translate(58 352)"><g class="rm-cush">').replace(/(<g transform="translate\(58 352\)"><g class="rm-cush">[\s\S]*?<\/g>)(<g transform="translate\(294 366\)">)/, '$1</g>$2');
  s = s.replace(/<g transform="translate\(294 366\)">([\s\S]*?)<\/g><\/svg>$/, '<g transform="translate(294 366)"><g class="rm-blank">$1</g></g></svg>');
  if(!m) return s;
  // 스탠드 끄기: 불빛 번짐 지우고 갓은 꺼진 색
  s = s.replace(/<circle cx="326" cy="206" r="\d+" fill="url\(#rmGlowY\)"\/>/, '')
       .replace(/<path d="M308,214 L314,186 L338,186 L344,214 Z" fill="[^"]+"/, `<path d="M308,214 L314,186 L338,186 L344,214 Z" fill="${m==='sleep'?'#8C7A6A':'#EADCC8'}"`)
       .replace(/<path d="M314,214 Q326,224 338,214" fill="none" stroke="#FFE7A6" stroke-width="3" opacity="[^"]+"\/>/, '');
  if(m === 'sleep'){
    // 꼬마전구만 은은하게
    s = s.replace(/(<circle cx="[\d.]+" cy="[\d.]+" r=")11(" fill="[^"]+" opacity=")\.5/g, (m0, a1, a2)=>a1 + '9' + a2 + '.3');
  } else {
    // 아침: 꼬마전구 꺼짐 + 창으로 햇빛이 비스듬히
    s = s.replace(/<circle cx="[\d.]+" cy="[\d.]+" r="8" fill="[^"]+" opacity="\.28"(?: class="room-glow")?\/>/g, '')
         .replace(/(<ellipse(?: class="room-twk"[^>]*)? cx="[\d.]+" cy="[\d.]+" rx="3.4" ry="4.4" fill=")[^"]+"/g, '$1#E6DCD2"');
    const beam = `<path d="M24,206 L94,206 L250,452 L118,452 Z" fill="#FFE9B8" opacity=".42"/><path d="M40,206 L70,206 L196,452 L150,452 Z" fill="#FFF3D2" opacity=".35"/>`;
    s = s.replace(/(<g transform="translate\(180 352\)">)/, beam + '$1');
  }
  return s;
};
let roomMode = null;
function setRoomMode(m){
  const el = $('roomBg'); if(!el) return;
  if(m === roomMode) return;
  roomMode = m;
  el.classList.toggle('aside', !!m);
  const olds = [...el.querySelectorAll('.rm-over')];
  if(!m){ olds.forEach(o=>{ o.classList.remove('on'); setTimeout(()=>o.remove(), 900); }); return; }
  const d = document.createElement('div'); d.className = 'rm-over';
  d.style.transitionDuration = m === 'sleep' ? '.8s' : '1s';
  d.innerHTML = roomSVG({ mode: m });
  el.appendChild(d); void d.offsetWidth; d.classList.add('on');
  setTimeout(()=>olds.forEach(o=>o.remove()), 1100);
}
function wantRoomMode(){
  if(scene === 'sleep') return 'sleep';
  if(scene === 'wake' || (typeof wakeRun !== 'undefined' && wakeRun)) return $('fxLayer').querySelector('.pr-bed') ? 'wake' : null;
  return null;
}
// 방 깔기: 이제 잠자기 중에도 방을 그대로 쓴다 (산 배경이면 그 위에 침대만)
renderRoom = function(force){
  const el = $('roomBg'); if(!el) return;
  const on = !$('app').hidden && !!S.profile;
  const stage = $('petStage');
  stage.classList.toggle('room-big', on);
  stage.classList.toggle('room-sleep', on && !!scene);
  const hasBg = !!(S.items.wear.bg && decoById(S.items.wear.bg)) || !!(TRY && TRY.wear && TRY.wear.bg);
  el.classList.toggle('off', !on || hasBg);
  if(!on || hasBg){ setRoomMode(null); return; }
  if(!el.querySelector('.rm-base')){ el.innerHTML = '<div class="rm-base"></div>'; _roomKey = ''; }
  const r = S.records[today()] || {};
  const key = JSON.stringify([new Date().getHours(), curRoom(), r.water, S.goals && S.goals.water, S.profile && !isEmpty() ? streakDays() : 0, examBooks(), (S.dex.entries||[]).length]);
  if(force || key !== _roomKey){ _roomKey = key; el.querySelector('.rm-base').innerHTML = roomSVG(); }
  setRoomMode(wantRoomMode());
};
// 침대가 생기고 사라질 때마다 방 모습을 맞춘다 (일어나기: 침대가 사라지면 물건 제자리·실제 시각 하늘)
new MutationObserver(()=>setRoomMode(wantRoomMode())).observe($('fxLayer'), { childList:true });
const _playWakeGesture30 = playWakeGesture;
playWakeGesture = function(){ const r = _playWakeGesture30.apply(this, arguments); setRoomMode('wake'); return r; };
const _startSleepScene30 = startSleepScene;
startSleepScene = function(o){ const r = _startSleepScene30.apply(this, arguments); renderRoom(); return r; };
const _clearScene30 = clearScene;
clearScene = function(){ const r = _clearScene30.apply(this, arguments); renderRoom(); return r; };

/* =========================================================
   [1] 눈 깜빡임 — 눈 위치에 몸 색 눈꺼풀을 0.08초 덮고, 감은 동안 ⌒
   ========================================================= */
const BLINK_SCALE = { baby:[.75,.75], child:[.72,.72], teen:[.88,.96], adult:[1,1] };
function blinkSVG(branch, stage){
  const b = KONG_COLOR[branch] ? branch : 'basic', br = stage === 'baby' ? 'basic' : b;
  const [sx, sy] = BLINK_SCALE[stage] || [1,1];
  const ey = (br === 'basic' || br === 'cat') ? 4 : 2;
  const lid = x => br === 'peng' ? '#FFFFFF' : br === 'owl' ? '#F4F0FF' : (br === 'dog' && x > 0) ? '#E8B07E' : KONG_COLOR[br];
  let o = '';
  [-7, 7].forEach(x=>{
    const cx = x * sx, cy = ey * sy;
    o += `<ellipse cx="${cx}" cy="${cy}" rx="${(5.4*sx).toFixed(2)}" ry="${(6.4*sy).toFixed(2)}" fill="${lid(x)}"/>`
       + `<path d="M${(cx-4*sx).toFixed(2)},${(cy+1*sy).toFixed(2)} Q${cx},${(cy-2.6*sy).toFixed(2)} ${(cx+4*sx).toFixed(2)},${(cy+1*sy).toFixed(2)}" fill="none" stroke="#2E2622" stroke-width="1.8" stroke-linecap="round"/>`;
  });
  return `<svg class="blink" viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${o}</svg>`;
}
function mainCanBlink(){
  if($('app').hidden || !S.profile || isEmpty() || reduced()) return null;
  if(scene || (typeof wakeRun !== 'undefined' && wakeRun) || evolvingNow) return null;
  if(drinkFace) return null;                                  // 물 리액션 등 음료 표정 중
  const l = $('petLayer'); if(!l || l.offsetParent === null || l.classList.contains('sleep-hidden')) return null;
  if(l.querySelector('svg.gest') || [...l.classList].some(c=>/^(w-|g-)/.test(c))) return null;   // 일어나기·가만히 동작 중
  const pet = l.querySelector('svg[aria-label="콩알이"]'); if(!pet) return null;
  const info = getPetInfo(); if(info.branch === 'sleepy' && info.stage !== 'baby') return null;
  const mood = (typeof currentMood === 'function') ? currentMood() : 'normal';
  if(['happy','sleepy','dizzy'].includes(mood)) return null;   // 신남·졸림·어지러움 표정
  if($('fxLayer').querySelector('.splash, .sip, [class*="drink"]')) return null;
  return { box: l, after: pet, branch: info.branch, stage: info.stage };
}
function blinkTargets(){
  const t = [], m = mainCanBlink(); if(m) t.push(m);
  if(reduced()) return t;
  // 옷장·입혀 보기 미리보기
  document.querySelectorAll('#sheetRoot .cp-pet').forEach(box=>{
    const pet = box.querySelector('svg[aria-label="콩알이"]'); if(!pet || box.offsetParent === null || isEmpty()) return;
    const i = getPetInfo(); if(i.branch === 'sleepy' && i.stage !== 'baby') return;
    t.push({ box, after: pet, branch: i.branch, stage: i.stage });
  });
  // 도감 (만난 칸만)
  document.querySelectorAll('#sheetRoot .dex-cell[data-dex]:not(.unmet)').forEach(c=>{
    const k = c.dataset.dex; if(k === 'sleepy') return;
    let pet = c.querySelector('svg[aria-label="콩알이"]'); if(!pet || c.offsetParent === null) return;
    let box = pet.parentElement;
    if(!box.classList.contains('dex-photo')){ const w = document.createElement('span'); w.className = 'dex-photo'; pet.replaceWith(w); w.appendChild(pet); box = w; }
    t.push({ box, after: pet, branch: k, stage: 'adult' });
  });
  return t;
}
function blinkOnce(targets){
  targets.forEach(x=>{ x.after.insertAdjacentHTML('afterend', blinkSVG(x.branch, x.stage)); });
  setTimeout(()=>targets.forEach(x=>x.box.querySelectorAll('svg.blink').forEach(e=>e.remove())), 80);
}
let _blinkN = 0;
(function blinkLoop(){
  setTimeout(()=>{
    try{
      if(!document.hidden){
        const t = blinkTargets();
        if(t.length){
          _blinkN++;
          blinkOnce(t);
          if(_blinkN % 5 === 0) setTimeout(()=>{ const t2 = blinkTargets(); if(t2.length) blinkOnce(t2); }, 200);   // 다섯 번에 한 번은 두 번 연속
        }
      }
    }catch(e){}
    blinkLoop();
  }, 1600 + Math.random() * 1000);
})();

if(!$('app').hidden){ renderRoom(true); }

<script>

    <rect x="92" y="118" width="12" height="54" rx="5" fill="${BW}" stroke="${BL}" stroke-width="2"/><circle cx="98" cy="118" r="4" fill="${BW}" stroke="${BL}" stroke-width="2"/>

function placePet(p){ const l = $('petLayer'), [x,y] = poseXY(p); l.getAnimations && l.getAnimations().forEach(a=>{ if(a.id === 'bedmove') a.cancel(); }); l.style.transition = ''; l.style.translate = (x||y) ? `${x}px ${y}px` : ''; bedPose = p; }

    const a = l.animate([{ translate:`${x0}px ${y0}px` }, { translate:`${x1}px ${y1}px` }], { duration:ms, easing:'linear', fill:'forwards', id:'bedmove' });

function hopTo(p, ms){

  }catch(e){ l.style.translate = (x1||y1) ? `${x1}px ${y1}px` : ''; }

}
/* 어두운 막 */
function veil(on, ms){

/* 방 모습(창밖·스탠드·꼬마전구) */
wantRoomMode = function(){ return bedRoomMode; };

// 아침 햇빛은 침대 쪽(창 바로 아래)으로 비스듬히
const _roomSVG31 = roomSVG;
roomSVG = function(opt){
  let s = _roomSVG31(opt);
  s = s.replace('<g transform="translate(58 352)">', '<g transform="translate(244 404)">');   // 쿠션은 침대 앞을 비켜 오른쪽 아래로
  if(opt && opt.mode === 'wake') s = s.replace('<path d="M24,206 L94,206 L250,452 L118,452 Z" fill="#FFE9B8" opacity=".42"/><path d="M40,206 L70,206 L196,452 L150,452 Z" fill="#FFF3D2" opacity=".35"/>',

};
_roomKey = '';

}

/* 바로 잠든 모습 (새로 고침·움직임 줄이기) */

  bedClear(); placePet('bed'); inBed(true); petWrap().classList.remove('quilt-off'); zz(true); bedFace();
  veil(true, 0); roomTo('sleep');
}
/* 바로 평소 모습 */
function snapHome(){

  veil(false, reduced() ? 0 : 600); roomTo(null);
}

/* ── 잠자기: ① 하품 0.5 → ② 침대로 뒤뚱뒤뚱 1 → ③ 폴짝 올라가 눕고 이불 0.5 → ④ 방이 어두워짐 0.8 ── */
const _startSleepScene31 = startSleepScene;
startSleepScene = function(opts){
  opts = opts || {};
  const r = _startSleepScene31.call(this, Object.assign({}, opts, { instant:true }));   // 예전 밤하늘·침대 장면은 쓰지 않는다
  if(scene !== 'sleep') return r;
  if(opts.instant){ snapAsleep(); return r; }
  bedClear();
  const calm = reduced();
  setBubble('하암…'); if(!calm) petAnim('yawn', 500);
  bedT(calm ? 0 : 500, ()=>{ if(scene !== 'sleep') return; setBubble('침대로 가자…'); walkTo('side', 1000); });
  bedT(calm ? 300 : 1500, ()=>{ if(scene !== 'sleep') return; hopTo('bed', 500); });
  bedT(calm ? 350 : 1750, ()=>{ if(scene !== 'sleep') return; bedFace(); inBed(true); });
  bedT(calm ? 400 : 2000, ()=>{ if(scene !== 'sleep') return; veil(true, 800); roomTo('sleep'); zz(true); setBubble(sleepText()); });

};
// 자는 동안 다른 곳에서 펫을 다시 그려도 침대에 누운 얼굴 그대로
const _renderPet31 = renderPet;
renderPet = function(){
  const r = _renderPet31.apply(this, arguments);
  const w = petWrap();
  if(bedPose === 'bed' && w.classList.contains('in-bed') && !w.classList.contains('quilt-off') && (scene === 'sleep' || wakeRun)) bedFace();

};
// 장면이 끝나면(잠 취소·개운함 고른 뒤) 평소 자리로
const _clearScene31 = clearScene;
clearScene = function(){ const r = _clearScene31.apply(this, arguments); if(!wakeRun && bedPose !== 'home') snapHome(); else if(!wakeRun){ veil(false, 600); if(bedRoomMode) roomTo(null); } return r; };

/* ── 일어나기 ①~⑥ ── */
playWakeGesture = function(branch, stage){
  if(!stage){ const i = getPetInfo(); branch = i.branch; stage = i.stage; }
  const G = geomFor(branch, stage), l = $('petLayer'), st = G.state, calm = reduced();
  const r = S.records[today()], sm = r ? sleepMinutes(r) : null, enough = sm != null && sm >= S.goals.sleepMin;
  const setCls = c => { W_CLASSES.forEach(x=>l.classList.remove(x)); l.classList.remove('breathe','wobble'); if(c && !calm){ void l.offsetWidth; l.classList.add(c); } };
  const overlay = inner => { l.querySelectorAll('svg.gest').forEach(x=>x.remove()); if(inner) l.insertAdjacentHTML('beforeend', wrapG(G, inner)); };
  const backOverlay = inner => { $('fxBack').querySelectorAll('svg.gest-back').forEach(x=>x.remove()); if(inner) $('fxBack').insertAdjacentHTML('beforeend', wrapG(G, inner, 'gest-back')); };
  const hands = on => hideUses('kh', on);
  const awake = () => { l.innerHTML = drawKongari(branch, stage, st, 200) + wearSVG(); };
  bedClear();
  // 침대에 없으면(시연 단추 등) 먼저 누운 모습으로
  if(bedPose !== 'bed'){ placePet('bed'); inBed(true); bedFace(); veil(true, 0); roomTo('sleep'); }
  zz(false);
  const D = calm ? { a:300, b:300, c:300, d:300, e:300 } : { a:1000, b:800, c:800, d:500, e:1000 };
  const doze = !enough ? (calm ? 300 : 900) : 0;
  const t1 = D.a, t2 = t1 + D.b, t3 = t2 + D.c + doze, t4 = t3 + D.d, t5 = t4 + D.e;

  // ① 창밖 아침 하늘 + 햇빛이 침대 쪽으로, 어두운 막이 걷힌다 (1초)
  roomTo('wake'); veil(false, calm ? 0 : 1000); bedFace(); setBubble('쿨쿨…');

  WT(t1, ()=>{
    awake(); petWrap().classList.add('quilt-off');
    let o = eyeClosed(G, -7);
    if(G.hands){ hands(true); o += calm ? handAt(G,-22,11,13,G.ey-10) + handAt(G,22,11,0,0)

    overlay(o); setBubble('으음… (눈 비비는 중)');
  });
  // ③ 침대 위에서 기지개 + 하품 (0.8초) — 모자라게 잤으면 꾸벅 졸다가 고개를 흔들며 깬다
  WT(t2, ()=>{
    if(st === 'dirty'){ hands(false); setCls('w-droop'); overlay(eyeClosed(G,-7) + eyeClosed(G,7)); setBubble('음… 더 자고 싶어…'); }

  // ④ 침대에서 폴짝 내려와 이불을 갠다 (0.5초)
  WT(t3, ()=>{
    hands(false); overlay(''); setCls(null);

    setBubble('이불 개기 끝!');
  });
  // ⑤ 방 가운데로 뒤뚱뒤뚱 걸어 돌아온다 (1초) — 창밖은 실제 시각 하늘로

function greetNow(G, calm, setCls, overlay, backOverlay, hands, enough){

const _finishWakeRun31 = finishWakeRun;
finishWakeRun = function(skipped){
  if(!wakeRun) return;
  if(skipped && !wakeRun.toGreet){
    wakeRun.timers.forEach(clearTimeout); wakeRun.timers = []; wakeRun.toGreet = true;
    const l = $('petLayer'), i = getPetInfo(), G = geomFor(i.branch, i.stage), calm = reduced();

    hideUses('kh', false);
    snapHome(); l.innerHTML = drawKongari(i.branch, i.stage, G.state, 200) + wearSVG();
    const setCls = c => { W_CLASSES.forEach(x=>l.classList.remove(x)); if(c && !calm){ void l.offsetWidth; l.classList.add(c); } };
    const overlay = inner => { l.querySelectorAll('svg.gest').forEach(x=>x.remove()); if(inner) l.insertAdjacentHTML('beforeend', wrapG(G, inner)); };
    const backOverlay = inner => { $('fxBack').querySelectorAll('svg.gest-back').forEach(x=>x.remove()); if(inner) $('fxBack').insertAdjacentHTML('beforeend', wrapG(G, inner, 'gest-back')); };
    const r = S.records[today()], sm = r ? sleepMinutes(r) : null;
    greetNow(G, calm, setCls, overlay, backOverlay, on=>hideUses('kh', on), sm != null && sm >= S.goals.sleepMin);
    WT(calm ? 600 : 1400, ()=>_finishWakeRun31(false));

// 화면 크기가 바뀌면 침대 빛 자리 다시

<script>

const PET_S = 1;                            // 펫 화면 배율 (CSS와 같은 값 · 확대 없음)
const PET_HALF = 55;                        // 콩알이 반쪽 폭(손 포함, 펫 좌표 px)
let BG = { L:-30, bw:70, bh:56, BB:132, top:76 };
function bedGeom(){
  const stage = $('petStage'), W = stage ? stage.clientWidth : 343;

  // 콩알이 왼쪽 끝: 손·수염·귀까지 실제 그림 폭으로 잰다 (없으면 손 기준)

}
// 침대 그림 (앞에서 본 모습, 0~100 × 0~80)
function bedArt(){

    <rect x="14" y="10" width="72" height="40" rx="6" fill="#E3BC8E" opacity=".6"/>

// 자리: home(러그 가운데, 100%) · side(침대 앞, 75%) · bed/sit(베개에 머리를 대고, 75%)
function poseOf(p){
  const g = BG;

  if(p === 'bed' || p === 'sit'){ const cx = g.L + g.bw/2, cy = g.top + g.bh*0.4; return { x: cx - 100, y: cy - (209 - 99*k), s: k }; }

};
hopTo = function(p, ms){
  const l = $('petLayer'), a0 = poseOf(bedPose), a1 = poseOf(p);
  if(reduced()){ placePet(p); return; }
  try{
    const mid = { x:(a0.x + a1.x)/2, y:Math.min(a0.y, a1.y) - 24, s:a1.s };
    const a = l.animate([{ translate:_tr(a0), scale:`${a0.s}` }, { translate:_tr(mid), scale:`${a0.s}`, offset:.45 }, { translate:_tr(a1), scale:`${a1.s}` }], { duration:ms, easing:'ease-out', fill:'forwards', id:'bedmove' });

// 쿠션은 러그 오른쪽 가장자리로, 민트 담요는 그 바깥으로 · 잘 때는 커튼이 닫힌다
const _roomSVG32 = roomSVG;
roomSVG = function(opt){
  let s = _roomSVG32(opt);

  if(opt && opt.mode === 'sleep'){
    const cur = `<path d="M10,86 Q34,88 58,86 L58,208 Q34,212 10,208 Z" fill="#E9A7B6" stroke="${BL}" stroke-width="1.6"/><path d="M106,86 Q82,88 58,86 L58,208 Q82,212 106,208 Z" fill="#E9A7B6" stroke="${BL}" stroke-width="1.6"/><path d="M24,92 Q27,150 22,204 M40,92 Q37,150 42,204 M76,92 Q79,150 74,204 M92,92 Q89,150 94,204" fill="none" stroke="#D88C9D" stroke-width="1.4"/>`;

const _renderRoom32 = renderRoom;

_roomKey = '';
layoutBed();

/* =========================================================
   콩알이가 더 자주 살아 움직이게 — 덮어 그리기 (그림 함수는 그대로)
   눈동자 1~2초 · 입 2~3초 · 귀/더듬이/머리카락 3~5초 · 랜덤 표정 2~4초(0.8~1.2초 동안)

const FX = { dx:0, dy:0, mouth:'w', expr:null, exprUntil:0, lastExpr:null, ear:0,
  tPupil:0, tMouth:0, tEar:0, tExpr:0, lookUntil:0, taps:[] };
const rnd = (a, b) => a + Math.random() * (b - a);
const now = () => Date.now();
// 갈래별 좋아하는 표정 (3배 더 자주)
const FAV_EXPR = { basic:'happy', cat:'wink', dog:'tongue', peng:'proud', ham:'proud', owl:'tilt', sleepy:'yawnf', sparkle:'happy' };
const EXPRS = ['happy','wink','tongue','tilt','proud','yawnf'];
function faceAllowed(){
  if($('app').hidden || $('scr-pet').hidden || !S.profile || isEmpty() || document.hidden) return false;
  if(scene || (typeof wakeRun !== 'undefined' && wakeRun) || evolvingNow || sleepState() || bedPose !== 'home') return false;
  if(gestNow || drinkFace) return false;                                   // 가만히 있을 때 동작·음료 리액션
  const l = $('petLayer'); if(!l || !petSvg()) return false;
  if(REACTION_CLASSES.some(c=>c !== 'wobble' && l.classList.contains(c)) || $('fxLayer').innerHTML.trim()) return false;

}
function faceSVG(){
  const G = geom(), m = currentMood(), canMouth = canMouthOf(G) && G.br !== 'dog';   // 멍 귀는 코·무늬가 입 자리에 있어 덮지 않는다
  const eyesOK = !['happy','sleepy','dizzy'].includes(m), mouthOK = canMouth && ['normal','darkcircle'].includes(m);

  const cover = x => eyeCover(G, x);
  const eyeAt = (x, dx, dy) => cover(x) + `<ellipse cx="${x+dx}" cy="${ey+dy}" rx="4" ry="5" fill="${ink}"/><circle cx="${x+1.2+dx}" cy="${ey-2+dy}" r="1.7" fill="#fff"/><circle cx="${x-1.6+dx}" cy="${ey+2.3+dy}" r=".9" fill="#fff"/>`;
  const arcUp = x => cover(x) + L(`M${x-4},${ey+1} Q${x},${ey-4} ${x+4},${ey+1}`, 2);
  const arcDown = x => cover(x) + L(`M${x-4},${ey} Q${x},${ey+3.2} ${x+4},${ey}`, 2);
  const mCover = () => canMouth ? `<ellipse cx="0" cy="${my+1.8}" rx="5.8" ry="5" fill="${G.color}"/>` : '';   // 단계 입(활짝 웃는 입 포함)까지 1px 넉넉하게

  const e = FX.expr;
  if(e){
    if(e === 'happy'){ o += arcUp(-7) + arcUp(7); if(canMouth) o += mCover() + `<path d="M-4,${my-1} Q0,${my+5} 4,${my-1} Z" fill="#FF8FA8" stroke="${ink}" stroke-width="1.4" stroke-linejoin="round"/>`; }
    else if(e === 'wink'){ o += arcUp(7) + `<path d="${star4(17,ey-8,3.2)}" fill="#FFE07A" stroke="${GI}" stroke-width=".7"/>`; if(canMouth) o += mCover() + L(`M-3,${my} Q0,${my+2.6} 3,${my}`, 1.5); }
    else if(e === 'tongue'){ o += eyeSqueeze(G, -7); if(canMouth) o += mCover() + L(`M-3.5,${my} Q0,${my+2} 3.5,${my}`, 1.5) + `<path d="M-1.8,${my+1} Q-1.8,${my+5} 0,${my+5} Q1.8,${my+5} 1.8,${my+1} Z" fill="#FF8FA8" stroke="${ink}" stroke-width="1"/>`; }

    else if(e === 'love'){ o += arcUp(-7) + arcUp(7); if(canMouth) o += mCover() + `<path d="M-4,${my-1} Q0,${my+5} 4,${my-1} Z" fill="#FF8FA8" stroke="${ink}" stroke-width="1.4" stroke-linejoin="round"/>`;
      o += [[20,-26,0],[28,-34,.25],[14,-36,.5]].map(([x,y,b])=>`<path d="${heart(x,y)}" fill="#FF8FA8" stroke="${GI}" stroke-width=".7" opacity="0">${AN('opacity','0;1;0',0.9,1,b)}${AT('translate','0 0;0 -7',0.9,1,b)}</path>`).join(''); }

function paintFace(){

}
function plainFace(){
  const l = $('petLayer'), pet = petSvg(); if(!pet || isEmpty() || !S.profile) return;

  const l = $('petLayer');

  l.classList.remove('fx-tilt','fx-proud');
  if(!reduced()){ if(e === 'tilt'){ void l.offsetWidth; l.classList.add('fx-tilt'); } if(e === 'proud'){ void l.offsetWidth; l.classList.add('fx-proud'); } }
  paintFace();
}
function pickExpr(){
  const fav = FAV_EXPR[geom().br] || 'happy', G = geom();
  let pool = EXPRS.filter(x=>x !== FX.lastExpr && !(x === 'tongue' && !canMouthOf(G)));
  const bag = []; pool.forEach(x=>{ bag.push(x); if(x === fav){ bag.push(x, x); } });   // 좋아하는 표정은 3배
  return bag[Math.floor(Math.random()*bag.length)];
}
function faceTick(){
  const t = now();
  if(FX.expr && (t >= FX.exprUntil || drinkFace || (!FX.touch && !faceAllowed()))){
    FX.lastExpr = FX.expr; FX.expr = null; FX.touch = false; $('petLayer').classList.remove('fx-tilt','fx-proud'); FX.tExpr = t + rnd(2000, 4000);

  }

  if(FX.ear && t > FX.ear && FX.earShown){ FX.earShown = false; dirty = true; }
  if(FX.ear > t) FX.earShown = true;

setInterval(faceTick, 120);
// 다시 그려져도 얼굴 층을 다시 얹는다
const _renderPet32 = renderPet;
renderPet = function(){ const r = _renderPet32.apply(this, arguments); paintFace(); return r; };
// 깜빡임은 지금처럼 (표정 중에는 쉬고, 얼굴 층 위에 눈꺼풀을 덮는다)
const _mainCanBlink32 = mainCanBlink;
mainCanBlink = function(){
  if(FX.expr) return null;
  const r = _mainCanBlink32(); if(!r) return r;
  const f = $('petLayer').querySelector('svg.face'); if(f) r.after = f;
  return r;
};
// 가끔 화면을 누른 곳 쪽을 바라본다
document.addEventListener('pointerdown', e=>{
  if(reduced() || !faceAllowed() || Math.random() < 0.5) return;

// 만졌을 때: 바로 신남 또는 윙크 + 하트, 연속으로 누르면 ><
$('petLayer').addEventListener('click', ()=>{
  if(reduced() || scene || bedPose !== 'home' || (typeof wakeRun !== 'undefined' && wakeRun) || isEmpty() || !S.profile) return;
  const t = now(); FX.taps = FX.taps.filter(x=>t - x < 1200); FX.taps.push(t);
  if(FX.taps.length >= 2) startExpr('squeeze', 1000, true);
  else startExpr(Math.random() < 0.5 ? 'love' : 'winklove', 1000, true);
  FX.tExpr = t + 1000 + rnd(2000, 4000);
});

if(!$('app').hidden){ renderRoom(true); renderPet(); }

<script>
/* =========================================================
   침대 그림 세 장 — BED_IDLE(평소, 이불 갬) · BED_BACK(누울 때 뒤판) · BED_FRONT(덮는 이불)
   좌표 0~100 정사각형. 받은 그림이 있으면 이 세 값만 바꾸면 된다. 얼굴 중심 = (48, 54)
   ========================================================= */
const BED_IDLE = `<svg viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg"><ellipse cx="100" cy="86" rx="92" ry="5" fill="#000" opacity=".13"/><rect x="6" y="22" width="16" height="64" rx="7" fill="#C99A6E" stroke="#5A4A42" stroke-width="2"/><rect x="180" y="48" width="12" height="38" rx="5" fill="#C99A6E" stroke="#5A4A42" stroke-width="2"/><rect x="16" y="50" width="170" height="22" rx="8" fill="#FFF6E6" stroke="#5A4A42" stroke-width="2"/><rect x="18" y="70" width="166" height="9" rx="3" fill="#B8875E" stroke="#5A4A42" stroke-width="2"/><ellipse cx="42" cy="46" rx="22" ry="9" fill="#FFFFFF" stroke="#5A4A42" stroke-width="2"/><path d="M78,44 Q130,38 182,44 L182,62 Q184,74 176,78 L176,64 Q130,70 82,64 L82,74 Q74,70 76,58 Z" fill="#A8D8FF" stroke="#5A4A42" stroke-width="2" stroke-linejoin="round"/><path d="M80,44 Q130,39 182,45" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/><path d="M106,42 L106,68 M130,41 L130,69 M154,41 L154,68" stroke="#fff" stroke-width="5" opacity=".55"/></svg>`;
const BED_BACK = `<svg viewBox="0 0 170 120" xmlns="http://www.w3.org/2000/svg"><ellipse cx="88" cy="114" rx="78" ry="5" fill="#000" opacity=".15"/><rect x="6" y="18" width="18" height="96" rx="8" fill="#C99A6E" stroke="#5A4A42" stroke-width="2"/><rect x="150" y="56" width="14" height="58" rx="6" fill="#C99A6E" stroke="#5A4A42" stroke-width="2"/><rect x="18" y="66" width="140" height="34" rx="10" fill="#FFF6E6" stroke="#5A4A42" stroke-width="2"/><rect x="20" y="96" width="136" height="12" rx="4" fill="#B8875E" stroke="#5A4A42" stroke-width="2"/><ellipse cx="46" cy="62" rx="26" ry="12" fill="#FFFFFF" stroke="#5A4A42" stroke-width="2"/></svg>`;
const BED_FRONT = `<svg viewBox="0 0 170 120" xmlns="http://www.w3.org/2000/svg"><path d="M28,64 Q70,55 152,63 L152,98 Q100,106 26,98 Q20,80 28,64 Z" fill="#A8D8FF" stroke="#5A4A42" stroke-width="2" stroke-linejoin="round"/><path d="M30,64 Q70,56 152,64" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".9"/><path d="M78,60 L76,102 M104,60 L103,104 M130,61 L129,102" stroke="#FFFFFF" stroke-width="6" opacity=".55"/></svg>`;
const BED_FACE = { x:46, y:52 };          // BED_BACK 좌표 (170×120) — 머리는 베개 위
const BED_HANDS = [[40,64],[56,63]];        // 이불 윗선 위에 내놓은 두 손
const svgInner = x => x.replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '');

/* ── 자리 잡기: 화면(무대) 좌표 ↔ 펫 좌표 ── */
let BZ = null;   // 지금 침대·줌 계산값
function stageBox(){ const st = $('petStage'); return { W: st.clientWidth, H: st.clientHeight }; }
function wrapBox(){ const w = petWrap(); return { Lw: w.offsetLeft, Tw: w.offsetTop }; }
const toWrapX = (sx, wb) => 100 + (sx - wb.Lw - 100) / PET_S;
const toWrapY = (sy, wb) => 220 + (sy - wb.Tw - 220) / PET_S;
const toScrX = (ux, wb) => wb.Lw + 100 + PET_S * (ux - 100);
const toScrY = (uy, wb) => wb.Tw + 220 + PET_S * (uy - 220);
function petLeftScreen(wb){
  // 콩알이 그림의 실제 왼쪽 끝(손·수염·귀 포함)
  let half = (BZ && BZ.half) || PET_HALF;
  try{ const g = petSvg() && petSvg().querySelector(':scope > g'); if(g && bedPose === 'home'){ const b = g.getBBox(); if(b.width) half = Math.max(PET_HALF, -b.x * 2 + 2); } }catch(e){}
  return { x: toScrX(100 - half, wb), half };
}
layoutBed = function(){
  const st = $('petStage'); if(!st || $('app').hidden) return;
  if(st.classList.contains('zoomed')) return;              // 줌 중에는 자리를 다시 재지 않는다
  const { W } = stageBox(), wb = wrapBox();
  // 방 그림은 콩알이 발밑(무대 아래 여백 14px)까지만 — 아래에 창이 끼어들어도 방이 커지지 않게
  const H = stageBox().H;   // 방 그림은 펫 방 전체 높이에 맞춘다 (아래 기준)
  ['roomBg','decoBg'].forEach(id=>{ const e = $(id); if(e) e.style.bottom = ''; });
  const pl = petLeftScreen(wb);
  // 방 그림(360×460, 아래 맞춤)의 벽-바닥 선
  const s = H/460, offY = 0, floorY = offY + 300*s;   // 높이에 맞춰 그리고 양옆은 벽·바닥을 늘인다
  // 평소 침대(BED_IDLE 200×90): 화면 폭의 약 28%, 왼쪽 여백 12px, 콩알이와 6px 띄운다
  const left = 12, iw = Math.max(64, Math.min(W*0.28*1.4, pl.x - 6 - left)), ih = iw * 90/200;   // 침대 1.4배 (콩알이와는 6px 띄움)
  const bottomS = floorY + ih*0.14, itop = bottomS - ih;
  // 잘 때 침대(BED_BACK/FRONT 170×120): 틀 폭을 평소 침대 틀에 맞추고 바닥선을 같게
  const bwS = iw * (186/200) * (170/158), bhS = bwS * 120/170;
  const bx = left + iw*6/200 - bwS*6/170, by = bottomS - bhS;
  const W2 = v => v / PET_S;
  BZ = { W, H, wb, left, bottomS, half: pl.half, pctW: iw / W,
    idle: { L: toWrapX(left, wb), T: toWrapY(itop, wb), w: W2(iw), h: W2(ih) },
    back: { L: toWrapX(bx, wb), T: toWrapY(by, wb), w: W2(bwS), h: W2(bhS) },
    backS: { x: bx, y: by, w: bwS, h: bhS } };
  setBedArt();
  if(bedPose !== 'home' && !wakeRun && !_bedT.length) placePet(bedPose);
};
function setBedArt(){
  const b = $('bedBack'), f = $('bedFront'); if(!b || !f) return;
  const w = petWrap(), sleeping = w.classList.contains('in-bed') || w.classList.contains('quilt-off');
  const want = sleeping ? 'back' : 'idle';
  if(b.dataset.art !== want){
    b.innerHTML = svgInner(want === 'idle' ? BED_IDLE : BED_BACK);
    b.setAttribute('viewBox', want === 'idle' ? '0 0 200 90' : '0 0 170 120'); b.dataset.art = want;
  }
  const hc = (()=>{ try{ const i = getPetInfo(); return KONG_COLOR[i.stage === 'baby' ? 'basic' : i.branch] || KONG_COLOR.basic; }catch(e){ return KONG_COLOR.basic; } })();
  if(f.dataset.art !== 'front3' + hc){
    f.innerHTML = `<g class="bed-breath">${svgInner(BED_FRONT)}${BED_HANDS.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5.2" fill="${hc}" stroke="#5A4A42" stroke-width="1.8"/>`).join('')}</g>` + `<g class="bed-z">${[['Z',72,40,15,0],['z',84,28,11,1],['z',94,18,9,2]].map(([t,x,y,sz,i])=>`<text class="fx-a zzz" style="animation-delay:${i*.9}s" x="${x}" y="${y}" font-family="Jua, sans-serif" font-size="${sz}" fill="#FFF6D8" stroke="#5A4A42" stroke-width=".7">${t}</text>`).join('')}</g>`;
    f.setAttribute('viewBox', '0 0 170 120'); f.dataset.art = 'front3' + hc;
  }
  if(BZ){
    const bb = want === 'idle' ? BZ.idle : BZ.back;
    Object.assign(b.style, { left:`${bb.L}px`, top:`${bb.T}px`, width:`${bb.w}px`, height:`${bb.h}px` });
    Object.assign(f.style, { left:`${BZ.back.L}px`, top:`${BZ.back.T}px`, width:`${BZ.back.w}px`, height:`${BZ.back.h}px` });
  }
}
new MutationObserver(setBedArt).observe(petWrap(), { attributes:true, attributeFilter:['class'] });
// 자리: home(러그 가운데, 원래 크기) · side(침대 앞, 침대 크기) · bed(베개에 머리, 얼굴 중심 = BED_BACK (48,54))
function bedScale(){ return BZ ? Math.min(.75, (BZ.back.w * 0.35) / 92) : .4; }   // 침대 폭의 약 35%
poseOf = function(p){
  if(!BZ) return { x:0, y:0, s:1 };
  const k = bedScale(), B = BZ.back;
  if(p === 'bed' || p === 'sit'){
    const fx = B.L + B.w * BED_FACE.x/170, fy = B.T + B.h * BED_FACE.y/120;
    return { x: fx - 100, y: fy - 8*k - (209 - 99*k), s: k };
  }
  if(p === 'side'){ const fx = B.L + B.w*0.8, fy = toWrapY(BZ.bottomS, BZ.wb) + 4; return { x: fx - 100, y: fy - (209 - 47*k), s: k }; }
  return { x:0, y:0, s:1 };
};

/* ── 줌: 방 묶음(방 배경·산 배경·침대+콩알이)에 scale + 침대 중심 기준. 말풍선·띠·단추는 그대로 ── */
function zoomTo(on, instant){
  const st = $('petStage'), els = [$('roomBg'), $('decoBg')], w = petWrap();
  if(instant || reduced()){ st.classList.add('zoom-now'); }
  if(!on){
    els.forEach(e=>{ if(e){ e.style.scale = ''; e.style.translate = ''; } });
    w.style.scale = ''; w.style.translate = '';
    st.classList.remove('zoomed');
  } else {
    if(!BZ) layoutBed();
    const { W, H } = stageBox(), wb = wrapBox();
    const B = BZ.backS, z = (W * 0.8) / B.w;                 // 잘 때 침대(BED_BACK)가 화면 폭의 약 80%
    const P = { x: B.x + B.w/2, y: B.y + B.h/2 };
    const Q = { x: W/2, y: Math.min(H*0.6, H - B.h*z*0.5 - 14) };
    els.forEach(e=>{ if(!e) return; e.style.transformOrigin = `${P.x}px ${P.y}px`; e.style.scale = `${z}`; e.style.translate = `${(Q.x-P.x).toFixed(1)}px ${(Q.y-P.y).toFixed(1)}px`; });
    const O = { x: wb.Lw + 100, y: wb.Tw + 220 };
    const t = { x: (Q.x - P.x) + (z - 1)*(O.x - P.x), y: (Q.y - P.y) + (z - 1)*(O.y - P.y) };
    w.style.scale = `${z}`; w.style.translate = `${t.x.toFixed(1)}px ${t.y.toFixed(1)}px`;
    st.classList.add('zoomed');
  }
  if(instant || reduced()){ void st.offsetWidth; requestAnimationFrame(()=>st.classList.remove('zoom-now')); }
}
// 어두운 막의 따뜻한 빛도 확대된 침대 자리에
const _veil33 = veil;
veil = function(on, ms){ _veil33(on, ms); setTimeout(()=>{ if($('sleepVeil').classList.contains('on')) _veil33(true, 0); }, 950); };

/* ── 바로 잠든 모습 / 바로 평소 모습 ── */
snapAsleep = function(){
  bedClear(); layoutBed(); placePet('bed'); inBed(true); petWrap().classList.remove('quilt-off'); zz(true); bedFace();
  zoomTo(true, true); veil(true, 0); roomTo('sleep');
};
snapHome = function(){
  bedClear(); zoomTo(false, true); placePet('home'); inBed(false); zz(false); petWrap().classList.remove('quilt-off');
  veil(false, reduced() ? 0 : 600); roomTo(null); layoutBed();
};

/* ── [지금 잔다] ① 하품 0.5 → ② 침대로 뒤뚱뒤뚱, 침대 크기로 작아짐 1 → ③ 올라가 눕고 이불 0.4 → ④ 줌인 0.9 → ⑤ 커튼·어두워짐 ── */
startSleepScene = function(opts){
  opts = opts || {};
  const r = _startSleepScene31.call(this, Object.assign({}, opts, { instant:true }));
  if(scene !== 'sleep') return r;
  if(opts.instant){ snapAsleep(); return r; }
  bedClear(); layoutBed();
  const calm = reduced();
  if(calm){ placePet('bed'); bedFace(); inBed(true); zoomTo(true, true); veil(true, 0); roomTo('sleep'); zz(true); setBubble(sleepText()); return r; }
  setBubble('하암…'); petAnim('yawn', 500);
  bedT(500, ()=>{ if(scene !== 'sleep') return; setBubble('침대로 가자…'); walkTo('side', 1000); });
  bedT(1500, ()=>{ if(scene !== 'sleep') return; hopTo('bed', 400); });
  bedT(1700, ()=>{ if(scene !== 'sleep') return; bedFace(); inBed(true); });
  bedT(1900, ()=>{ if(scene !== 'sleep') return; zoomTo(true); });
  bedT(2800, ()=>{ if(scene !== 'sleep') return; veil(true, 800); roomTo('sleep'); zz(true); setBubble(sleepText()); });
  return r;
};

/* ── [지금 일어났다] ① 커튼 열림·밝아짐 → ② 줌인 상태에서 눈 비비기·이불 걷고 앉기·기지개 → ③ 줌아웃 0.9 → ④ 내려와 이불 개고, 러그로 걸어오며 커짐 1 → ⑤ 인사·개운함 ── */
playWakeGesture = function(branch, stage){
  if(!stage){ const i = getPetInfo(); branch = i.branch; stage = i.stage; }
  const G = geomFor(branch, stage), l = $('petLayer'), st = G.state, calm = reduced();
  const rec = S.records[today()], sm = rec ? sleepMinutes(rec) : null, enough = sm != null && sm >= S.goals.sleepMin;
  const setCls = c => { W_CLASSES.forEach(x=>l.classList.remove(x)); l.classList.remove('breathe','wobble'); if(c && !calm){ void l.offsetWidth; l.classList.add(c); } };
  const overlay = inner => { l.querySelectorAll('svg.gest').forEach(x=>x.remove()); if(inner) l.insertAdjacentHTML('beforeend', wrapG(G, inner)); };
  const backOverlay = inner => { $('fxBack').querySelectorAll('svg.gest-back').forEach(x=>x.remove()); if(inner) $('fxBack').insertAdjacentHTML('beforeend', wrapG(G, inner, 'gest-back')); };
  const hands = on => hideUses('kh', on);
  bedClear();
  if(bedPose !== 'bed' || !$('petStage').classList.contains('zoomed')){ layoutBed(); placePet('bed'); inBed(true); bedFace(); zoomTo(true, true); veil(true, 0); roomTo('sleep'); }
  zz(false);
  const D = calm ? { a:300, b:300, c:300, z:0, d:300, e:300 } : { a:1000, b:800, c:800, z:900, d:500, e:1000 };
  const doze = !enough ? (calm ? 300 : 900) : 0;
  const t1 = D.a, t2 = t1 + D.b, t3 = t2 + D.c + doze, t4 = t3 + D.z, t5 = t4 + D.d, t6 = t5 + D.e;
  // ① 커튼이 열리고 시각에 맞게 밝아진다
  roomTo('wake'); veil(false, calm ? 0 : 1000); bedFace(); setBubble('쿨쿨…');
  // ② 줌인 상태에서: 눈 비비며 이불 걷고 앉기 → 기지개 (모자라게 잤으면 꾸벅 졸다가 고개 흔들기)
  WT(t1, ()=>{
    l.innerHTML = drawKongari(branch, stage, st, 200) + wearSVG(); petWrap().classList.add('quilt-off');
    let o = eyeClosed(G, -7);
    if(G.hands){ hands(true); o += calm ? handAt(G,-22,11,13,G.ey-10) + handAt(G,22,11,0,0) : handEl(G,-22,11, AT('translate',`0 0;13 ${G.ey-10};15 ${G.ey-11};11 ${G.ey-9};15 ${G.ey-11};13 ${G.ey-10}`,0.8)) + handEl(G,22,11); }
    else setCls('w-wriggle');
    overlay(o); setBubble('으음… (눈 비비는 중)');
  });
  WT(t2, ()=>{
    if(st === 'dirty'){ hands(false); setCls('w-droop'); overlay(eyeClosed(G,-7) + eyeClosed(G,7)); setBubble('음… 더 자고 싶어…'); }
    else {
      setCls('w-stretch');
      let o = eyeSqueeze(G,-7) + eyeSqueeze(G,7) + yawnMouth(G) + stretchLines;
      if(G.hands){ hands(true); o += calm ? handAt(G,-22,11,5,-38) + handAt(G,22,11,-5,-38) : handEl(G,-22,11, AT('translate','0 0;5 -38',0.3)) + handEl(G,22,11, AT('translate','0 0;-5 -38',0.3)); }
      else hands(false);
      overlay(o); setBubble(st === 'jitter' ? '잠을 제대로 못 잤어…' : '하아암~ 쭈욱!');
    }
    if(doze){
      WT(D.c, ()=>{ hands(false); overlay(eyeClosed(G,-7) + eyeClosed(G,7)); setCls('w-doze'); setBubble('쿨…'); });
      WT(D.c + Math.round(doze/2), ()=>{ overlay(''); setCls('w-shakehead'); setBubble('조금만 더 자고 싶어…'); });
    }
  });
  // ③ 줌아웃 — 원래 방 크기로
  WT(t3, ()=>{ hands(false); overlay(''); setCls(null); zoomTo(false, calm); });
  // ④ 내려와 이불 개고(BED_IDLE), 러그로 뒤뚱뒤뚱 걸어오며 원래 크기로
  WT(t4, ()=>{ hopTo('side', D.d); inBed(false); petWrap().classList.remove('quilt-off'); setBubble('이불 개기 끝!'); });
  WT(t5, ()=>{ walkTo('home', D.e); roomTo(null); });
  // ⑤ 러그에서 인사 → 개운함 고르기
  WT(t6, ()=>{ placePet('home'); layoutBed(); greetNow(G, calm, setCls, overlay, backOverlay, hands, enough); });
  return t6 + (calm ? 600 : 1500);
};
// 건너뛰기·끝날 때 줌도 원래대로
const _finishWakeRun33 = finishWakeRun;
finishWakeRun = function(skipped){
  if(wakeRun && skipped && !wakeRun.toGreet) zoomTo(false, true);
  const r = _finishWakeRun33.call(this, skipped);
  if(!wakeRun && !scene) zoomTo(false, true);
  return r;
};
const _clearScene33 = clearScene;
clearScene = function(){ const r = _clearScene33.apply(this, arguments); if(!wakeRun && $('petStage').classList.contains('zoomed') && scene !== 'sleep') zoomTo(false, true); return r; };
window.addEventListener('resize', ()=>{ if($('petStage').classList.contains('zoomed')){ zoomTo(false, true); layoutBed(); if(bedPose !== 'home') placePet(bedPose); zoomTo(true, true); } });

// 펫 화면 높이가 바뀌면(아래 창이 끼어들 때 등) 방 그림의 벽-바닥 선에 맞춰 침대 자리를 다시
try{ new ResizeObserver(()=>{ if(!$('petStage').classList.contains('zoomed')){ layoutBed(); } }).observe($('petStage')); }catch(e){}
if(!$('app').hidden){ setTimeout(()=>{ layoutBed(); if(scene === 'sleep') snapAsleep(); }, 50); }
</script>

<style>
.grow-tip{display:block;font-size:11px;color:var(--ink-soft);margin:2px 2px 0}
.grow-wait{display:flex;align-items:center;justify-content:center;height:26px;font-size:9px;line-height:1.1;color:var(--ink-soft);text-align:center;white-space:nowrap}
</style>
<script>
/* =========================================================
   기록 3일 미만 갈래 정하기 — 단추 누른 횟수가 아니라 습관 '달성 점수(0~100)'의 날마다 평균
   ========================================================= */
function dayHabitScores(r){
  const g = S.goals, cap = v => Math.max(0, Math.min(100, Math.round(v)));
  const water = r.water || 0, sm = sleepMinutes(r), c = cafOf(r);
  const w = r.allNighter || !r.wake ? null : toMin(r.wake);
  return {
    water: cap((water - g.water) * 25),                                   // 목표보다 더 마셨을 때만
    waterOwl: water >= g.water ? Math.max(50, cap((water - g.water) * 25)) : 0,   // 부엉 판단용: 목표만큼이면 50
    sleep: sm != null ? cap(sm / g.sleepMin * 100) : 0,
    wake: w == null ? 0 : w < 8*60 ? 100 : w < 9*60 ? 60 : 0,
    caf: (r.date === today() && new Date().getHours() < 18) ? 0 : c === 0 ? 100 : c <= g.caffeine ? 50 : 0,   // 물과 무관 · 오늘은 저녁 6시 뒤에만
    nap: Number(r.napMin) >= 20 ? 100 : 0
  };
}
function babyHabitScores(){
  const rs = babyDays(), keys = ['water','waterOwl','sleep','wake','caf','nap'], out = {};
  keys.forEach(k=>out[k] = 0);
  if(!rs.length) return out;
  const per = rs.map(dayHabitScores);                    // 날마다 따로 낸 뒤 평균 (오늘도 지금까지의 기록으로)

  if(sc.waterOwl >= 50 && sc.sleep >= 50 && sc.caf >= 50) return 'owl';     // 골고루 지킨 경우가 먼저

  const owl = raw.waterOwl >= 50 && raw.sleep >= 50 && raw.caf >= 50;

  }).join('') + `<span class="grow-lead">${lead ? `${lead[2]} 기운!` : '아직 몰라…'}</span>`;

    return s;

  if(m === 'wake' && !(h >= 5 && h < 11)) return _roomSVG37(Object.assign({}, opt, { mode: undefined }));

const _veil37 = veil;
veil = function(on, ms){

sleepNow = function(){

  }

<script>
/* =========================================================
   갈래 정하기 — 기록한 날 수와 상관없이 하루 '습관 점수(0~100)'의 평균 하나로
   최근 기록한 3일(오늘 제외) 평균 · 오늘 뺀 기록이 3일 미만이면 기록한 날 전부
   ========================================================= */
function habitDayScore(r){
  const g = S.goals, cap = v => Math.max(0, Math.min(100, Math.round(v)));
  const w = r.water || 0, sm = sleepMinutes(r), wk = (r.allNighter || !r.wake) ? null : toMin(r.wake);
  const water = cap((w - g.water) * 25), sleep = sm != null ? cap(sm / g.sleepMin * 100) : 0;
  const waterOwl = w >= g.water ? Math.max(50, water) : 0, keep = cafOf(r) <= g.caffeine ? 100 : 0;
  return {
    water, sleep,
    wake: wk == null ? 0 : wk < 8*60 ? 100 : wk < 9*60 ? 60 : 0,
    koala: koalaDayScore(r),
    nap: Number(r.napMin) >= 20 ? 100 : 0,
    waterOwl, keep,
    owl: (waterOwl >= 50 && sleep >= 50 && keep >= 50) ? 100 : 0
  };
}
function habitAvgDays(){
  const all = babyDays().slice().sort((a,b)=>a.date < b.date ? 1 : -1);   // 오늘 포함 최근 기록한 3일
  return all.slice(0, 3);
}
function habitAvgs(){
  const rs = habitAvgDays(), keys = ['water','sleep','wake','koala','nap','waterOwl','keep','owl'], out = { n: rs.length };
  keys.forEach(k=>out[k] = 0);
  if(rs.length){ const per = rs.map(habitDayScore); keys.forEach(k=>out[k] = Math.round(per.reduce((s,x)=>s + x[k], 0) / per.length)); }
  out.caf = out.keep;
  return out;
}
const HABIT_TO_BRANCH = [['water','peng'],['sleep','cat'],['wake','dog'],['koala','ham'],['nap','sleepy']];

  if(a.owl >= 50) return 'owl';
  const top = Math.max(...HABIT_TO_BRANCH.map(x=>a[x[0]]));
  if(top <= 0) return 'basic';
  const tied = HABIT_TO_BRANCH.filter(x=>a[x[0]] === top);
  return (random ? tied[Math.floor(Math.random() * tied.length)] : tied[0])[1];
}
// 처음 갈래 정하기 (반짝 5%는 진화 때 따로 굴린다 · 체험 모드면 합쳐 10%)

  }catch(e){}

    const pBlank = at('<g transform="translate(322 410)">'), pEnd = s.lastIndexOf('</svg>');
    const pCur = pBlank >= 0 ? s.indexOf('<path d="M10,86 Q34,88 58,86 L58,208', pBlank) : -1;
    const w0 = pGlow >= 0 && pGlow < pWin ? pGlow : pWin;
    const seq = [w0, pLL, pShelf, pLamp, pCab, pRug, pEnd];
    for(let i=0;i<seq.length;i++) if(seq[i] < 0 || (i && seq[i] < seq[i-1])) return s;
    const shelfEnd = (pWall > pShelf && pWall < pLamp) ? pWall : pLamp;
    const cabEnd = (pBeam > pCab && pBeam < pRug) ? pBeam : pRug;
    const beam = cabEnd === pBeam ? s.slice(pBeam, pRug) : '';
    const cur = pCur > 0 ? s.slice(pCur, pEnd) : '';
    let out = s.slice(0, w0) + furnG(s.slice(w0, pLL), ROOM_FURN.win)
      + s.slice(pLL, pShelf) + furnG(s.slice(pShelf, shelfEnd), ROOM_FURN.shelf)
      + s.slice(shelfEnd, pLamp) + (ROOM_FURN.lamp ? furnG(furnCab(s.slice(pCab, cabEnd)), ROOM_FURN.cab) + furnG(furnLamp(s.slice(pLamp, pCab)), ROOM_FURN.lamp) : furnG(s.slice(pLamp, cabEnd), ROOM_FURN.cab))
      + furnG(beam, ROOM_FURN.win)
      + s.slice(pRug, pCur > 0 ? pCur : pEnd) + furnG(cur, ROOM_FURN.win) + s.slice(pEnd);
    return out;
  }catch(e){ return s; }
};

</script>

<script>
/* 창문: 왼쪽 끝 = 방 폭 8%, 커튼 맨 위 = 방 위 40px, 아래 끝은 침대 머리판보다 위 (크기는 1.4배, 모자라면 줄인다) */
function placeWindow(){
  const st = $('petStage'); if(!st) return false;
  const W = st.clientWidth, H = st.clientHeight; if(!W || !H) return false;
  const s = H/460, offX = (W - 360*s)/2;
  let bedTop = null;
  try{ if(BZ && BZ.idle && BZ.wb) bedTop = BZ.wb.Tw + 220 + PET_S*(BZ.idle.T - 220); }catch(e){}
  if(bedTop == null || !isFinite(bedTop)) bedTop = 300*s - W*0.28*1.4*0.45*0.86;
  const top = 40, avail = bedTop - 4 - top;                 // px
  const k = Math.max(0.6, Math.min(1.4, (avail / s) / 132.4));
  const t = [ (W*0.08 - offX)/s, top/s ];
  const w = ROOM_FURN.win, changed = Math.abs(w.k - k) > 0.01 || Math.abs(w.t[0] - t[0]) > 0.5 || Math.abs(w.t[1] - t[1]) > 0.5 || w.a[0] !== 6;
  ROOM_FURN.win = { k, a:[6,82.6], t };
  return changed;
}
const _roomSVG76 = roomSVG;
roomSVG = function(opt){ try{ placeWindow(); }catch(e){} return _roomSVG76.apply(this, arguments); };
const _layoutBed76 = layoutBed;
layoutBed = function(){
  const r = _layoutBed76.apply(this, arguments);
  try{ if(placeWindow()){ _roomKey = ''; const el = $('roomBg'); const base = el && el.querySelector('.rm-base'); if(base) base.innerHTML = roomSVG(); el && el.querySelectorAll('.rm-over').forEach(o=>{ o.innerHTML = roomSVG({ mode: roomMode }); }); } }catch(e){}
  return r;
};
if(!$('app').hidden){ setTimeout(()=>{ try{ layoutBed(); }catch(e){} }, 160); }
</script>

<script>
/* 오른쪽 정리: 협탁(오른쪽 끝 = 방 폭 95%, 바닥 선) · 스탠드는 협탁 위 오른쪽 · 컵은 왼쪽 · 선반은 스탠드 왼쪽(책 맨 위 = 44px) */
function furnLamp(str){ return str.replace(/<circle cx="326" cy="206" r="\d+"/, '<circle cx="326" cy="206" r="40"'); }   // 불빛 번짐은 스탠드 주변만
function furnCab(str){
  const i = str.indexOf('<rect x="314" y="262"');                           // 시험 책은 가운데로 조금 (스탠드와 겹치지 않게)
  return i < 0 ? str : str.slice(0, i) + '<g transform="translate(-18 0)">' + str.slice(i) + '</g>';
}
function placeRight(){
  const st = $('petStage'); if(!st) return false;
  const W = st.clientWidth, H = st.clientHeight; if(!W || !H) return false;
  const s = H/460, offX = (W - 360*s)/2, U = px => (px - offX)/s, k = 1.4;
  const cabR = U(W*0.95), cabTop = 300 - (336 - 270)*k;
  const cab = { k, a:[350,336], t:[cabR, 300] };
  const lampX = cabR + (338 - 350)*k;
  const kL = Math.min(k, Math.max(0.5, ((cabTop + 3) - 42/s) / 150));        // 갓 꼭대기가 알약 아래(42px)에 오게, 모자라면 조금 작게
  const lamp = { k:kL, a:[326,336], t:[lampX, cabTop + 3] };
  const shadeL = lampX + (308 - 326)*kL;
  const shelf = { k, a:[345,100], t:[shadeL - 6/s, 44/s] };
  const old = JSON.stringify([ROOM_FURN.cab, ROOM_FURN.lamp, ROOM_FURN.shelf]);
  ROOM_FURN.cab = cab; ROOM_FURN.lamp = lamp; ROOM_FURN.shelf = shelf;
  return JSON.stringify([cab, lamp, shelf]) !== old;
}
const _placeWindow77 = placeWindow;
placeWindow = function(){ const a = _placeWindow77(); const b = placeRight(); return a || b; };
if(!$('app').hidden){ setTimeout(()=>{ try{ _roomKey = ''; renderRoom(true); layoutBed(); }catch(e){} }, 180); }
</script>
