<meta property="og:description" content="시험 기간에 무너진 잠과 물 습관을 기록하면, 콩알이가 자라요. 7일 흐름과 목표 달성 일수를 한눈에.">

<style>
/* 레이아웃: 휴대폰 한 손 기준 세로 1열(최대 480px), 아래 고정 탭 3개, 창은 아래에서 올라오는 시트 */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --surface2:#EDF1E8; --ink:#5A4A42; --ink-soft:#8E7E75; --line:#E2DCD2;
  --accent:#E8896A; --accent-ink:#FFFFFF; --accent-soft:#FBE3D9;
  --mint:#9EE6CF; --peach:#FFC3A8; --lav:#C9B8FF; --sky:#A8D8FF; --lemon:#F5D86B;
  --sleep:#B3A3F2; --sleep-soft:#DDD5FA; --water:#7FC3F0; --water-soft:#CBE7FA; --caf:#C9A27E; --caf-over:#E07A5F;
  --good:#4FA88A; --stage:#FBF8F2;
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1B22; --surface:#29252F; --surface2:#322D39; --ink:#F2E9E2; --ink-soft:#B4A8A1; --line:#403946;
  --accent:#F0A285; --accent-ink:#2A1A13; --accent-soft:#4A3229;
  --sleep:#9D8CE6; --sleep-soft:#4A4266; --water:#6AB4E6; --water-soft:#2F4A5E; --caf:#B89272; --caf-over:#EE8B70;
  --good:#6CC7A6; --stage:#2E2933; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1B22; --surface:#29252F; --surface2:#322D39; --ink:#F2E9E2; --ink-soft:#B4A8A1; --line:#403946;
  --accent:#F0A285; --accent-ink:#2A1A13; --accent-soft:#4A3229;
  --sleep:#9D8CE6; --sleep-soft:#4A4266; --water:#6AB4E6; --water-soft:#2F4A5E; --caf:#B89272; --caf-over:#EE8B70;
  --good:#6CC7A6; --stage:#2E2933; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}

.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.screen{display:flex;flex-direction:column;gap:14px}

/* 공통 */
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
.primary{background:var(--accent);color:var(--accent-ink);border:2px solid var(--ink);border-radius:14px;padding:12px 18px;font-family:var(--f-display);font-size:17px;box-shadow:0 3px 0 var(--ink)}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.ghost.sm,.sm{font-size:13px;padding:6px 10px}
.danger{border-color:var(--caf-over)!important;color:var(--caf-over)}
.hint{color:var(--ink-soft);font-size:13px}
.err{color:var(--caf-over);font-size:13px;min-height:1.4em}

.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--surface2);font-size:20px;line-height:1;display:grid;place-items:center}
.stepper button:disabled{opacity:.35}
.stepper output{min-width:76px;text-align:center;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}

/* 처음 시작 */
.onboard{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px;display:flex;flex-direction:column;gap:18px}
.ob-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.dots{display:flex;gap:8px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.dots i.on{background:var(--ink)}
.dots span{margin-left:6px;font-size:13px;color:var(--ink-soft)}
.ob-title{font-size:26px;line-height:1.3}
.eggs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.egg-pick{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.egg-pick svg{width:78px;height:auto}
.egg-pick b{font-family:var(--f-display);font-weight:400;font-size:16px}
.egg-pick small{color:var(--ink-soft);font-size:12px}
.egg-pick[aria-pressed="true"]{border-color:var(--ink);background:var(--accent-soft)}
.intro{min-height:3.2em;background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:12px 14px}
.ob-field{display:flex;flex-direction:column;gap:6px}
.ob-field label,.field>span{font-size:14px;color:var(--ink-soft)}
input[type=text],input[type=date],input[type=time]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.ob-actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.ob-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.ob-row:last-child{border-bottom:0}
.now-sleep{font-family:var(--f-display);font-size:19px;background:var(--surface2);border-radius:14px;padding:12px 14px}
.goal-box{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:6px 14px}
.goal-box h3{font-size:17px;padding-top:8px}

/* 펫 화면 */
.pet-head{display:flex;flex-direction:column;gap:8px}
.name-row{display:flex;align-items:center;gap:8px}
.name-row h1{font-size:28px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.icon-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:16px;height:16px}
.head-btns{margin-left:auto;display:flex;gap:6px}
.lv-row{display:flex;align-items:center;gap:10px}
.lv{font-family:var(--f-display);font-size:18px;background:var(--ink);color:var(--bg);border-radius:10px;padding:1px 9px}
.expbar{flex:1;height:14px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);overflow:hidden}
.expbar i{display:block;height:100%;width:0;background:var(--lemon);border-right:2px solid var(--ink);transition:width .5s}
.expbar i[style*="width: 0"]{border-right:0}
#expText{font-size:13px;color:var(--ink-soft);min-width:64px;text-align:right}

.stage{position:relative;background:var(--stage);border:2px solid var(--ink);border-radius:26px;padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden;min-height:330px}
.bubble{position:relative;max-width:92%;background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:9px 16px;font-size:15px;text-align:center;min-height:44px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:var(--surface);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.pet-wrap{position:relative;width:200px;height:220px;margin-top:8px}
#petLayer,#fxLayer{position:absolute;inset:0}
#fxLayer{pointer-events:none}
#petLayer{cursor:pointer;transform-origin:50% 95%}
#petLayer svg{width:100%;height:100%;display:block}
.breathe{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
.wobble{animation:wobble .6s ease-in-out}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) translateY(-4px)}45%{transform:rotate(7deg)}70%{transform:rotate(-4deg) translateY(-2px)}85%{transform:rotate(2deg)}}
.twinkle{animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35}}

.today-card{display:flex;flex-direction:column;gap:10px}
.today-card h3{font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:999px;padding:3px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.chip.ok{background:var(--good);color:var(--surface)}
.chip.over{background:var(--caf-over);color:var(--surface)}
.goal-line{font-size:13px;color:var(--ink-soft)}

/* 기록 화면 */
.form{display:flex;flex-direction:column;gap:12px}
.form-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.form-top h2{font-size:21px}
.form.editing{border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field small{color:var(--ink-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.srow>span{font-size:14px;color:var(--ink-soft)}
.toggle{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-size:14px;text-align:left}
.toggle[aria-pressed="true"]{border-color:var(--ink);background:var(--sleep-soft)}
.sleep-total{font-family:var(--f-display);font-size:18px;background:var(--sleep-soft);border-radius:12px;padding:10px 12px;font-variant-numeric:tabular-nums}
.fresh{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fresh button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;font-family:var(--f-display);font-size:17px}
.fresh button[aria-pressed="true"]{border-color:var(--ink);background:var(--lemon);color:#5A4A42}
.fresh-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft)}
.form-actions{display:flex;gap:8px}
.form-actions .primary{flex:1}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
fieldset:disabled{opacity:.4}

.list{display:flex;flex-direction:column;gap:8px}
.list h2{font-size:19px;padding:4px 2px}
.rec{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rec-top{display:flex;align-items:center;gap:8px}
.rec-date{font-family:var(--f-display);font-size:17px}
.tag{font-size:11px;border:1.5px solid var(--ink-soft);color:var(--ink-soft);border-radius:999px;padding:0 7px}
.rec-btns{margin-left:auto;display:flex;gap:6px}
.empty{text-align:center;color:var(--ink-soft);padding:20px}

/* 일주일 화면 */
.wk-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wk-sum .card{padding:12px 14px}
.wk-sum b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.wk-sum span{font-size:13px;color:var(--ink-soft)}
.chart-card h3{font-size:17px;margin-bottom:2px}
.chart-card svg{width:100%;height:auto;display:block}
.ax{fill:var(--ink-soft);font-size:10px;font-family:var(--f-body)}
.vl{fill:var(--ink);font-size:10.5px;font-family:var(--f-body)}
.grid{stroke:var(--line);stroke-width:1}
.base{stroke:var(--ink);stroke-width:2}
.gl{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:5 4}
.glt{fill:var(--ink);font-size:10px;font-family:var(--f-body)}
.b-sleep{fill:var(--sleep-soft);stroke:var(--ink);stroke-width:1.5}
.b-sleep.met{fill:var(--sleep)}
.b-water{fill:var(--water-soft);stroke:var(--ink);stroke-width:1.5}
.b-water.met{fill:var(--water)}
.b-caf{fill:var(--caf);stroke:var(--ink);stroke-width:1.5}
.b-caf.over{fill:var(--caf-over)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid var(--ink);margin-right:4px;vertical-align:-1px}

/* 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--ink);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{background:transparent;border:0;border-radius:14px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;color:var(--ink-soft)}
.tabs button svg{width:26px;height:26px}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--accent-soft)}

/* 창 */
.sheet-bg{position:fixed;inset:0;background:rgba(40,30,25,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:88%;overflow:auto;background:var(--bg);border:2px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-top{display:flex;align-items:center;justify-content:space-between}
.sheet-top h2{font-size:22px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){.breathe,.wobble,.twinkle{animation:none!important}.expbar i{transition:none}}
</style>
<style>
/* ── 2단계: D-day 띠, 빠른 기록 ── */
:root{ --dd-calm:#E4ECF4; --dd-calm-ink:#4E6274; --dd-warn:#F6B36B; --dd-hot:#E36A5C; --dd-hot-ink:#FFFFFF; --dd-warn-ink:#4A3020; }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --dd-calm:#2D3A47; --dd-calm-ink:#C4D4E3; --dd-warn:#C98540; --dd-hot:#C9564A; --dd-hot-ink:#FFF4F0; --dd-warn-ink:#1E1208; }}
:root[data-theme="dark"]{ --dd-calm:#2D3A47; --dd-calm-ink:#C4D4E3; --dd-warn:#C98540; --dd-hot:#C9564A; --dd-hot-ink:#FFF4F0; --dd-warn-ink:#1E1208; }
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qbtn{background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13.5px;box-shadow:0 3px 0 var(--ink)}
.qbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.qbtn:disabled{opacity:.5;box-shadow:none;transform:none}
.qbtn svg{width:30px;height:30px}
.qbtn b{font-family:var(--f-display);font-weight:400;font-size:15px}
.qbtn small{color:var(--ink-soft);font-size:11.5px;font-variant-numeric:tabular-nums}
.qbtn.wide{grid-column:span 1}
.quick .sleep-row{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qbtn.on{background:var(--sleep-soft)}
.exam-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.exam-row b{font-family:var(--f-display);font-weight:400;font-size:16px;min-width:0;overflow-wrap:anywhere}
.exam-row .num{color:var(--ink-soft);font-size:13px}
.exam-row button{margin-left:auto}
.exam-add{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 0 4px}
</style>
<style>
/* ── 3단계: 성장 ── */
.chip.soft{background:var(--surface);border:1.5px solid var(--line)}
.evo{position:absolute;inset:-30px;display:grid;place-items:center;pointer-events:none}
.evo .ring{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#FFFFFF 0%,#FFF3B8 45%,rgba(255,243,184,0) 70%);animation:evoRing 2s ease-out forwards}
.evo .spk{position:absolute;width:14px;height:14px;background:#F5D86B;border:2px solid #5A4A42;transform:rotate(45deg);animation:evoSpk 2s ease-out forwards}
@keyframes evoRing{0%{transform:scale(.2);opacity:0}30%{opacity:1}60%{transform:scale(4.2);opacity:1}100%{transform:scale(5);opacity:0}}
@keyframes evoSpk{0%{opacity:0;transform:translate(0,0) rotate(45deg) scale(.4)}40%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(225deg) scale(1)}}
.evolving{animation:evoShake 2s ease-in-out}
@keyframes evoShake{0%,100%{transform:none;filter:none}15%,35%,55%{transform:rotate(-6deg)}25%,45%,65%{transform:rotate(6deg)}70%{filter:brightness(2.2)}80%{filter:brightness(1.4)}}
@media (prefers-reduced-motion:reduce){.evo{display:none}.evolving{animation:none}}
</style>
<style>

.stage>.bubble,.stage>.pet-wrap{z-index:1}
.scene-bg{position:absolute;inset:0;z-index:0;opacity:0;transition:opacity .8s ease;pointer-events:none}
.scene-bg.on{opacity:1}
.scene-bg svg{width:100%;height:100%;display:block}
#fxBack,#floatLayer{position:absolute;inset:0;pointer-events:none}

#petLayer.nesting svg{transform:translateY(8px) scale(.88)}
.fx-a{transform-box:fill-box;transform-origin:50% 50%}
/* 펫 동작 */
.boing{animation:boing .45s ease-in-out 3}
@keyframes boing{0%,100%{transform:scale(1,1)}40%{transform:scale(1.08,.9)}70%{transform:scale(.96,1.05)}}
.jump{animation:jump .7s cubic-bezier(.3,.7,.4,1) 2}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:scale(1.08,.9)}50%{transform:translateY(-34px) scale(.96,1.05)}85%{transform:scale(1.05,.95)}}
.shiver{animation:shiver .09s linear 18}
@keyframes shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.hop{animation:hop .28s ease-in-out 6}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.stagger{animation:stagger 1.8s ease-in-out}
@keyframes stagger{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg) translateX(-6px)}45%{transform:rotate(8deg) translateX(6px)}70%{transform:rotate(-5deg)}85%{transform:rotate(3deg)}}
.yawn{animation:yawn .9s ease-in-out}
@keyframes yawn{0%,100%{transform:scale(1,1)}50%{transform:scale(.95,1.1)}}
.rub{animation:rub .35s ease-in-out 2}

<script>
/* =========================================================
   저장 (localStorage) — 키 이름은 바꾸지 않는다
   ========================================================= */
const KEYS = {
  profile:  'habipet_profile',   // 펫: species, petName, level, exp, coins, createdAt
  goals:    'habipet_goals',     // 목표: sleepMin, water, caffeine
  baseline: 'habipet_baseline',  // 시작 전 기록
  records:  'habipet_records'    // 날짜별 기록 { 'YYYY-MM-DD': {...} }
};
const MEM = {};
function load(k, def){ try{ const v = localStorage.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){ if(MEM[k]!==undefined) return MEM[k]; } return MEM[k]!==undefined ? MEM[k] : def; }
function save(k, v){ MEM[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const S = { profile:null, goals:null, baseline:null, records:{} };
function saveAll(){ save(KEYS.profile,S.profile); save(KEYS.goals,S.goals); save(KEYS.baseline,S.baseline); save(KEYS.records,S.records); }

/* =========================================================
   날짜·시간 도우미, 수면 계산
   ========================================================= */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
function addDays(s, n){ const [y,m,d] = s.split('-').map(Number); return ymd(new Date(y, m-1, d+n)); }
const WD = ['일','월','화','수','목','금','토'];
function dateLabel(s){ const [y,m,d]=s.split('-').map(Number); const w=new Date(y,m-1,d).getDay(); return `${m}월 ${d}일 (${WD[w]})`; }
function shortLabel(s){ const [y,m,d]=s.split('-').map(Number); return {md:`${m}/${d}`, wd:WD[new Date(y,m-1,d).getDay()]}; }
const toMin = t => { if(!t) return null; const [h,m] = t.split(':').map(Number); return h*60+m; };
// 밤 12시를 넘겨도 맞게: 일어난 시각이 더 이르면 하루를 더한다. 낮잠 포함.
function nightMinutes(bed, wake){ const b=toMin(bed), w=toMin(wake); if(b==null||w==null) return 0; let m=w-b; if(m<0) m+=1440; return m; }
function sleepMinutes(r){ if(!r) return null; if(!r.allNighter && (!r.bed || !r.wake)) return r.napMin ? Number(r.napMin) : null; /* 2단계: 잔 시각을 아직 안 넣은 날은 '미기록' */ return (r.allNighter ? 0 : nightMinutes(r.bed, r.wake)) + (Number(r.napMin)||0); }
function fmtHM(m){ if(m==null) return '미기록'; m=Math.max(0,Math.round(m)); const h=Math.floor(m/60), mm=m%60; return mm ? `${h}시간 ${mm}분` : `${h}시간`; }
const cafOf = r => (Number(r.coffee)||0) + (Number(r.energy)||0);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
function iya(name){ const c=name.charCodeAt(name.length-1); if(c>=0xAC00 && c<=0xD7A3) return (c-0xAC00)%28 ? '이야' : '야'; return '야'; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const charLen = s => [...s].length;

/* =========================================================
   SPECIES — 종 정보는 이 목록 하나에만
   (3단계에서 성격·말버릇·아기/어른 묘사를 이 객체들에 더한다)
   ========================================================= */
function starPath(cx, cy, r){ let d=''; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.45:r; d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1); } return d+'Z'; }
const SPECIES = [
  { id:'kkomul', name:'꼬물', grade:'일반', color:'레몬', eggName:'레몬 알', eggBase:'#FFF6C9',
    likes:'일찍 일어나기',
    eggPattern:`<path d="M20 92 Q45 78 70 92 T120 92 T170 92 T220 92" fill="none" stroke="#F5D86B" stroke-width="8" stroke-linecap="round"/>
      <path d="M20 128 Q45 114 70 128 T120 128 T170 128 T220 128" fill="none" stroke="#F5D86B" stroke-width="8" stroke-linecap="round"/>
      <path d="M20 164 Q45 150 70 164 T120 164 T170 164 T220 164" fill="none" stroke="#F5D86B" stroke-width="8" stroke-linecap="round"/>
      <circle cx="91" cy="32" r="4.5" fill="#E2B93F"/><circle cx="109" cy="32" r="4.5" fill="#E2B93F"/>` },
  { id:'mongsil', name:'몽실', grade:'일반', color:'민트', eggName:'민트 알', eggBase:'#E1F6EE',
    likes:'일찍 자기', intro:'소심하지만 마음 따뜻한 아이가 들어 있대요. 일찍 자는 걸 좋아해요.',
    eggPattern:`<ellipse cx="87" cy="38" rx="9" ry="11" fill="#9EE6CF"/><ellipse cx="113" cy="38" rx="9" ry="11" fill="#9EE6CF"/>
      <circle cx="60" cy="120" r="9" fill="#BDEFDF"/><circle cx="142" cy="140" r="11" fill="#BDEFDF"/><circle cx="104" cy="172" r="7" fill="#BDEFDF"/><circle cx="130" cy="90" r="6" fill="#BDEFDF"/>` },
  { id:'tosil', name:'토실', grade:'일반', color:'복숭아', eggName:'복숭아 알', eggBase:'#FFE8DC',
    likes:'물 마시기', intro:'호기심 많은 수다쟁이가 들어 있대요. 물 마시는 걸 좋아해요.',
    eggPattern:`<ellipse cx="76" cy="96" rx="12" ry="38" fill="#FFC3A8" transform="rotate(-14 76 96)"/><ellipse cx="76" cy="100" rx="5.5" ry="26" fill="#FFDCCB" transform="rotate(-14 76 100)"/>
      <ellipse cx="124" cy="96" rx="12" ry="38" fill="#FFC3A8" transform="rotate(14 124 96)"/><ellipse cx="124" cy="100" rx="5.5" ry="26" fill="#FFDCCB" transform="rotate(14 124 100)"/>
      <circle cx="100" cy="172" r="7" fill="#FFC3A8"/>` },
  { id:'songi', name:'송이', grade:'일반', color:'라벤더', eggName:'라벤더 알', eggBase:'#EEE7FF',
    likes:'낮잠과 규칙적인 생활', intro:'먹보 뚱땅보가 들어 있대요. 낮잠과 규칙적인 생활을 좋아해요.',
    eggPattern:`<g fill="#FFFFFF" stroke="#C9B8FF" stroke-width="3"><circle cx="66" cy="98" r="14"/><circle cx="128" cy="76" r="10"/><circle cx="142" cy="146" r="15"/><circle cx="62" cy="158" r="9"/><circle cx="104" cy="56" r="7"/><circle cx="104" cy="180" r="8"/><circle cx="100" cy="118" r="5"/></g>` },
  { id:'byeolttong', name:'별똥', grade:'희귀', color:'금색', eggName:'금빛 알', eggBase:'#FFF1BF',
    likes:'연속 달성',
    eggPattern:`<g fill="#F2C443"><path class="twinkle" d="${starPath(70,90,13)}"/><path d="${starPath(132,70,9)}"/><path class="twinkle" d="${starPath(142,146,14)}" style="animation-delay:.6s"/><path d="${starPath(62,156,8)}"/><path d="${starPath(104,178,7)}"/></g>` },
  { id:'mungge', name:'뭉게', grade:'희귀', color:'흰색에 보랏빛', eggName:'구름 알', eggBase:'#F8F5FF',

function stepperHTML(text, minus, plus){ return `<button type="button" data-d="-1" aria-label="줄이기"${minus?'':' disabled'}>−</button><output>${text}</output><button type="button" data-d="1" aria-label="늘리기"${plus?'':' disabled'}>+</button>`; }
// 스테퍼 정의: key → { get, set, min, max, step, fmt }
const STEP = {};
function renderStepper(el){
  const def = STEP[el.dataset.key]; if(!def) return;
  const v = def.get();
  el.innerHTML = stepperHTML(def.fmt(v), v>def.min, v<def.max);
}
function renderSteppers(root){ root.querySelectorAll('.stepper').forEach(renderStepper); }
document.addEventListener('click', e=>{
  const b = e.target.closest('.stepper button'); if(!b) return;
  const el = b.closest('.stepper'), def = STEP[el.dataset.key]; if(!def) return;
  const nv = clamp(def.get() + Number(b.dataset.d)*def.step, def.min, def.max);
  def.set(nv); renderStepper(el); if(def.after) def.after();
});
const cups = v => `${v}잔`;

function suggestGoals(){
  const cur = nightMinutes(OB.bed, OB.wake);

}

  obCoffee:{ get:()=>OB.coffee, set:v=>{ OB.coffee=v; OB.caffeine=OB.coffee+OB.energy; }, min:0, max:10, step:1, fmt:cups, after:()=>{suggestGoals(); renderOb3Live();} },
  obEnergy:{ get:()=>OB.energy, set:v=>{ OB.energy=v; OB.caffeine=OB.coffee+OB.energy; }, min:0, max:10, step:1, fmt:v=>`${v}캔`, after:()=>{suggestGoals(); renderOb3Live();} },
  obGSleep:{ get:()=>OB.gSleep, set:v=>OB.gSleep=v, min:180, max:720, step:30, fmt:fmtHM },
  obGWater:{ get:()=>OB.gWater, set:v=>OB.gWater=v, min:1, max:15, step:1, fmt:cups },

      </div>

      <div class="ob-actions"><button class="primary" id="obNext">다음</button></div>`;
  } else {
    body = `<h1 class="ob-title">다가오는 시험이 있나요?</h1>

$('onboard').addEventListener('click', e=>{

      const er = $('obTimeErr'), msg = (!OB.bed || !OB.wake) ? '잠드는 시각과 일어나는 시각을 모두 넣어 주세요' : OB.bed === OB.wake ? '두 시각이 같아요. 다시 확인해 주세요' : '';

      OB.step=4; renderOnboard();

    const name = $('obExName').value.trim(), date = $('obExDate').value;

/* =========================================================
   기록 화면
   ========================================================= */
const F = { nap:0, water:0, coffee:0, energy:0, fresh:3, allNighter:false };
let editingDate = null;
Object.assign(STEP, {
  nap:   { get:()=>F.nap, set:v=>F.nap=v, min:0, max:240, step:10, fmt:v=>`${v}분`, after:updSleepTotal },
  water: { get:()=>F.water, set:v=>F.water=v, min:0, max:20, step:1, fmt:cups },
  coffee:{ get:()=>F.coffee, set:v=>F.coffee=v, min:0, max:10, step:1, fmt:cups },
  energy:{ get:()=>F.energy, set:v=>F.energy=v, min:0, max:10, step:1, fmt:v=>`${v}캔` }
});
$('fFresh').innerHTML = [1,2,3,4,5].map(v=>`<button type="button" data-v="${v}" aria-label="개운함 ${v}점">${v}</button>`).join('');
$('fFresh').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; F.fresh=Number(b.dataset.v); renderFresh(); });
function renderFresh(){ $('fFresh').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', Number(b.dataset.v)===F.fresh)); }
function renderAllNighter(){ $('fAllNighter').setAttribute('aria-pressed', F.allNighter); $('fsTimes').disabled = F.allNighter; }
$('fAllNighter').addEventListener('click', ()=>{ F.allNighter=!F.allNighter; renderAllNighter(); updSleepTotal(); });
['fBed','fWake'].forEach(id=>$(id).addEventListener('input', updSleepTotal));
function updSleepTotal(){
  const m = (F.allNighter?0:nightMinutes($('fBed').value,$('fWake').value)) + F.nap;
  const parts = F.allNighter ? ['밤샘'] : [];
  if(F.nap) parts.push(`낮잠 ${F.nap}분 포함`);
  $('fSleepTotal').textContent = `총 수면 ${fmtHM(m)}` + (parts.length?` · ${parts.join(', ')}`:'');
}
function fillForm(r, date){
  $('fDate').value = date;
  $('fBed').value = r.bed||''; $('fWake').value = r.wake||'';
  F.nap=r.napMin||0; F.water=r.water||0; F.coffee=r.coffee||0; F.energy=r.energy||0; F.fresh=r.fresh||null; F.allNighter=!!r.allNighter;
  $('fLastCaf').value = r.lastCaffeine||'';
  renderSteppers($('recForm')); renderFresh(); renderAllNighter(); updSleepTotal(); $('fErr').textContent='';
}
function resetForm(date){
  editingDate = null;
  const d = date || today();
  const prev = S.records[addDays(d,-1)];
  fillForm({ bed: prev&&!prev.allNighter ? prev.bed : S.baseline.bed, wake: prev&&!prev.allNighter ? prev.wake : S.baseline.wake, napMin:0, water:0, coffee:0, energy:0, fresh:null, allNighter:false, lastCaffeine:'' }, d);
  $('formTitle').textContent = '기록하기'; $('btnCancelEdit').hidden = true; $('recForm').classList.remove('editing');
}
function startEdit(date){
  const r = S.records[date]; if(!r) return;
  editingDate = date; fillForm(r, date);
  $('formTitle').textContent = `${dateLabel(date)} 수정`; $('btnCancelEdit').hidden = false; $('recForm').classList.add('editing');
  $('recForm').scrollIntoView({behavior:'smooth', block:'start'});
}
$('btnCancelEdit').addEventListener('click', ()=>resetForm());
$('btnSameYesterday').addEventListener('click', ()=>{
  const d = $('fDate').value || today(), y = addDays(d,-1), r = S.records[y];
  if(!r){ toast(`${dateLabel(y)} 기록이 없어요`); return; }
  fillForm(r, d); toast(`${dateLabel(y)} 기록을 그대로 가져왔어요`);
});
$('recForm').addEventListener('submit', e=>{
  e.preventDefault();
  const date = $('fDate').value, bed=$('fBed').value, wake=$('fWake').value;
  if(!date){ $('fErr').textContent='날짜를 골라 주세요'; return; }
  if(date > today()){ $('fErr').textContent='오늘 이후 날짜는 기록할 수 없어요'; return; }
  if(!F.allNighter && (!bed || !wake)){ $('fErr').textContent='잠든 시각과 일어난 시각을 넣거나 [밤샘]을 눌러 주세요'; return; }
  const existed = !!S.records[date] && date!==editingDate;
  if(editingDate && editingDate!==date) delete S.records[editingDate];
  S.records[date] = { date, bed:F.allNighter?'':bed, wake:F.allNighter?'':wake, allNighter:F.allNighter, napMin:F.nap,
    water:F.water, coffee:F.coffee, energy:F.energy, lastCaffeine:$('fLastCaf').value||'', fresh:F.fresh };
  save(KEYS.records, S.records);
  const wasEdit = !!editingDate;
  toast(existed ? '그날 기록을 새로 덮어썼어요' : wasEdit ? '고친 내용을 저장했어요' : '기록했어요');
  resetForm(); renderList(); renderWeek(); renderTodayCard();
});
let delArm = null, delTimer;
function renderList(){
  const dates = Object.keys(S.records).sort().reverse();
  const g = S.goals;
  if(!dates.length){ $('recList').innerHTML = `<h2>지난 기록</h2><div class="empty">아직 기록이 없어요. 위에서 첫 기록을 남겨 보세요.</div>`; return; }
  $('recList').innerHTML = `<h2>지난 기록</h2>` + dates.map(d=>{
    const r = S.records[d], sm = sleepMinutes(r), c = cafOf(r);
    return `<div class="rec">
      <div class="rec-top"><span class="rec-date">${dateLabel(d)}</span>${r.sample?'<span class="tag">예시</span>':''}
        <div class="rec-btns"><button class="ghost sm" data-edit="${d}">수정</button><button class="ghost sm ${delArm===d?'danger':''}" data-del="${d}">${delArm===d?'정말 삭제':'삭제'}</button></div></div>
      <div class="chips">
        <span class="chip ${sm>=g.sleepMin?'ok':''}">${r.allNighter?'밤샘 · ':''}수면 ${fmtHM(sm)}</span>
        <span class="chip ${r.water>=g.water?'ok':''}">물 ${r.water}잔</span>
        <span class="chip ${c>g.caffeine?'over':''}">커피 ${r.coffee} · 에너지 ${r.energy}${r.lastCaffeine?` · 마지막 ${r.lastCaffeine}`:''}</span>
        ${r.fresh?`<span class="chip">개운함 ${r.fresh}/5</span>`:''}
      </div></div>`;
  }).join('');
}
$('recList').addEventListener('click', e=>{
  const ed = e.target.closest('[data-edit]'), dl = e.target.closest('[data-del]');
  if(ed){ startEdit(ed.dataset.edit); return; }
  if(dl){
    const d = dl.dataset.del;
    if(delArm===d){ delete S.records[d]; save(KEYS.records,S.records); delArm=null; if(editingDate===d) resetForm(); toast('삭제했어요'); renderList(); renderWeek(); renderTodayCard(); }
    else { delArm=d; renderList(); clearTimeout(delTimer); delTimer=setTimeout(()=>{ delArm=null; renderList(); }, 3000); }
  }
});

/* =========================================================
   일주일 화면 — 막대그래프와 목표선
   ========================================================= */
function barChart(o){
  const W=340, H=176, L=34, R=10, T=20, B=36, iw=W-L-R, ih=H-T-B, n=o.values.length, slot=iw/n, bw=Math.min(26, slot*0.56);
  const y = v => T + ih - (v/o.max)*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">`;
  o.ticks.forEach(t=>{ s += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L-6}" y="${y(t)+3.5}" text-anchor="end">${o.tickFmt(t)}</text>`; });
  o.values.forEach((v,i)=>{
    const cx = L + slot*i + slot/2;
    if(v==null){ s += `<text class="ax" x="${cx}" y="${T+ih-6}" text-anchor="middle">–</text>`; }
    else {
      const h = Math.max(2, (Math.min(v,o.max)/o.max)*ih);
      s += `<rect class="${o.cls(v)}" x="${(cx-bw/2).toFixed(1)}" y="${(T+ih-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="5"/>`;
      s += `<text class="vl" x="${cx}" y="${(T+ih-h-5).toFixed(1)}" text-anchor="middle">${o.valFmt(v)}</text>`;
    }
    s += `<text class="ax" x="${cx}" y="${H-B+15}" text-anchor="middle">${o.labels[i].md}</text><text class="ax" x="${cx}" y="${H-B+28}" text-anchor="middle">${o.labels[i].wd}</text>`;
  });
  s += `<line class="base" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/>`;
  const gy = y(Math.min(o.goal,o.max));
  s += `<line class="gl" x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}"/><text class="glt" x="${W-R}" y="${gy-5}" text-anchor="end">${o.goalLabel}</text>`;
  return s + '</svg>';
}
function niceTicks(max, step){ const t=[]; for(let v=0; v<=max+1e-9; v+=step) t.push(v); return t; }
function renderWeek(){
  if(!S.goals) return;
  const t = today(), days = []; for(let i=6;i>=0;i--) days.push(addDays(t,-i));
  const recs = days.map(d=>S.records[d]||null), labels = days.map(shortLabel), g = S.goals;
  $('wkRange').textContent = `${dateLabel(days[0])} ~ ${dateLabel(days[6])}`;
  const sleep = recs.map(r=>r?sleepMinutes(r):null), water = recs.map(r=>r?r.water:null), caf = recs.map(r=>r?cafOf(r):null);
  const recDays = recs.filter(Boolean).length;
  const sleepMet = sleep.filter(v=>v!=null && v>=g.sleepMin).length, waterMet = water.filter(v=>v!=null && v>=g.water).length;
  $('wkSum').innerHTML = `
    <div class="card"><b>${sleepMet}<small style="font-size:16px">/7일</small></b><span>수면 목표(${fmtHM(g.sleepMin)})를 채운 날</span></div>
    <div class="card"><b>${waterMet}<small style="font-size:16px">/7일</small></b><span>물 목표(${g.water}잔)를 채운 날</span></div>
    ${recDays<7?`<p class="hint" style="grid-column:1/-1;margin:0">7일 중 ${recDays}일 기록됐어요. 빈 날은 '–'로 보여요.</p>`:''}`;
  const sMaxH = Math.max(10, Math.ceil(Math.max(0,...sleep.filter(v=>v!=null))/60), Math.ceil(g.sleepMin/60)+1);
  $('chSleep').innerHTML = barChart({ aria:'최근 7일 수면 시간', values:sleep, max:sMaxH*60, ticks:niceTicks(sMaxH*60, sMaxH>12?240:120), tickFmt:v=>`${v/60}h`,
    valFmt:v=>{ const h=Math.floor(v/60), m=Math.round(v%60); return m?`${h}:${pad(m)}`:`${h}h`; },
    cls:v=>'b-sleep'+(v>=g.sleepMin?' met':''), goal:g.sleepMin, goalLabel:`목표 ${fmtHM(g.sleepMin)}`, labels })
    + `<div class="legend"><span><i style="background:var(--sleep)"></i>목표 채움</span><span><i style="background:var(--sleep-soft)"></i>모자람</span><span>시:분</span></div>`;
  const wMax = Math.max(10, g.water+2, ...water.filter(v=>v!=null));
  $('chWater').innerHTML = barChart({ aria:'최근 7일 물', values:water, max:wMax, ticks:niceTicks(wMax, wMax>12?4:2), tickFmt:v=>`${v}`,
    valFmt:v=>`${v}`, cls:v=>'b-water'+(v>=g.water?' met':''), goal:g.water, goalLabel:`목표 ${g.water}잔`, labels })
    + `<div class="legend"><span><i style="background:var(--water)"></i>목표 채움</span><span><i style="background:var(--water-soft)"></i>모자람</span><span>단위: 잔</span></div>`;
  const cMax = Math.max(6, g.caffeine+2, ...caf.filter(v=>v!=null));
  $('chCaf').innerHTML = barChart({ aria:'최근 7일 카페인', values:caf, max:cMax, ticks:niceTicks(cMax, cMax>8?2:1).filter((v,i)=>cMax<=8?i%2===0:true), tickFmt:v=>`${v}`,
    valFmt:v=>`${v}`, cls:v=>'b-caf'+(v>g.caffeine?' over':''), goal:g.caffeine, goalLabel:`한도 ${g.caffeine}잔`, labels })
    + `<div class="legend"><span><i style="background:var(--caf)"></i>한도 안</span><span><i style="background:var(--caf-over)"></i>한도 넘음</span><span>단위: 잔</span></div>`;
}

/* =========================================================
   탭과 시작
   ========================================================= */
const SCREENS = { pet:'scr-pet', rec:'scr-rec', week:'scr-week' };
function switchTab(tab){
  Object.entries(SCREENS).forEach(([k,id])=>$(id).hidden = k!==tab);
  document.querySelectorAll('#tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===tab));
  if(tab==='week') renderWeek();
  if(switchTab._cur !== tab) window.scrollTo(0,0);   // 이미 보고 있는 탭이면 화면을 올리지 않는다
  switchTab._cur = tab;
}
document.querySelectorAll('#tabs [data-tab]').forEach(b=>b.addEventListener('click', ()=>switchTab(b.dataset.tab)));
function showApp(){
  $('onboard').hidden = true; $('app').hidden = false; $('tabs').hidden = false;
  renderPet(); resetForm(); renderList(); renderWeek(); switchTab('pet');
}
function boot(){
  S.profile = load(KEYS.profile, null);
  S.goals = load(KEYS.goals, null);
  S.baseline = load(KEYS.baseline, null);
  S.records = load(KEYS.records, {}) || {};
  if(!S.profile || !S.goals || !S.baseline){
    OB.step = 1; $('app').hidden = true; $('tabs').hidden = true; $('onboard').hidden = false; renderOnboard(); return;
  }
  showApp();
  setBubble(idleLine());
}
boot();
</script>

<script>
/* =========================================================
   2단계: 빠른 기록 5개 단추 · 카페인 · 시험 D-day 띠
   (1단계 코드는 그대로 두고 여기에만 더한다)
   ========================================================= */
KEYS.exams = 'habipet_exams';   // [{id, name, date, sample}]
KEYS.sleep = 'habipet_sleep';   // 자는 중이면 {since: ISO 시각}, 아니면 null
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
function dayDiff(a, b){ const [y1,m1,d1]=a.split('-').map(Number), [y2,m2,d2]=b.split('-').map(Number); return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000); }

/* ── 시험 일정 ── */
S.exams = load(KEYS.exams, null);
if(!Array.isArray(S.exams)){
  const t = today();
  S.exams = [ {id:'ex1', name:'운영체제', date:addDays(t,3), sample:true}, {id:'ex2', name:'데이터베이스', date:addDays(t,6), sample:true} ];
  save(KEYS.exams, S.exams);
}
const upcomingExams = () => S.exams.filter(e=>e.date>=today()).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
function renderDday(){
  const band = $('ddayBand'), up = upcomingExams();
  band.hidden = false; band.setAttribute('role','button'); band.tabIndex = 0;
  if(!up.length){
    band.className = 'dday none'; band.setAttribute('aria-label','시험 일정 추가');
    band.innerHTML = `<span>시험 일정을 넣어 보세요</span><span class="ghost sm">추가</span>`;
    return;
  }
  const e = up[0], d = dayDiff(today(), e.date);
  band.className = 'dday ' + (d<=1 ? 'hot' : d<=3 ? 'warn' : 'calm');
  band.setAttribute('aria-label', `${e.name} ${d===0?'오늘':d+'일 남음'}. 눌러서 시험 일정 관리`);
  band.innerHTML = `<b class="dd-num">${d===0?'D-DAY':'D-'+d}</b><div class="dd-txt"><span class="dd-name">${esc(e.name)}</span><small>${dateLabel(e.date)}${up.length>1?` · +${up.length-1}개`:''}</small></div>`;
}
function openExams(){ $('btnSettings').click(); const n=$('exName'); if(n){ n.scrollIntoView({block:'center'}); n.focus(); } }
$('ddayBand').addEventListener('click', openExams);
$('ddayBand').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openExams(); } });

// 설정 창이 열릴 때 '시험 일정' 칸을 채운다 (1단계의 설정 단추 처리 뒤에 실행)
$('btnSettings').addEventListener('click', ()=>{
  const box = $('settingsExtra'); if(!box) return;
  box.insertAdjacentHTML('beforeend', `<div class="card" style="padding:4px 14px" id="examSec">
    <h3 style="font-size:17px;padding-top:10px">시험 일정</h3>
    <div id="examList"></div>
    <div class="exam-add">
      <label class="field"><span>시험 이름</span><input type="text" id="exName" maxlength="20" autocomplete="off" placeholder="예: 자료구조"></label>
      <label class="field"><span>날짜</span><input type="date" id="exDate"></label>
      <div class="err" id="exErr"></div>
      <button class="primary" id="exAdd" type="button">시험 추가</button>
    </div></div>`);
  $('exDate').value = addDays(today(), 7);
  renderExamList();
  $('exAdd').addEventListener('click', ()=>{
    const name = $('exName').value.trim(), date = $('exDate').value;
    if(!name){ $('exErr').textContent='시험 이름을 적어 주세요'; return; }
    if(!date){ $('exErr').textContent='시험 날짜를 골라 주세요'; return; }
    if(date < today()){ $('exErr').textContent='오늘 이후 날짜를 골라 주세요'; return; }
    S.exams.push({ id:'ex'+Date.now(), name, date }); save(KEYS.exams, S.exams);
    $('exName').value=''; $('exErr').textContent=''; renderExamList(); renderDday(); toast(`${name} 시험을 넣었어요`);
  });
  $('examList').addEventListener('click', e=>{
    const b = e.target.closest('[data-exdel]'); if(!b) return;
    const id = b.dataset.exdel;
    if(b.dataset.armed){ S.exams = S.exams.filter(x=>x.id!==id); save(KEYS.exams,S.exams); renderExamList(); renderDday(); toast('시험을 지웠어요'); }
    else { b.dataset.armed='1'; b.textContent='정말 삭제'; b.classList.add('danger'); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent='삭제'; b.classList.remove('danger'); } }, 3000); }
  });
});
function renderExamList(){
  const el = $('examList'); if(!el) return;
  const list = S.exams.slice().sort((a,b)=>a.date<b.date?-1:1), t = today();
  el.innerHTML = list.length ? list.map(e=>{ const d=dayDiff(t,e.date);
    return `<div class="exam-row"><b>${esc(e.name)}</b><span class="num">${dateLabel(e.date)} · ${d<0?'끝남':d===0?'D-DAY':'D-'+d}</span>${e.sample?'<span class="tag">예시</span>':''}<button class="ghost sm" data-exdel="${e.id}">삭제</button></div>`; }).join('')
    : `<p class="hint" style="margin:6px 0">아직 시험이 없어요.</p>`;
}
// 시험 3일 전부터 수면 응원, 마지막 시험 다음 날은 축하
function examLine(){
  const up = upcomingExams(), t = today();
  if(up.length && dayDiff(t, up[0].date) <= 3) return '시험 전엔 최소 6시간은 자자!';

<script>
/* =========================================================
   3단계: 성장 — 경험치 · 레벨 · 진화 · 어른 모습 갈래
   (몬스터 그림·성격·말버릇·표정·시연용 단추는 따로 받아서 더한다)
   ========================================================= */
KEYS.awards = 'habipet_awards';  // { 'YYYY-MM-DD': {sleep:30, water:20, caf:10, rhythm:20, quest:15, penalty:-10} }
const EXP = { sleep:30, water:20, caf:10, rhythm:20, quest:15, penalty:-10 };
const EXP_LABEL = { sleep:'수면 목표', water:'물 목표', caf:'카페인 목표 지킴', rhythm:'리듬 안정', quest:'퀘스트 인증' };
S.awards = load(KEYS.awards, {}) || {};
function growthDefaults(){
  const p = S.profile; if(!p) return;
  if(p.sleepDays==null) p.sleepDays = 0;   // 수면 목표를 채운 날 수 → 어른 모습 갈래
  if(p.waterDays==null) p.waterDays = 0;   // 물 목표를 채운 날 수
  if(p.bestStreak==null) p.bestStreak = 0;
}
const circDiff = (a,b) => { let d = ((a-b)%1440+1440)%1440; return d>720 ? d-1440 : d; };
// 그날 일어난 시각이 앞선 7일 평균(기록이 2일 미만이면 시작 전 기상 시각)과 ±40분 안인가
function rhythmOK(date){
  const r = S.records[date]; if(!r || r.allNighter || !r.wake) return false;
  const prev = [];
  for(let i=1;i<=7;i++){ const p = S.records[addDays(date,-i)]; if(p && !p.sample && !p.allNighter && p.wake) prev.push(toMin(p.wake)); }
  let ref;
  if(prev.length >= 2){ const base = prev[0]; ref = base + prev.reduce((s,v)=>s+circDiff(v,base),0)/prev.length; }
  else ref = toMin(S.baseline.wake);
  return Math.abs(circDiff(toMin(r.wake), ref)) <= 40;
}
// 레벨은 내려가지 않는다. Lv10에서 멈춘다.
function addExp(n){
  const p = S.profile, beforeLv = p.level;
  if(n < 0){ p.exp = Math.max(0, p.exp + n); return {beforeLv, afterLv:p.level}; }
  if(p.level >= 10) return {beforeLv, afterLv:10};
  p.exp += n;
  while(p.exp >= 100 && p.level < 10){ p.exp -= 100; p.level++; }
  if(p.level >= 10) p.exp = 0;
  return {beforeLv, afterLv:p.level};
}
// 하루 한 번씩. 시작한 날 이전 날짜와 예시 기록은 경험치를 주지 않는다.
function evaluateDay(date){
  const r = S.records[date], g = S.goals, p = S.profile;
  if(!r || r.sample || date < p.createdAt || date > today()) return [];
  const a = S.awards[date] || (S.awards[date] = {}), got = [];
  const finished = date < today();
  const sm = sleepMinutes(r);
  if(!a.sleep && sm!=null && sm >= g.sleepMin){ a.sleep = EXP.sleep; p.sleepDays++; got.push('sleep'); }
  if(!a.water && r.water >= g.water){ a.water = EXP.water; p.waterDays++; got.push('water'); }
  if(!a.rhythm && rhythmOK(date)){ a.rhythm = EXP.rhythm; got.push('rhythm'); }
  if(finished && !a.caf && !a.penalty && cafOf(r) <= g.caffeine){ a.caf = EXP.caf; got.push('caf'); }
  if(finished && !a.penalty && !a.sleep && !a.water && !a.rhythm && !a.caf && !a.quest){ a.penalty = EXP.penalty; p.sickDate = addDays(date,1); got.push('penalty'); }
  if(!Object.keys(a).length) delete S.awards[date];
  return got.map(k=>({k, n:a[k]}));
}
let evolvingNow = false;
function runGrowth(opts){
  if(!S.profile || !S.goals) return;
  growthDefaults();
  const p = S.profile, startDate = p.createdAt;
  const all = [];
  for(let d = startDate; d <= today(); d = addDays(d,1)) evaluateDay(d).forEach(x=>all.push(x));
  if(!all.length){ renderStats(); return; }
  const fromStage = stageOf(p.level);
  let res = {beforeLv:p.level, afterLv:p.level};
  all.forEach(x=>{ const r = addExp(x.n); res.afterLv = r.afterLv; });
  const toStage = stageOf(p.level);
  if(fromStage==='baby' && toStage==='adult' && !p.form) p.form = p.waterDays > p.sleepDays ? 'drop' : 'sleepy';
  if(fromStage==='egg' && toStage==='adult' && !p.form) p.form = p.waterDays > p.sleepDays ? 'drop' : 'sleepy';
  save(KEYS.awards, S.awards); save(KEYS.profile, p);
  const plus = all.filter(x=>x.n>0), minus = all.filter(x=>x.n<0);
  const sum = plus.reduce((s,x)=>s+x.n,0);
  if(sum) toast(plus.length===1 ? `+${sum} EXP · ${EXP_LABEL[plus[0].k]}` : `+${sum} EXP · ${plus.map(x=>EXP_LABEL[x.k]).join(', ')}`);
  if(minus.length && !sum){ toast(`${EXP.penalty} EXP · 목표를 하나도 못 채운 날이 있었어요`); setBubble('으… 몸이 좀 무거워…'); }
  if(fromStage !== toStage) playEvolution(fromStage, toStage);
  else { renderPet(); if(res.afterLv > res.beforeLv) setBubble(res.afterLv>=10 ? `만렙! Lv10 달성!` : `레벨 업! Lv${res.afterLv} 달성!`); }
}
// 단계가 바뀔 때 2초 진화 연출 (펫 위 레이어에만 그린다)
function playEvolution(from, to){
  const name = S.profile.petName;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const done = ()=>{ evolvingNow=false; $('petLayer').classList.remove('evolving'); $('fxLayer').innerHTML=''; renderPet();
    setBubble(to==='baby' ? `알에서 나왔어! 나는 ${name}${iya(name)}` : `${name}${iya(name)==='이야'?'이가':'가'} 어른이 됐어! ${S.profile.form==='drop'?'물방울형':'잠꾸러기형'}이야`); };
  if(reduce){ done(); return; }
  evolvingNow = true;
  setBubble(to==='baby' ? '어…? 알이 흔들려!' : '몸이 반짝반짝해…!');
  const l = $('petLayer'); l.classList.remove('breathe','wobble'); void l.offsetWidth; l.classList.add('evolving');
  const spk = [[-90,-70],[90,-80],[-110,30],[110,20],[-40,-120],[50,110],[-70,100]].map(([x,y],i)=>`<i class="spk" style="--dx:${x}px;--dy:${y}px;animation-delay:${i*0.08}s"></i>`).join('');
  $('fxLayer').innerHTML = `<div class="evo"><div class="ring"></div>${spk}</div>`;
  setTimeout(done, 2000);
}
// 연속 달성: 수면·물 목표를 모두 채운 날이 이어진 수 (오늘을 아직 못 채웠으면 어제부터 센다)
function bothMet(d){ const r=S.records[d]; if(!r || r.sample) return false; const sm=sleepMinutes(r); return sm!=null && sm>=S.goals.sleepMin && r.water>=S.goals.water; }
function streakDays(){ let d = today(); if(!bothMet(d)) d = addDays(d,-1); let n=0; while(bothMet(d) && d >= S.profile.createdAt){ n++; d = addDays(d,-1); } return n; }
function daysToMax(){
  const p = S.profile; if(p.level>=10) return 0;
  const remain = (10-p.level)*100 - p.exp;
  const span = clamp(dayDiff(p.createdAt, today())+1, 1, 7);
  let sum = 0; for(let i=0;i<span;i++){ const a=S.awards[addDays(today(),-i)]; if(a) Object.values(a).forEach(v=>sum+=v); }
  const avg = sum/span;
  return avg > 0 ? Math.ceil(remain/avg) : null;
}
function renderStats(){
  if(!S.profile) return;
  growthDefaults();
  const st = streakDays(), p = S.profile;
  if(st > p.bestStreak){ p.bestStreak = st; save(KEYS.profile, p); }
  const dm = daysToMax();
  const row = $('statRow'); row.hidden = false;
  row.innerHTML = `<span class="chip soft">${p.level>=10 ? '만렙 달성!' : dm==null ? '만렙까지: 목표를 채우면 알려 줄게요' : `만렙까지 앞으로 ${dm}일쯤`}</span>
    <span class="chip soft">연속 달성 ${st}일</span>`;
}
const _renderPet1 = renderPet;
renderPet = function(){ if(evolvingNow) return; _renderPet1(); renderStats(); };
// 아기 때부터 어른 모습 힌트
const _idleLine2 = idleLine;
idleLine = function(){
  const p = S.profile;
  if(stageOf(p.level)==='baby' && Math.random()<0.4) return p.waterDays > p.sleepDays ? '물방울 기운이 강해지고 있어…!' : '스르르… 졸음 기운이 강해지고 있어';
  if(p.sickDate===today() && Math.random()<0.5) return '으… 어제는 몸이 좀 무거웠어';
  return _idleLine2();
};
// 기록이 바뀔 때마다 성장 확인
$('recForm').addEventListener('submit', ()=>setTimeout(runGrowth, 0));
const _afterQuick1 = afterQuick;
afterQuick = function(){ _afterQuick1(); runGrowth(); };
const _showApp2 = showApp;
showApp = function(){ _showApp2(); runGrowth(); };
if(!$('app').hidden){ runGrowth(); renderStats(); }
setInterval(()=>{ if(!$('app').hidden) runGrowth(); }, 60000);   // 자정이 지나면 어제의 카페인·벌점 판정
</script>

};

const _quickDrink1 = quickDrink;

  <rect width="400" height="400" fill="url(#mornSky)"/><g class="sunrise"><circle cx="320" cy="96" r="30" fill="#FFD36B" stroke="${LINE}" stroke-width="2"/>${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<path d="M${(320+40*Math.cos(r)).toFixed(1)} ${(96+40*Math.sin(r)).toFixed(1)}L${(320+50*Math.cos(r)).toFixed(1)} ${(96+50*Math.sin(r)).toFixed(1)}" stroke="${LINE}" stroke-width="2.5" stroke-linecap="round"/>`;}).join('')}</g>

// 잠자기: 항상 나무 침대. 펫 그림을 복사하지 않고 침대 안 .pr-sleeper에 눈 감은 콩알이를 새로 그린다.

      <div class="pr-z"><svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">${[['Z',6,54,22,0],['z',24,34,17,1],['z',40,16,13,2]].map(([t,x,y,s,i])=>`<text class="fx-a zzz" style="animation-delay:${i*.9}s" x="${x}" y="${y}" font-family="Jua, sans-serif" font-size="${s}" fill="#FFF6D8" stroke="${LINE}" stroke-width=".8">${t}</text>`).join('')}</svg></div></div>`
  };
}
function zzz(){ return [['Z',150,70,22,0],['z',166,48,17,1],['z',178,30,13,2]].map(([t,x,y,s,i])=>`<text class="fx-a zzz" style="animation-delay:${i*.9}s" x="${x}" y="${y}" font-family="Jua, sans-serif" font-size="${s}" fill="#FFF6D8" stroke="${LINE}" stroke-width=".8">${t}</text>`).join(''); }
function sleepText(){ const st = sleepState(); if(!st) return 'Z z z…'; const m = Math.max(0, Math.round((Date.now()-new Date(st.since))/60000)); return `Z z z… ${m<60 ? m+'분' : fmtHM(m)}째 쿨쿨`; }
function startSleepScene(opts){
  opts = opts || {};
  scene = 'sleep';
  clearInterval(sleepTick);
  sleepTick = setInterval(()=>{ if(scene==='sleep' && Date.now()-_lastManualBubble > 8000) _setBubble1(sleepText()); }, 20000);
  const apply = ()=>{
    if(scene!=='sleep') return;
    setBubble(sleepText());
    if(reduced()) return;   // 움직임 줄이기: 말풍선만
    const L = sleepLayers();
    $('sceneBg').innerHTML = NIGHT; $('sceneBg').classList.add('on');
    $('fxBack').innerHTML = L.back; $('fxLayer').innerHTML = L.front;
    $('petLayer').classList.add('sleep-hidden');   // 평소 펫은 숨기고 침대 안 콩알이만 보인다
  };

  else { setBubble('하암…'); petAnim('yawn', 900); setTimeout(apply, 950); }
}
function clearScene(){

}
/* ── 일어나기 ── */
function endSleepScene(){

    panel.innerHTML = `<p>일어났을 때 얼마나 개운해요?</p><div class="fresh">${[1,2,3,4,5].map(v=>`<button type="button" data-wf="${v}" aria-label="개운함 ${v}점">${v}</button>`).join('')}</div><div class="fresh-cap"><span>1 너무 피곤</span><span>5 아주 개운</span></div><button type="button" class="ghost sm" data-wf-skip style="align-self:center">건너뛰기</button>`;
    $('petStage').appendChild(panel);
    panel.addEventListener('click', e=>{
      const b = e.target.closest('[data-wf]'); if(!b) return;
      const v = Number(b.dataset.wf), r = todayRecord(); r.fresh = v; afterQuick();
      panel.remove();
      const p = S.profile, mood = v<=1 ? 'gloomy' : v===2 ? 'sleepy' : v===3 ? 'normal' : 'happy';
      $('petLayer').innerHTML = drawPet(p.species, stageOf(p.level), p.form||null, mood, p.level);   // 점수에 맞는 표정
      const sm = sleepMinutes(r);
      setBubble(sm!=null && sm >= S.goals.sleepMin ? '푹 잤다!' : '조금만 더 자고 싶어…');
      if(!reduced() && v>=4) petAnim('jump', 1400);
      setTimeout(()=>{ if(scene==='wake'){ clearScene(); renderPet(); setBubble(idleLine()); } }, 2000);
    });
  };
  // 일어나기 연출: ① 쿨쿨 → ② 눈 비비기 → ③ 기지개+하품 → ④ 갈래별 인사 (약 4초), 끝나면 개운함 고르기
  const info = getPetInfo();
  if(typeof playWakeGesture==='function' && typeof startWakeRun==='function'){
    startWakeRun(ask);
    endWakeRunAfter(playWakeGesture(info.branch, info.stage));
    return;
  }
  clearScene(); scene='wake'; ask();
}
const _sleepNow1 = sleepNow;
sleepNow = function(){ const was = sleepState(); _sleepNow1(); if(!was && sleepState()) startSleepScene(); };
const _wakeNow1 = wakeNow;
wakeNow = function(){
  const st = sleepState(), tooShort = st && (Date.now()-new Date(st.since))/60000 < 5;
  _wakeNow1();
  if(tooShort){ clearScene(); renderPet(); return; }

// 자는 동안 펫을 누르면
$('petLayer').addEventListener('click', ()=>{ if(scene==='sleep') setBubble('음냐… 조금만 더…'); });

$('btnSettings').addEventListener('click', ()=>{

      <button type="button" class="toggle" id="tgReduce" aria-pressed="${!!S.prefs.reduceMotion}" style="min-width:72px;text-align:center">${S.prefs.reduceMotion?'켜짐':'꺼짐'}</button></div></div>`);
  $('tgReduce').addEventListener('click', e=>{
    S.prefs.reduceMotion = !S.prefs.reduceMotion; save(KEYS.prefs, S.prefs); applyCalm();
    e.currentTarget.setAttribute('aria-pressed', S.prefs.reduceMotion); e.currentTarget.textContent = S.prefs.reduceMotion?'켜짐':'꺼짐';
    if(scene==='sleep'){ const keep = scene; clearScene(); startSleepScene({instant:true}); }

// 앱을 다시 열었을 때 자는 중이면 계속 잔다
setTimeout(()=>{ if(!$('app').hidden && sleepState()) startSleepScene({instant:true}); }, 0);   // 콩알이 그림 코드가 다 읽힌 뒤에

<script>
/* =========================================================
   5단계: 리듬 안정도 · 개운함 · 한 줄 발견 · 시작 전 비교 (일주일 화면 #weekExtra)
   ========================================================= */
const hmText = m => { m = ((Math.round(m)%1440)+1440)%1440; return `${pad(Math.floor(m/60))}:${pad(m%60)}`; };
const avg = a => a.length ? a.reduce((s,v)=>s+v,0)/a.length : null;
const spreadText = m => m < 60 ? `±${Math.round(m)}분` : `±${fmtHM(Math.round(m/10)*10)}`;
// 시각 목록의 평균과 흔들림(표준편차) — 밤 12시를 넘나들어도 맞게
function timeStats(mins){
  if(mins.length < 1) return null;
  const base = mins[0], diffs = mins.map(v=>circDiff(v, base)), md = avg(diffs);
  const sd = Math.sqrt(avg(diffs.map(d=>(d-md)*(d-md))));
  return { mean: base + md, sd };
}
function rhythmClass(sd){ return sd <= 40 ? ['stable','안정'] : sd <= 90 ? ['mid','보통'] : ['unstable','불안정']; }
function last7(){ const t = today(), days = []; for(let i=6;i>=0;i--) days.push(addDays(t,-i)); return days; }

function dotChart(days){
  const W=340, H=236, L=42, R=10, T=12, B=50, iw=W-L-R, ih=H-T-B, slot=iw/7;
  const v = m => (m - 1080 + 1440) % 1440;   // 저녁 6시를 0으로 놓고 다음 날 오후까지 한 줄로
  const recs = days.map(d=>S.records[d]||null);
  const vals = [];
  recs.forEach(r=>{ if(r && !r.allNighter){ if(r.bed) vals.push(v(toMin(r.bed))); if(r.wake) vals.push(v(toMin(r.wake))); } });
  let lo = vals.length ? Math.min(...vals) : 240, hi = vals.length ? Math.max(...vals) : 960;
  lo = Math.floor((lo-30)/60)*60; hi = Math.ceil((hi+30)/60)*60;
  if(hi-lo < 360){ const c=(hi+lo)/2; lo = Math.floor((c-180)/60)*60; hi = lo+360; }
  lo = Math.max(0, lo); hi = Math.min(1440, hi);
  const y = val => T + (val-lo)/(hi-lo)*ih;
  const step = hi-lo > 720 ? 180 : 120;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 7일 잠든 시각과 일어난 시각">`;
  const wakes = recs.filter(r=>r && !r.allNighter && r.wake).map(r=>toMin(r.wake)), ws = wakes.length>=3 ? timeStats(wakes) : null;
  if(ws){ const a = clamp(v(ws.mean - ws.sd), lo, hi), b = clamp(v(ws.mean + ws.sd), lo, hi); if(b>a) s += `<rect class="d-band" x="${L}" y="${y(a).toFixed(1)}" width="${iw}" height="${(y(b)-y(a)).toFixed(1)}" rx="4"/>`; }
  for(let t = Math.ceil(lo/step)*step; t <= hi; t += step){
    const hr = Math.round(((t+1080)/60)) % 24;
    s += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L-6}" y="${y(t)+3.5}" text-anchor="end">${pad(hr)}시</text>`;
  }
  recs.forEach((r,i)=>{
    const cx = L + slot*i + slot/2, lab = shortLabel(days[i]);
    if(!r){ s += `<text class="ax" x="${cx}" y="${T+ih/2}" text-anchor="middle">–</text>`; }
    else if(r.allNighter){ s += `<text class="vl" x="${cx}" y="${T+ih/2}" text-anchor="middle">밤샘</text>`; }
    else {
      const b = r.bed ? v(toMin(r.bed)) : null, w = r.wake ? v(toMin(r.wake)) : null;
      if(b!=null && w!=null && w>b) s += `<line class="d-span" x1="${cx}" x2="${cx}" y1="${y(b).toFixed(1)}" y2="${y(w).toFixed(1)}"/>`;
      if(b!=null) s += `<circle class="d-bed" cx="${cx}" cy="${y(b).toFixed(1)}" r="5.5"><title>잠든 시각 ${r.bed}</title></circle>`;
      if(w!=null) s += `<circle class="d-wake" cx="${cx}" cy="${y(w).toFixed(1)}" r="5.5"><title>일어난 시각 ${r.wake}</title></circle>`;
    }
    s += `<text class="ax" x="${cx}" y="${H-B+15}" text-anchor="middle">${lab.md}</text><text class="ax" x="${cx}" y="${H-B+27}" text-anchor="middle">${lab.wd}</text>`;
    s += `<text class="vl" x="${cx}" y="${H-B+44}" text-anchor="middle">${r && r.fresh ? r.fresh : '·'}</text>`;
  });
  s += `<text class="ax" x="${L-6}" y="${H-B+44}" text-anchor="end">개운함</text>`;
  return s + '</svg>';
}

function findingLine(){
  const all = Object.values(S.records);
  const withFresh = all.filter(r=>r.fresh && sleepMinutes(r)!=null);
  const fmt1 = n => n.toFixed(1);
  // 1) 잔 시간과 개운함
  const short = withFresh.filter(r=>sleepMinutes(r) < 360), long = withFresh.filter(r=>sleepMinutes(r) >= 420);
  if(short.length && long.length) return { text:`6시간 미만 잔 날의 개운함 평균 ${fmt1(avg(short.map(r=>r.fresh)))}점, 7시간 이상은 ${fmt1(avg(long.map(r=>r.fresh)))}점`, note:`6시간 미만 ${short.length}일 · 7시간 이상 ${long.length}일 기록 기준` };
  // 2) 늦은 카페인과 다음 날 수면
  const late = [], early = [];
  all.forEach(r=>{ const nx = S.records[addDays(r.date,1)]; const sm = nx ? sleepMinutes(nx) : null; if(sm==null || !cafOf(r)) return; (r.lastCaffeine && r.lastCaffeine >= '15:00' ? late : early).push(sm); });
  if(late.length && early.length) return { text:`오후 3시 이후 카페인을 마신 다음 날은 평균 ${fmtHM(avg(late))}, 일찍 끊은 다음 날은 ${fmtHM(avg(early))} 잤어요`, note:`${late.length + early.length}일 기록 기준` };
  // 3) 물과 개운함
  const wy = withFresh.filter(r=>r.water >= S.goals.water), wn = withFresh.filter(r=>r.water < S.goals.water);
  if(wy.length && wn.length) return { text:`물 목표를 채운 날의 개운함 평균 ${fmt1(avg(wy.map(r=>r.fresh)))}점, 못 채운 날은 ${fmt1(avg(wn.map(r=>r.fresh)))}점`, note:`${wy.length + wn.length}일 기록 기준` };
  return { text:'기록이 조금 더 쌓이면 내 생활에서 찾은 발견을 알려 줄게요', note:'잔 시간과 개운함을 함께 적은 날이 필요해요' };
}

function renderWeekExtra(){
  if(!S.goals || !S.baseline) return;
  const days = last7(), recs = days.map(d=>S.records[d]).filter(Boolean);
  // 리듬 안정도
  const wakes = recs.filter(r=>!r.allNighter && r.wake).map(r=>toMin(r.wake));
  const beds = recs.filter(r=>!r.allNighter && r.bed).map(r=>toMin(r.bed));
  const ws = wakes.length>=3 ? timeStats(wakes) : null, bs = beds.length>=3 ? timeStats(beds) : null;
  const rc = ws ? rhythmClass(ws.sd) : ['none','기록 부족'];
  const fr = recs.filter(r=>r.fresh).map(r=>r.fresh);
  const rhythm = `<div class="card chart-card">
      <div class="rhythm-head"><h3>잠든·일어난 시각</h3><span class="pill ${rc[0]}">${rc[1]}</span></div>
      <p class="hint" style="margin:0 0 4px">${ws ? `일어난 시각 흔들림 <b class="num" style="color:var(--ink)">${spreadText(ws.sd)}</b> · 평균 ${hmText(ws.mean)} 기상` : '일어난 시각이 3일 이상 있어야 리듬을 볼 수 있어요'}${bs ? ` · 평균 ${hmText(bs.mean)} 취침` : ''}</p>
      ${dotChart(days)}
      <div class="legend"><span><i style="background:var(--sleep)"></i>잠든 시각</span><span><i style="background:var(--sun)"></i>일어난 시각</span>${ws?'<span><i style="background:var(--band);border-color:transparent"></i>기상 시각 흔들림 범위</span>':''}</div>
      <p class="hint" style="margin:6px 0 0">±40분 안이면 안정, ±1시간 30분을 넘으면 불안정이에요.${fr.length ? ` 최근 7일 개운함 평균 <b class="num" style="color:var(--ink)">${avg(fr).toFixed(1)}점</b>.` : ''}</p>
    </div>`;
  // 한 줄 발견
  const f = findingLine();
  const find = `<div class="card find"><svg class="bulb" viewBox="0 0 34 34" fill="none" stroke="#5A4A42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 5a9 9 0 0 0-5 16.5V25h10v-3.5A9 9 0 0 0 17 5z" fill="#FFE29A"/><path d="M13 29h8M14 25v-4M20 25v-4"/></svg><div><h3 style="font-size:16px;margin-bottom:2px">한 줄 발견</h3><p>${f.text}</p><small>${f.note}</small></div></div>`;
  // 시작 전 비교

    [-7, 7].forEach((x) => { o += L('M' + (x - 4) + ',' + (ey + 1) + ' Q' + x + ',' + (ey - 3.5) + ' ' + (x + 4) + ',' + (ey + 1), '#2E2622', 2); });
    o += '<circle cx="-14" cy="' + (ey + 6) + '" r="5" fill="#FFAFC3" opacity=".9"/><circle cx="14" cy="' + (ey + 6) + '" r="5" fill="#FFAFC3" opacity=".9"/>';
    if (canMouth) { coverMouth(); o += '<circle cx="0" cy="' + (my + .5) + '" r="2.4" fill="#2E2622"/>'; }
  } else if (type === 'coffee') {
    [-7, 7].forEach((x) => { o += '<circle cx="' + x + '" cy="' + ey + '" r="4.6" fill="#FFFFFF" stroke="#2E2622" stroke-width="1.6"/><circle cx="' + x + '" cy="' + ey + '" r="1.9" fill="#2E2622"/>'; });
    o += L('M-11,' + (ey - 8) + ' Q-7,' + (ey - 11) + ' -3,' + (ey - 8), '#5A4A42', 1.6) + L('M3,' + (ey - 8) + ' Q7,' + (ey - 11) + ' 11,' + (ey - 8), '#5A4A42', 1.6);
    if (canMouth) { coverMouth(); o += '<ellipse cx="0" cy="' + (my + .5) + '" rx="1.8" ry="2.2" fill="#2E2622"/>'; }
    o += '<path d="M22,-26 L22,-16 M22,-12 L22,-11" stroke="#E5A400" stroke-width="2.6" stroke-linecap="round"/>';
  } else if (type === 'energy') {
    [-7, 7].forEach((x) => { o += '<path d="M' + x + ',' + (ey - 5) + ' L' + (x + 1.6) + ',' + (ey - 1.6) + ' L' + (x + 5) + ',' + ey + ' L' + (x + 1.6) + ',' + (ey + 1.6) + ' L' + x + ',' + (ey + 5) + ' L' + (x - 1.6) + ',' + (ey + 1.6) + ' L' + (x - 5) + ',' + ey + ' L' + (x - 1.6) + ',' + (ey - 1.6) + ' Z" fill="#FFD045" stroke="#2E2622" stroke-width="1.2" stroke-linejoin="round"/>'; });
    if (canMouth) { coverMouth(); o += '<path d="M-4.5,' + (my - 1.5) + ' L4.5,' + (my - 1.5) + ' Q4.5,' + (my + 4) + ' 0,' + (my + 4) + ' Q-4.5,' + (my + 4) + ' -4.5,' + (my - 1.5) + ' Z" fill="#FF8FA8" stroke="#2E2622" stroke-width="1.4" stroke-linejoin="round"/>'; }
    o += '<path d="M26,-30 L20,-18 L25,-18 L21,-8 L30,-21 L25,-21 Z" fill="#FFE07A" stroke="#5A4A42" stroke-width="1.2" stroke-linejoin="round"/>';
  }
  const i = svg.lastIndexOf('</g></svg>');
  return svg.slice(0, i) + '<g transform="scale(' + sx + ' ' + sy + ')">' + o + '</g>' + svg.slice(i);
}
// 지금 펫의 갈래와 단계 (갈래가 아직 안 정해졌으면 basic)
window.getPetInfo = function(){
  const p = (typeof S !== 'undefined' && S.profile) || null;
  return { branch: (p && p.branch && KONG_COLOR[p.branch]) ? p.branch : 'basic', stage: p ? stageOf(p.level) : 'baby' };
};

<script>
/* =========================================================
   콩알이 연결 — 갈래 정하기 · 꼬질/덜덜 상태 · 진화 · 확인용 단추
   ========================================================= */
const KONG_NAME = { basic:'기본', cat:'고양이', dog:'강아지', peng:'펭귄', ham:'햄스터', owl:'부엉이', sleepy:'잠꾸러기', sparkle:'반짝이' };
const KONG_HINT = { basic:'아직 어떤 모습이 될지 모르겠어…', cat:'냥 귀 기운이 강해지고 있어', dog:'멍 귀 기운이 강해지고 있어', peng:'뒤뚱뒤뚱 펭 기운이 강해지고 있어',
  ham:'볼주머니 기운이 강해지고 있어', owl:'부엉 깃털 기운이 강해지고 있어', sleepy:'스르르… 수면 모자 기운이 강해지고 있어', sparkle:'반짝반짝 별 기운이 강해지고 있어…!' };
const KONG_STAGE_NAME = { baby:'아기', child:'어린이', teen:'청소년', adult:'성인' };
const KONG_STATE_LINE = { dirty:'나 좀… 씻겨 줘…', jitter:'시, 심장이… 콩닥콩닥…' };

// 펫은 여전히 drawPet 하나에서만 그린다. 알 그림은 처음 시작 화면(알 고르기)에서만 쓴다.
const _drawPet1 = drawPet;
drawPet = function(species, stage, form, mood, level){
  try{
    if(stage === 'egg') return _drawPet1(species, stage, form, mood, level);
    const p = S.profile;
    const branch = (p && p.branch) || (KONG_COLOR[form] ? form : 'basic');
    const state = (mood==='dirty' || mood==='jitter') ? mood : ((p && p.kongState) || 'normal');
    return drawKongari(branch, stage, state, 200);
  }catch(e){ return EGG_FALLBACK; }
};

/* ── 갈래 정하기: Lv4가 되는 순간, 시작한 날부터 지금까지(Lv1~3)의 기록으로 ── */
function babyDays(){ return Object.values(S.records).filter(r=>!r.sample && r.date >= S.profile.createdAt && r.date <= today()); }
function branchScores(){
  const rs = babyDays(), g = S.goals, n = rs.length;
  const sleepMet = r => { const m = sleepMinutes(r); return m!=null && m >= g.sleepMin; };
  const beds = rs.filter(r=>!r.allNighter && r.bed).map(r=>toMin(r.bed));
  const wakes = rs.filter(r=>!r.allNighter && r.wake).map(r=>toMin(r.wake));
  const bs = beds.length>=2 ? timeStats(beds) : null, ws = wakes.length>=2 ? timeStats(wakes) : null;
  const sc = {
    cat:   rs.filter(sleepMet).length,
    dog:   rs.filter(r=>!r.allNighter && r.wake && toMin(r.wake) <= 420).length,          // 7시 전에 일어난 날
    peng:  rs.filter(r=>r.water >= g.water).length,
    ham:   rs.filter(r=>r.date < today() && cafOf(r) <= g.caffeine).length,               // 끝난 날만
    owl:   bs ? beds.filter(b=>Math.abs(circDiff(b, bs.mean)) <= 30).length : 0,          // 평균 취침 ±30분 안
    sleepy:rs.filter(r=>sleepMet(r) && Number(r.napMin) >= 20).length
  };
  const rate = k => n ? sc[k]/n : 0;
  const sparkle = n >= 3 && rate('cat') >= .7 && rate('peng') >= .7 && rate('ham') >= .7 && ws && ws.sd <= 40;
  return { sc, n, sparkle };
}
function decideBranch(){
  const { sc, n, sparkle } = branchScores();
  if(sparkle) return 'sparkle';
  let best = 'basic', top = 0;
  ['sleepy','cat','dog','peng','ham','owl'].forEach(k=>{ if(sc[k] > top){ top = sc[k]; best = k; } });   // 같으면 앞쪽 우선
  return (n >= 2 && top/n >= .5) ? best : 'basic';   // 절반도 못 넘으면 뚜렷한 습관 없음
}
function ensureBranch(){
  const p = S.profile; if(!p || p.branch || stageOf(p.level)==='baby') return;
  p.branch = decideBranch(); p.form = p.branch; save(KEYS.profile, p);
}

/* ── 진화 연출 (단계가 바뀔 때 2초) ── */
playEvolution = function(from, to){
  const p = S.profile, name = p.petName;
  if(to !== 'baby' && !p.branch){ p.branch = decideBranch(); p.form = p.branch; save(KEYS.profile, p); }
  const msg = to==='child' ? `나 이렇게 컸어! ${KONG_NAME[p.branch]} 콩알이야` : to==='teen' ? '또 컸어! 이제 청소년이야' : to==='adult' ? `다 컸어! 어른 ${KONG_NAME[p.branch]} 콩알이야` : `나는 ${name}${iya(name)}`;
  const done = ()=>{ evolvingNow=false; $('petLayer').classList.remove('evolving'); $('fxLayer').innerHTML=''; renderPet(); setBubble(msg); };
  if(reduced() || scene==='sleep'){ done(); return; }
  evolvingNow = true;
  setBubble('몸이 반짝반짝해…!');
  const l = $('petLayer'); l.classList.remove('breathe','wobble'); void l.offsetWidth; l.classList.add('evolving');
  const spk = [[-90,-70],[90,-80],[-110,30],[110,20],[-40,-120],[50,110],[-70,100]].map(([x,y],i)=>`<i class="spk" style="--dx:${x}px;--dy:${y}px;animation-delay:${i*0.08}s"></i>`).join('');
  $('fxLayer').innerHTML = `<div class="evo"><div class="ring"></div>${spk}</div>`;
  setTimeout(done, 2000);
};

/* ── 꼬질(dirty) · 덜덜(jitter) 상태 ── */
function realRec(d){ const r = S.records[d]; return (r && !r.sample && d >= S.profile.createdAt && d > (S.profile.recoveredOn||'')) ? r : null; }
function noneMet(r){ const m = sleepMinutes(r); return !(m!=null && m >= S.goals.sleepMin) && !(r.water >= S.goals.water); }
function cafOver(r){ return cafOf(r) > S.goals.caffeine; }
function dayKept(d, st){
  const r = S.records[d]; if(!r || r.sample) return false;
  if(st==='dirty'){ const m = sleepMinutes(r); return m!=null && m >= S.goals.sleepMin && r.water >= S.goals.water; }
  return d < today() && cafOf(r) <= S.goals.caffeine;    // 덜덜: 하루가 끝나야 '지켰다'
}
function keptStreak(){
  const p = S.profile, st = p.kongState; let d = today(), n = 0;
  if(!dayKept(d, st)) d = addDays(d,-1);
  while(d >= p.stateSince && dayKept(d, st)){ n++; d = addDays(d,-1); }
  return n;
}
function enterState(st){
  const p = S.profile; p.kongState = st; p.stateSince = today(); save(KEYS.profile, p);
  renderPet(); setBubble(KONG_STATE_LINE[st]);
}
function updateKongState(){
  const p = S.profile; if(!p || !S.goals) return;
  const t = today();
  if(!p.kongState || p.kongState==='normal'){
    const y1 = realRec(addDays(t,-1)), y2 = realRec(addDays(t,-2)), y3 = realRec(addDays(t,-3)), r0 = realRec(t);
    // 덜덜: 커피·에너지 드링크 목표를 이틀 연속 넘김
    if((r0 && y1 && cafOver(r0) && cafOver(y1)) || (y1 && y2 && cafOver(y1) && cafOver(y2))){ enterState('jitter'); return; }
    // 꼬질: 최근 3일(끝난 날) 중 2일 이상 수면·물 목표를 하나도 못 채움
    if([y1,y2,y3].filter(r=>r && noneMet(r)).length >= 2){ enterState('dirty'); return; }
    return;
  }
  // 3일 연속 목표를 지키면 원래 모습으로
  if(keptStreak() >= 3){
    p.kongState = 'normal'; p.recoveredOn = t; p.coins = (p.coins||0) + 30; save(KEYS.profile, p);
    renderPet(); setBubble('다시 반짝반짝해졌어! 고마워!'); toast('+30 코인 · 원래 모습으로 돌아왔어요');
    if(!reduced()){ $('fxLayer').innerHTML = fxSVG(sparkles()); petAnim('jump', 1400); setTimeout(()=>{ if(scene!=='sleep') $('fxLayer').innerHTML=''; }, 1600); }
  }
}
// 꼬질·덜덜 상태에서는 경험치 절반
const _addExp2 = addExp;
addExp = function(n){ const st = S.profile && S.profile.kongState; if(n>0 && st && st!=='normal') n = Math.ceil(n/2); return _addExp2(n); };
const _runGrowth1 = runGrowth;
runGrowth = function(o){ if(!S.profile || !S.goals) return; updateKongState(); _runGrowth1(o); ensureBranch(); updateKongState(); };

// 펫 화면: "원래 모습까지 ○일"
const _renderStats1 = renderStats;
renderStats = function(){
  _renderStats1();
  const p = S.profile; if(!p || !p.kongState || p.kongState==='normal') return;
  const left = Math.max(1, 3 - keptStreak());
  $('statRow').insertAdjacentHTML('beforeend', `<span class="chip state">${p.kongState==='dirty'?'꼬질꼬질':'덜덜'} · 원래 모습까지 ${left}일</span>`);
};
// 말풍선: 아기 때 갈래 힌트, 꼬질 상태 대사
const _idleLine3 = idleLine;
idleLine = function(){
  const p = S.profile;
  if(p.kongState && p.kongState!=='normal' && Math.random()<0.5) return KONG_STATE_LINE[p.kongState];
  if(stageOf(p.level)==='baby'){ if(Math.random()<0.4) return KONG_HINT[decideBranch()]; return _idleLine2(); }   // 예전 '물방울 기운' 힌트 대신
  return _idleLine3();
};

/* ── 설정: 확인용 단추 ── */
$('btnSettings').addEventListener('click', ()=>{
  const box = $('settingsExtra'); if(!box) return;
  box.insertAdjacentHTML('beforeend', `<div class="card" style="padding:4px 14px;margin-top:14px">
    <h3 style="font-size:17px;padding-top:10px">확인용</h3>
    <div class="demo-btns">
      <button type="button" class="ghost sm" id="dmPreview">모든 콩알이 미리보기</button>
      <button type="button" class="ghost sm" id="dmDirty">꼬질 상태 만들기</button>
      <button type="button" class="ghost sm" id="dmJitter">덜덜 상태 만들기</button>
    </div></div>`);
  $('dmDirty').addEventListener('click', ()=>{ closeSheet(); switchTab('pet'); enterState('dirty'); renderStats(); });
  $('dmJitter').addEventListener('click', ()=>{ closeSheet(); switchTab('pet'); enterState('jitter'); renderStats(); });
  $('dmPreview').addEventListener('click', openKongPreview);
});
function openKongPreview(){
  const cell = (svg, label) => `<div class="kcell">${svg}<span>${label}</span></div>`;
  let html = `<div class="kgroup">아기 (Lv1~3)</div><div class="kgrid">${cell(drawKongari('basic','baby','normal',84),'아기')}</div>`;
  Object.keys(KONG_COLOR).forEach(b=>{
    html += `<div class="kgroup">${KONG_NAME[b]}${b==='sparkle'?' (희귀)':''}</div><div class="kgrid">` +
      ['child','teen','adult'].map(s=>cell(drawKongari(b,s,'normal',84), KONG_STAGE_NAME[s])).join('') + `</div>`;
  });
  html += `<div class="kgroup">꼬질·덜덜 상태 예시</div><div class="kgrid k4">${cell(drawKongari('basic','baby','dirty',84),'아기 꼬질')}${cell(drawKongari('cat','adult','dirty',84),'냥 귀 꼬질')}${cell(drawKongari('basic','baby','jitter',84),'아기 덜덜')}${cell(drawKongari('ham','adult','jitter',84),'햄 볼 덜덜')}</div>`;
  const pi = getPetInfo();
  html += `<div class="kgroup">표정 7가지 (지금 갈래: ${KONG_NAME[pi.branch]} ${KONG_STAGE_NAME[pi.stage]})</div><div class="kgrid k4">` +
    [['normal','보통'],['happy','신남'],['sleepy','졸림'],['thirsty','목마름'],['darkcircle','다크서클'],['dizzy','어지러움'],['sad','시무룩']].map(([m,l])=>cell(drawKongariMood(pi.branch, pi.stage, m, 84), l)).join('') + `</div>`;
  html += `<div class="kgroup">음료 표정 (지금 갈래: ${KONG_NAME[pi.branch]} ${KONG_STAGE_NAME[pi.stage]})</div><div class="kgrid k4">` +
    [['water','물'],['coffee','커피'],['energy','에너지 드링크']].map(([t,l])=>cell(drawKongariDrink(pi.branch, pi.stage, t, 84), l)).join('') +
    cell(drawKongariMood(pi.branch, pi.stage, 'dizzy', 84), '오후 3시 뒤 카페인') + `</div>`;
  openSheet('모든 콩알이 미리보기', html);
}

// 시작
if(!$('app').hidden){ ensureBranch(); updateKongState(); renderPet(); }
</script>

<script>
/* =========================================================
   6단계: 여행 · 알 상점 · 도감 (8갈래 성인 8칸) + 시연용 단추
   ========================================================= */
KEYS.dex = 'habipet_dex';   // { entries:[{branch, name, graduatedOn, days, avgSleep, water, bestStreak}], crown:false }
S.dex = load(KEYS.dex, null) || { entries:[], crown:false };
const KONG_ABOUT = {
  basic:  { trait:'평범하지만 꾸준한 친구', say:'오늘도 천천히, 꾸준히!', hint:'뚜렷한 습관 없이 자라면 만날 수 있어요' },
  cat:    { trait:'잠을 사랑하는 느긋한 고양이', say:'잠은 많이 잘수록 좋다냥', hint:'수면 목표를 가장 많이 채우면…' },
  dog:    { trait:'아침마다 꼬리 흔드는 부지런쟁이', say:'일어났어? 오늘도 힘차게!', hint:'일찍 일어난 날이 가장 많으면…' },
  peng:   { trait:'물이라면 언제든 환영인 펭귄', say:'물 한 잔 더! 뒤뚱뒤뚱', hint:'물 목표를 가장 많이 채우면…' },
  ham:    { trait:'카페인을 조심하는 볼빵빵 햄스터', say:'커피는 딱 정한 만큼만!', hint:'커피·에너지 드링크 목표를 가장 많이 지키면…' },
  owl:    { trait:'늘 같은 시간에 잠드는 밤의 부엉이', say:'오늘도 제시간에 눈 감자', hint:'잠든 시각이 가장 일정하면…' },
  sleepy: { trait:'낮잠까지 챙기는 꿈나라 여행가', say:'낮잠은 보약이야… 쿨…', hint:'수면 목표를 채우고 낮잠도 자 주면…' },
  sparkle:{ trait:'모든 목표를 챙기는 희귀한 반짝이', say:'우리 정말 반짝반짝하다!', hint:'(희귀) 모든 목표 70% 이상 + 리듬 일정' }
};
const isEmpty = () => !!(S.profile && S.profile.empty);

/* ── 빈 둥지 ── */
const NEST_SVG = `<svg class="empty-nest" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg"><ellipse cx="100" cy="206" rx="70" ry="8" fill="#000" opacity=".1"/>
  <ellipse cx="100" cy="168" rx="74" ry="20" fill="#B98A5E" stroke="#5A4A42" stroke-width="2"/><ellipse cx="100" cy="164" rx="54" ry="11" fill="#8E6440"/>
  <path d="M26 170c0 22 34 32 74 32s74-10 74-32c-10 8-38 13-74 13s-64-5-74-13z" fill="#C99A6C" stroke="#5A4A42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M38 182l18 6M64 190l20 2M112 192l22-3M150 186l16-6" stroke="#5A4A42" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const _renderPet2 = renderPet;
renderPet = function(){
  if(!isEmpty()){ $('btnRename').hidden = false; _renderPet2(); return; }
  $('petName').textContent = '빈 둥지'; $('btnRename').hidden = true;
  $('lvText').textContent = 'Lv–'; $('expFill').style.width = '0%'; $('expText').textContent = '';
  $('petLayer').innerHTML = NEST_SVG; $('petLayer').classList.remove('breathe');
  renderTodayCard(); renderStats();
};
const _renderStats2 = renderStats;
renderStats = function(){
  const row = $('statRow');
  if(isEmpty()){ row.hidden = false; row.innerHTML = ''; }
  else _renderStats2();
  const p = S.profile; if(!p) return;
  row.insertAdjacentHTML('afterbegin', `<span class="chip coin">코인 ${p.coins||0}</span>`);
  if(!isEmpty() && p.level >= 10) row.insertAdjacentHTML('beforeend', `<button class="primary grad-btn" id="btnGraduate">🎓 여행 보내기</button>`);
  if(isEmpty()) row.insertAdjacentHTML('beforeend', `<button class="primary grad-btn" id="btnGoShop">상점에서 새 알 데려오기</button>`);
};
$('statRow').addEventListener('click', e=>{ if(e.target.id==='btnGraduate') openGraduation(); if(e.target.id==='btnGoShop') openShop(); });
// 빈 둥지일 때는 성장·리액션을 쉬고, 말풍선만
const _runGrowth2 = runGrowth;

/* ── 여행 ── */
function petSummary(){
  const p = S.profile, rs = Object.values(S.records).filter(r=>!r.sample && r.date >= p.createdAt);
  const sl = rs.map(sleepMinutes).filter(v=>v!=null);
  return { days: dayDiff(p.createdAt, today()) + 1, avgSleep: sl.length ? Math.round(avg(sl)) : null, water: rs.reduce((s,r)=>s+(Number(r.water)||0),0), bestStreak: p.bestStreak||0 };
}
function openGraduation(){
  const p = S.profile, s = petSummary();
  const perfect = !p.hadState && (p.kongState||'normal')==='normal', reward = perfect ? 400 : 200;
  openSheet('떠나는 날', `
    <div class="grad-pet">${drawKongari(p.branch||'basic','adult',p.kongState||'normal',150)}</div>
    <p style="margin:0;text-align:center;font-family:var(--f-display);font-size:19px">${esc(p.petName)} · ${KONG_NAME[p.branch||'basic']} 콩알이</p>
    ${perfect ? '<p class="perfect-line">👑 완벽한 여행! 꼬질이·덜덜이 한 번 없이 자랐어요. 코인 2배!</p>' : ''}
    <div class="stat-grid">
      <div><b>${s.days}일</b><span>함께한 날</span></div>
      <div><b>${s.avgSleep==null?'–':fmtHM(s.avgSleep)}</b><span>평균 수면</span></div>
      <div><b>${s.water}잔</b><span>마신 물 합계</span></div>
      <div><b>${s.bestStreak}일</b><span>최고 연속 달성</span></div>
    </div>
    <p class="hint" style="margin:0">여행하면 도감에 등록되고 코인 ${reward}개를 받아요. 그리고 콩깍지에서 새 아기 콩알이가 태어나요.</p>
    <button class="primary" id="gradOk">여행 보내기 (+${reward} 코인)</button>`, ()=>{
    $('gradOk').addEventListener('click', ()=>{
      const b = p.branch||'basic';
      S.dex.entries.push({ branch:b, name:p.petName, graduatedOn:today(), days:s.days, avgSleep:s.avgSleep, water:s.water, bestStreak:s.bestStreak, perfect });
      p.coins = (p.coins||0) + reward;
      const metAll = Object.keys(KONG_COLOR).every(k=>S.dex.entries.some(e=>e.branch===k));
      const becameDoctor = metAll && !S.dex.doctor;
      if(becameDoctor){ S.dex.doctor = true; if(!S.items.owned.includes('bg_starry')) S.items.owned.push('bg_starry'); save(KEYS.items, S.items); }
      save(KEYS.dex, S.dex);
      const oldName = p.petName;
      hatchNew('콩알이');
      toast(becameDoctor ? `+${reward} 코인 · 도감 완성! '콩알이 박사'와 별밤 정원 배경을 받았어요` : `+${reward} 코인 · ${oldName} 도감 등록`);
      openNewborn();
    });
  });
}
/* ── 상점: 꾸미기만 (알 상점·반짝 알은 없앴다) ── */
function openShop(){

}

/* ── 도감 ── */
function openDex(){
  const met = Object.keys(KONG_COLOR).filter(k=>S.dex.entries.some(e=>e.branch===k)), total = Object.keys(KONG_COLOR).length;
  const cells = Object.keys(KONG_COLOR).map(k=>{
    const list = S.dex.entries.filter(e=>e.branch===k), has = list.length>0, crown = list.some(e=>e.perfect);
    return `<button type="button" class="dex-cell ${has?'':'unmet'}" data-dex="${k}" aria-pressed="false">${crown?'<span class="crown-mini" aria-label="완벽한 여행">👑</span>':''}${drawKongari(k,'adult','normal',80)}<span>${has ? KONG_NAME[k] : '???'}</span></button>`;
  }).join('');
  openSheet('도감', `
    <div class="dex-top"><b>${met.length}/${total}</b><div class="dex-bar"><i style="width:${met.length/total*100}%"></i></div>${S.dex.doctor?'<span class="crown">🏅 콩알이 박사</span>':''}</div>

    <div class="dex-detail" id="dexDetail"><span class="hint">칸을 누르면 자세히 볼 수 있어요. 꼬질이·덜덜이 없이 여행하면 그 칸에 👑, 8칸을 다 채우면 '콩알이 박사' 칭호와 별밤 정원 배경을 받아요.</span></div>`, root=>{

        <p style="margin:0 0 4px">${a.trait}</p><p style="margin:0">“${a.say}”</p>`;
    });
  });

<script>
/* =========================================================
   7단계: 코인 모으기 · 꾸미기 (모자 3 · 안경 2 · 배경 3)
